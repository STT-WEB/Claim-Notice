<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STT CLAIM — Mockup v3 (ตามสเปคที่เบียร์เคาะ)</title>
<style>
*{box-sizing:border-box}
:root{--red:#E2231A;--line:#e3e6ea;--ink:#111;--dim:#6b7280;
      --s1:#1f7fd8;--s2:#d97706;--s3:#15803d;--sa:#64748b}
body{margin:0;background:#eef0f3;color:var(--ink);
     font-family:"Noto Sans Thai","Sarabun",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13.5px}
.bar{background:#fff;border-bottom:3px solid var(--red);padding:0 18px;height:58px;
     display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:60}
.lg{font-weight:800;font-style:italic;color:var(--red);font-size:16px}
.lg span{display:block;font-style:normal;font-weight:400;color:var(--dim);font-size:10px}
.nav{display:flex;gap:5px;margin-left:16px}
.nav button{border:1px solid transparent;background:none;padding:7px 13px;border-radius:8px;
            font-family:inherit;font-size:13.5px;cursor:pointer;color:#374151}
.nav button:hover{background:#f4f5f7}
.nav button.on{background:#fff1f0;border-color:#f3c5c2;color:var(--red);font-weight:700}
.sp{flex:1}
select,input,textarea{font-family:inherit;font-size:13px;border:1px solid var(--line);
     border-radius:7px;padding:7px 9px;background:#fff;color:var(--ink);width:100%}
.wrap{max-width:1260px;margin:0 auto;padding:14px 14px 60px}
.tip{font-size:11.5px;color:#374151;background:#fffbe9;border:1px solid #ece0a8;
     border-radius:8px;padding:8px 11px;margin-bottom:12px;line-height:1.65}
.tip b{color:#000}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:13px}
.hd{display:flex;align-items:center;gap:9px;flex-wrap:wrap;border-bottom:1px solid var(--line);
    padding-bottom:9px;margin-bottom:11px}
.hd h3{margin:0;font-size:15px}
.hd .sub{font-size:12px;color:var(--dim)}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 13px;font-size:13px;
     cursor:pointer;font-family:inherit;white-space:nowrap}
.btn:hover{border-color:#aab2bb}
.btn.p{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.btn.dk{background:#1f2937;border-color:#1f2937;color:#fff}
.btn.dg{color:#c02a2a;border-color:#e8bcbc}
.btn:disabled{opacity:.42;cursor:not-allowed}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid var(--line);padding:7px 9px;font-size:12.5px;vertical-align:middle}
thead th{background:#f7f8fa;color:#111;font-weight:700;font-size:13px;text-align:center}
tbody tr.k{cursor:pointer}
tbody tr.k:hover{background:#fffaf9}
.c{text-align:center}.r{text-align:right}
.pill{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:20px;padding:2px 9px;white-space:nowrap}
.pill.ins{border-color:#bcd9f0;color:#175a91;background:#f2f9ff}
.pill.clm{border-color:#f3c5c2;color:#a3231b;background:#fff5f4}
.pill.g{border-color:#b6e0c2;color:#1f7a3d;background:#f2fbf5}
.pill.r{border-color:#f0c2c2;color:#b3261e;background:#fff5f5}
.pill.y{border-color:#f0dfae;color:#8a6b12;background:#fffaef}
.empty{text-align:center;color:var(--dim);padding:24px;border:1px dashed var(--line);border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 16px}
.f label{display:block;font-size:12px;font-weight:700;margin-bottom:3px}
.f.o1 label{color:var(--s1)}.f.o2 label{color:var(--s2)}.f.o3 label{color:var(--s3)}
.f.oa label{color:var(--sa)}
.f .rq{color:var(--red)}
.locked{background:#f4f5f7;color:#8b929a}
.key{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;color:var(--dim);padding:0 0 10px;align-items:center}
.key i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:4px}
.d1{background:var(--s1)}.d2{background:var(--s2)}.d3{background:var(--s3)}.da{background:var(--sa)}

/* งานตามจ๊อบ */
.jt{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.jt button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 18px;
           font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;color:#374151}
.jt button.on{border-color:var(--red);color:var(--red);background:#fff6f5}
.jt button small{display:block;font-weight:400;font-size:11px;color:var(--dim)}

/* กล่องงาน 5 แท็บ */
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:11px}
.tb{flex:1 1 175px;display:flex;align-items:center;gap:7px;cursor:pointer;background:#fff;
    border:1px solid var(--line);border-radius:11px;padding:10px 12px;text-align:left;font-family:inherit}
.tb.on{border-color:var(--red);box-shadow:0 0 0 2px rgba(226,35,26,.10)}
.tb .n{font-size:15px;color:#9aa3ad}.tb.on .n{color:var(--red)}
.tb .t{flex:1;font-size:12.5px;font-weight:700;color:#374151}.tb.on .t{color:#111}
.tb .c2{min-width:23px;text-align:center;font-size:12px;font-weight:700;color:#9aa3ad;
        background:#f2f4f6;border-radius:20px;padding:2px 7px}
.tb .c2.has{background:var(--red);color:#fff}
.tb.mine{background:#fffdf6}.tb.mine .t:after{content:' ✋'}
.note{font-size:12px;background:#f6fbff;border:1px solid #cfe4f5;border-radius:8px;padding:8px 11px;
      margin-bottom:10px;line-height:1.6}
.note.no{background:#fafbfc;border-color:var(--line);color:var(--dim)}

/* ขั้นตอน */
.flow{border:1px solid var(--line);border-radius:11px;padding:11px;margin-bottom:11px;background:#fcfcfd}
.steps{display:flex;align-items:center;gap:3px;flex-wrap:wrap;margin-bottom:9px}
.st{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:20px;
    padding:4px 10px;font-size:11px;color:#9aa3ad;background:#fff;white-space:nowrap}
.st b{display:inline-flex;width:17px;height:17px;border-radius:50%;background:#eceff2;color:#7b838c;
      align-items:center;justify-content:center;font-size:10px}
.st.done{color:#1f7a3d;border-color:#b6e0c2}.st.done b{background:#2fbf5f;color:#fff}
.st.now{color:var(--red);border-color:var(--red);font-weight:700}.st.now b{background:var(--red);color:#fff}
.arw{color:#c9ced4;font-size:11px}
.todo{font-size:12px;color:var(--dim);margin-top:3px;line-height:1.6}
.miss{margin-top:8px;font-size:12px;background:#fffaef;border:1px solid #f0dfae;color:#8a6b12;border-radius:8px;padding:7px 10px}
.acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px;align-items:center}
.vw{font-size:12px;color:var(--dim)}

/* ลายเซ็น 2 รอบ */
.sgh{font-size:12.5px;font-weight:700;margin:12px 0 6px}
.sgh span{font-weight:400;color:var(--dim);font-size:11.5px}
.sign{display:flex;gap:8px;flex-wrap:wrap}
.sg{flex:1 1 155px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-height:62px}
.sg i{display:block;font-style:normal;font-size:10px;color:#8b929a;margin-bottom:3px}
.sg b{display:block;font-size:11.5px;font-weight:600;line-height:1.5}
.sg small{display:block;color:var(--dim);font-weight:400;font-size:10.5px}
.sg.wait{background:#fbfcfd}.sg.wait b{color:#c3c8ce;font-weight:400}
.sg.next{border-color:var(--red);background:#fff8f7}
.gate{margin-top:9px;font-size:12px;background:#f4f5f7;border:1px solid var(--line);
      border-radius:8px;padding:7px 10px;color:#4b5563}
.gate.ok{background:#f2fbf5;border-color:#b6e0c2;color:#1f7a3d}

.ph{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.thumb{width:50px;height:38px;border-radius:6px;background:linear-gradient(135deg,#c9d3dc,#96a3af);
       display:flex;align-items:center;justify-content:center;font-size:14px}
.addph{width:50px;height:38px;border:1px dashed #c3c8ce;border-radius:6px;display:flex;
       align-items:center;justify-content:center;color:#9aa3ad;font-size:15px}
.needph{font-size:10px;color:#b3261e;border:1px solid #f0c2c2;border-radius:5px;padding:1px 5px;background:#fff5f5}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pk{border:1px solid var(--line);border-radius:12px;padding:18px;cursor:pointer;background:#fff}
.pk:hover{border-color:var(--red);background:#fffaf9}
.pk h4{margin:0 0 5px;font-size:15px}
.pk p{margin:0;font-size:12px;color:var(--dim);line-height:1.7}
.pk .ic{font-size:26px;margin-bottom:6px}
/* แถบส่งงาน */
.hoff{border:1px solid #cfe4f5;background:#f8fcff;border-radius:10px;padding:10px 12px;margin-top:9px}
.hoff.done{border-color:#b6e0c2;background:#f2fbf5;color:#1f7a3d;font-size:12.5px}
.hh{font-size:11.5px;color:#175a91;font-weight:700;margin-bottom:7px}
.hrow{display:flex;align-items:stretch;gap:9px;flex-wrap:wrap}
.hbox{flex:0 1 190px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px}
.hbox.now{border-color:var(--red);background:#fff8f7}
.hbox.ok{border-color:#b6e0c2;background:#f2fbf5}
.hbox i{display:block;font-style:normal;font-size:10px;color:#8b929a}
.hbox b{display:block;font-size:12.5px;margin-top:2px}
.hbox small{display:block;font-size:11px;color:var(--dim)}
.hln{display:block;font-size:10.5px;color:#175a91;margin-top:4px}
.harw{display:flex;flex-direction:column;justify-content:center;align-items:center;
      color:#9aa3ad;font-size:15px;min-width:150px}
.harw span{font-size:10px;color:#8b929a;margin-bottom:3px}
.hbtn{border:1px dashed #c3c8ce;border-radius:7px;padding:4px 10px;font-size:11.5px;
      color:#6b7280;background:#fff;white-space:nowrap;margin-bottom:2px}
.hbtn.live{border-style:solid;border-color:var(--red);color:var(--red);font-weight:700;background:#fff6f5}
.hrow.rj{margin-top:8px;align-items:center;font-size:11.5px;color:var(--dim)}
.hlbl{font-size:11.5px;color:var(--dim)}
@media(max-width:860px){.grid{grid-template-columns:1fr}.tb{flex:1 1 100%}.pick{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="bar">
  <div class="lg">STT CLAIM <span>งานเคลม · ตรวจรับสินค้า — Mockup v3</span></div>
  <div class="nav">
    <button id="n_job"  onclick="go('jobs')">🚛 งานตามจ๊อบ</button>
    <button id="n_box"  onclick="go('box')">📋 กล่องงานของฉัน</button>
    <button id="n_reg"  onclick="go('reg')">🗂️ ทะเบียนเอกสาร</button>
    <button id="n_map"  onclick="go('map')">🔄 การส่งงาน</button>
  </div>
  <div class="sp"></div>
  <span style="font-size:12px;color:#6b7280">ทดลองเป็น:</span>
  <select style="width:auto" id="role" onchange="setRole(this.value)">
    <option value="TEAM">คุณสมชาย · QC (ผู้แจ้ง)</option>
    <option value="APPROVER">คุณวิชัย · ผจก.ผลิต (ผู้อนุมัติ)</option>
    <option value="STORE">คุณนภา · สโตร์</option>
    <option value="PURCHASE">คุณเอ · จัดซื้อ</option>
    <option value="ADMIN">เบียร์ · ผู้บริหาร</option>
  </select>
  <button class="btn" onclick="reset()">↺ เริ่มใหม่</button>
</div>

<div class="wrap">
  <div class="tip" id="tip"></div>
  <div id="view"></div>
</div>

<script>
/* ════════════════════════════════════════════════════════════════
   Mockup v3 — แก้ตามสเปคที่เบียร์ตรวจแล้ว (สเปคงานเคลม ข้อ 7 และ ข้อ 10)
   สิ่งที่ v2 ผิด และแก้ในนี้:
     1. v2 ไม่มี Inspection เลย — ทั้งที่เอกสารในระบบมี 2 อย่าง
     2. v2 เอา 5 แท็บมาแทนหน้าแรก — แต่สเปคข้อ 10 บอกว่าแกนหลักคือ "เลขจ๊อบ"
        (เลือกประเภทงาน JT|JM|JMC|JMS → เลือกจ๊อบ → เอกสารของจ๊อบนั้น)
        5 แท็บเป็น "กล่องงานของฉัน" อยู่ข้าง ๆ ไม่ใช่มาแทน
     3. v2 ทำลายเซ็น 5 ช่อง — สเปคข้อ 7 คือ 7 ช่อง 2 รอบ
     4. v2 ไม่มีกฎ "ครบ 4 ช่องแรกก่อน ปุ่มพิมพ์ใบส่ง Supplier ถึงเปิด"
   ════════════════════════════════════════════════════════════════ */

var ME={TEAM:{n:'คุณสมชาย',p:'QC',r:['QC']},APPROVER:{n:'คุณวิชัย',p:'ผจก.ผลิต',r:['APPROVER']},
        STORE:{n:'คุณนภา',p:'สโตร์',r:['STORE']},PURCHASE:{n:'คุณเอ',p:'จัดซื้อ',r:['PURCHASE']},
        ADMIN:{n:'เบียร์',p:'ผู้บริหาร',r:['ADMIN']}};

  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function now(){var d=new Date(),p=function(n){return String(n).padStart(2,'0');};
  return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+(d.getFullYear()+543)+' '+p(d.getHours())+':'+p(d.getMinutes());}

             buy:['PURCHASE'],res:['PURCHASE'],qc:['QC','PRODUCTION'],close:['ADMIN']};

var TABS=[['open','①','เปิดใบขอเคลม','req',['QC','PRODUCTION','DESIGN','SALES']],
          ['appr','②','อนุมัติ','appr',['APPROVER']],
          ['store','③','งานสโตร์','store',['STORE','PURCHASE']],
          ['buy','④','งานจัดซื้อ','buy',['PURCHASE','STORE']],
          ['close','⑤','อนุมัติ ปิดจบ','close',['ADMIN']]];

function seed(){return {
 jobs:[{no:'JT-69/0009',type:'JT',cust:'โชคชัยพัฒนาออยล์',model:'SEMI-TRAILER 32,000 L',

/* ช่องลายเซ็นถัดไปที่รอ = สถานะของเอกสาร */
function nextSlot(d){
  var all=SIGN1.concat(SIGN2);
  for(var i=0;i<all.length;i++) if(!d.sign[all[i].k]) return all[i];
  return null;
}
function slotNo(d){var s=nextSlot(d);return s?SIGN1.concat(SIGN2).indexOf(s)+1:8;}
function isDraft(d){return !d.sign.req;}          /* ยังไม่ส่งอนุมัติ = ร่าง */
function canSign(d,slot){
  if(!slot) return false;
  var r=me().r;
  if(r.indexOf('ADMIN')>=0 && slot.k==='close') return true;
  for(var i=0;i<r.length;i++) if((ROLE_OF[slot.k]||[]).indexOf(r[i])>=0) return true;
  return false;
}
/* ร่างของทีมงาน สโตร์กับจัดซื้อไม่เห็น */
function canSee(d){
  if(d.kind==='INS') return d.sign.req || me().n===d.by || me().r.indexOf('ADMIN')>=0 || me().r.indexOf('APPROVER')>=0;
  if(!isDraft(d)) return true;
  var r=me().r;
  return r.indexOf('ADMIN')>=0||r.indexOf('APPROVER')>=0||me().n===d.by||me().p===d.dept;
}
function missing(d){
  var m=[];
  if(d.kind==='INS'){
    var todo=[],np=[];
    for(var i=0;i<d.items.length;i++){
      if(!d.items[i].acc) todo.push(i+1);
      else if(d.items[i].acc==='UNACC'&&!d.items[i].ph) np.push(i+1);
    }
    if(todo.length) m.push('ข้อ '+todo.join(', ')+' ยังไม่ได้ติ๊กผลตรวจ');
    if(np.length)   m.push('ข้อ '+np.join(', ')+' ไม่ผ่านแต่ยังไม่มีรูป');
    return m;
  }
  var s=nextSlot(d); if(!s) return m;
  if(s.k==='req'){
    var bad=[],nop=[];
    for(var k=0;k<d.items.length;k++){ if(!d.items[k].nm||!d.items[k].th) bad.push(k+1);
                                       if(!d.items[k].ph) nop.push(k+1); }
    if(!d.want) m.push('ยังไม่ใส่วันที่ต้องการของ');
    if(bad.length) m.push('รายการที่ '+bad.join(', ')+' ยังไม่ใส่ชื่อสินค้า/รายละเอียด');
    if(nop.length) m.push('รายการที่ '+nop.join(', ')+' ยังไม่มีรูป');
  }
  if(s.k==='store'){
    if(!d.dn) m.push('ยังไม่ใส่เลขใบส่งมอบ');
    var np2=[],ns=[];
    for(var q=0;q<d.items.length;q++){ if(!d.items[q].po) np2.push(q+1); if(!d.items[q].sup) ns.push(q+1); }
    if(np2.length) m.push('รายการที่ '+np2.join(', ')+' ยังไม่มี PO');
    if(ns.length)  m.push('รายการที่ '+ns.join(', ')+' ยังไม่มี Supplier');
  }
  return m;
}
function round1Done(d){ return SIGN1.every(function(s){return !!d.sign[s.k];}); }

function go(v,arg){

  if(v==='reg') $('n_reg').className='on';
  if(v==='map') $('n_map').className='on';
  if(v==='jobs') return jobsPage();
  if(v==='job')  return jobPage(arg||CURJOB);
  if(v==='box')  return boxPage();
  if(v==='reg')  return regPage();
  if(v==='pick') return pickPage();
  if(v==='map')  return mapPage();
}

  t+='<table><thead><tr><th style="width:38px">#</th><th style="width:150px">ใบอยู่ที่ใคร</th>'+
    '<th style="width:210px">เขากดปุ่มอะไร</th><th style="width:150px">แล้ววิ่งไปหาใคร</th>'+
    '<th style="width:150px">โผล่ในกล่องงาน</th><th>เขาต้องทำอะไร</th></tr></thead><tbody>';
  var TODO={req:'กรอกข้อมูลรถ + รายการที่เคลม + แนบรูปทุกรายการ (บันทึกร่างไว้ก่อนได้)',
            appr:'ตรวจว่าเคลมนี้สมควรออกไหม · ไม่โอเคกดตีกลับ',
            store:'ดูว่ามีของในสโตร์ไหม เบิกไปติดตั้งให้ลูกค้าก่อน · เติมเลขใบส่งมอบ · PO · Supplier',
            buy:'รับเรื่องไปเคลมกับ Supplier · เอารูปและข้อมูลส่งให้เขา',
            res:'Supplier ตอบมาว่ายังไง · บันทึกผล · ใส่ราคาถ้าต้องเรียกเก็บ',
            qc:'ของกลับมาแล้ว ถ่ายรูป · ติ๊ก Accept / ไม่ Accept (ไม่ Accept = วนเคลมรอบใหม่)',
            close:'อนุมัติปิดใบเคลม · ตัดสินว่าต้นทุนลงที่ไหน (หัก HR หรือเป็นต้นทุนรถ)'};
  all.forEach(function(x,i){
    var nx=nextOf(x.k);
    t+='<tr><td class="c">'+(i+1)+'</td>'+
      '<td><b>'+esc(x.t.split('. ')[1])+'</b><br><span class="sub">'+esc(PERSON[x.k])+'</span></td>'+
      '<td><span class="hbtn live" style="display:inline-block">'+esc(x.act)+'</span></td>'+
      '<td>'+(nx?'<b>'+esc(nx.t.split('. ')[1])+'</b><br><span class="sub">'+esc(PERSON[nx.k])+'</span>'
                :'<span class="pill g">ปิดจบ</span>')+'</td>'+
      '<td>'+(nx?esc(tabOf(nx.k))+'<br><span class="sub">🔔 '+esc(LINEG[nx.k]||'')+'</span>':'—')+'</td>'+
      '<td class="sub">'+esc(TODO[x.k]||'')+'</td></tr>';
  });
  t+='</tbody></table>';
  t+='<div class="note" style="margin-top:12px">🔁 <b>ตีกลับได้ทุกขั้นหลังขั้นที่ 1</b> — '+
    'ผู้อนุมัติ / สโตร์ / จัดซื้อ กด "ตีกลับ" พร้อมเหตุผล → ใบวิ่งกลับไปหา<b>ผู้แจ้ง</b> ให้แก้ '+
    'แล้วเดินใหม่ตั้งแต่ต้น · ทุกครั้งที่ตีกลับ ระบบจดไว้ในประวัติว่าใครตีกลับ เพราะอะไร</div>';
  t+='<div class="note">🖨️ <b>ประตูที่ต้องผ่านก่อนพิมพ์</b> — ลายเซ็นช่อง 1-4 ครบเมื่อไหร่ '+
    'ปุ่ม "พิมพ์ใบส่ง Supplier" ถึงเปิดใช้ได้ (สเปคข้อ 7) · ก่อนหน้านั้นกดไม่ได้</div>';
  t+='</div>';

  t+='<div class="card"><div class="hd"><h3>ใบตรวจรับ (Inspection) ส่งงานยังไง</h3>'+
    '<span class="sub">สั้นกว่าใบเคลม เพราะจบที่การตรวจ แล้วค่อยแตกเป็นใบเคลม</span></div>'+
    '<table><thead><tr><th style="width:38px">#</th><th style="width:160px">ใบอยู่ที่ใคร</th>'+
    '<th style="width:230px">กดปุ่มอะไร</th><th>เกิดอะไรขึ้น</th></tr></thead><tbody>'+
    '<tr><td class="c">1</td><td><b>ผู้ตรวจ</b><br><span class="sub">PD / QC / Design ตรวจร่วมกัน</span></td>'+
    '<td><span class="hbtn live" style="display:inline-block">✓ ตรวจครบแล้ว</span></td>'+
    '<td class="sub">ติ๊ก Acc / Un-Acc ทุกข้อ + ถ่ายรูปข้อที่ไม่ผ่าน · ครบแล้วปิดใบตรวจ</td></tr>'+
    '<tr><td class="c">2</td><td><b>ผู้ตรวจ</b></td>'+
    '<td><span class="hbtn live" style="display:inline-block">➜ ดึงข้อที่ Un-Acc ไปเปิดใบเคลม</span></td>'+
    '<td class="sub"><b>ระบบสร้างใบเคลมให้เลย</b> รายละเอียดและรูปของข้อที่ไม่ผ่านตามไปด้วย '+
    'ไม่ต้องพิมพ์ใหม่ → จากนั้นใบเคลมเดินตามตาราง 7 ขั้นข้างบน</td></tr>'+
    '<tr><td class="c">3</td><td><b>ผ่านหมด</b></td><td>—</td>'+
    '<td class="sub">ไม่มีข้อไหน Un-Acc = จบที่ใบตรวจ ไม่ต้องเปิดใบเคลม</td></tr>'+
    '</tbody></table></div>';
  $('view').innerHTML=t;
  tip('<b>อ่านตารางนี้จากซ้ายไปขวา</b> — ใบอยู่ที่ใคร → เขากดปุ่มอะไร → ใบวิ่งไปหาใคร → '+
      'โผล่ในกล่องงานแท็บไหน · <b>ไม่มีอะไรวิ่งเอง ทุกการส่งต่อต้องมีคนกดปุ่มเสมอ</b> '+
      'และการกดปุ่ม = เซ็นชื่อลงเอกสารด้วยในตัว');
}
function sgBox(d,x,next){
  var v=d.sign[x.k]||'', p=v.split(' · '), isNext=next&&next.k===x.k;
  return '<div class="sg'+(v?'':(isNext?' next':' wait'))+'"><i>'+esc(x.t)+' · '+esc(x.act)+'</i>'+
    (v?'<b>'+esc(p[0])+'<small>'+esc(p[1]||'')+'</small><small>'+esc(p[2]||'')+'</small></b>'
      :'<b>'+(isNext?'⏳ รอคนนี้กด':'— ยังไม่ถึงคิว —')+'<small>'+esc(x.who)+'</small></b>')+'</div>';
}
function sign(no){
  var d=doc(no), s=nextSlot(d);
  var m=missing(d);
  if(m.length){ alert('ยังเซ็นไม่ได้\n\n· '+m.join('\n· ')); return; }
  d.sign[s.k]=me().n+' · '+me().p+' · '+now();
  openDoc(no);
  var nx=nextSlot(d);
  setTimeout(function(){
    alert('เซ็นเรียบร้อย — '+s.t+'\n\n'+
      (nx?('ใบนี้ไปอยู่กล่องงาน "'+tabOf(nx.k)+'" แล้ว\nระบบเด้ง LINE แจ้ง '+nx.who+' ให้เอง')
         :'ครบ 7 ช่อง — ปิดใบเคลมเรียบร้อย')+
      (round1Done(d)&&s.k==='buy'?'\n\n✓ ครบ 4 ช่องแรกแล้ว — ปุ่มพิมพ์ใบส่ง Supplier เปิดใช้ได้':''));
  },60);
}
function tabOf(k){ var o=''; TABS.forEach(function(t){ if(t[3]===k) o=t[2]; }); return o||'—'; }

go('jobs');
</script>
