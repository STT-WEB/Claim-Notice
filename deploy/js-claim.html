<script>
/* ═══ ใบแจ้งเคลม: ฟอร์มเปิดใบ · ทะเบียนเอกสาร · เปิดดู ═══ */
var VENDORS = null;
var FORM = { docNo:'', items:[] };

function blankItem(){
  return { code:'', name:'', th:'', en:'', qty:'', unit:'', po:'', supplier:'', recv:'', note:'' };
}

/* ─────────── ฟอร์มเปิดใบแจ้งเคลม ─────────── */
function newClaimForm(){
  FORM = { docNo:'', items:[blankItem(), blankItem()] };
  drawForm('เปิดใบแจ้งเคลม (ใบใหม่)');
  if (!VENDORS) srv('listVendors', [], function(v){ VENDORS = v || []; fillVendorList(); });
  else fillVendorList();
}

function drawForm(title){
  var t = '';
  t += '<div class="card tight"><div class="cardhd"><h3>' + esc(title) + '</h3>' +
       '<span class="sub">ใบแจ้งเคลมรอบแรก ไม่มีเรื่องราคา · ราคาจะใส่ทีหลังในใบเรียกเก็บค่าเคลม</span>' +
       '<button class="btn" id="saveBtn" onclick="submitClaim()">💾 บันทึกใบแจ้งเคลม</button></div>';
  t += '<div id="fmsg"></div>';
  t += '<div class="phnote">📷 <b>รูปคือหลักฐาน</b> — บันทึกใบแจ้งเคลมก่อน 1 ครั้ง ระบบจะเปิดหน้าใบเคลมให้แนบรูปทีละรายการ ' +
       'ถ้ารายการไหนไม่มีรูป ระบบจะไม่ยอมให้ส่งเคลม</div>';
  t += '<div class="fgrid">';
  t += fr('ประเภทการเคลม', '<select id="f_claimType"><option value="after">หลังส่งมอบ (After-Sales)</option><option value="pre">ก่อนส่งมอบ (Pre-Delivery)</option></select>');
  t += fr('เลขที่ JOB', '<input id="f_jobNo" placeholder="JT-69/0009" onblur="jobLookup()">');
  t += fr('ชื่อลูกค้า', '<input id="f_jobName">');

  t += fr('พื้นที่', '<select id="f_area" onchange="areaChanged()"><option value="dom">ในประเทศ</option><option value="for">ต่างประเทศ</option></select>');
  t += fr('MODEL', '<input id="f_model">');
  t += fr('SERIAL NO.', '<input id="f_serialNo">');

  t += '<div id="f_fkwrap" style="display:none">' + fr('ชนิดงาน ตปท.', '<select id="f_foreignKind"><option value="equip">อุปกรณ์ (ผ่านสโตร์)</option><option value="tanker">Tankers (ไม่ผ่านสโตร์)</option></select>') + '</div>';
  t += fr('CHASSIS <i>STT</i>', '<input id="f_chassisStt">');
  t += fr('CHASSIS <i>ผู้ผลิต</i>', '<input id="f_chassisMaker">');

  t += fr('JMC ที่ผูก', '<input id="f_jmc" placeholder="เว้นว่างได้ เติมทีหลัง">');
  t += fr('เลขใบส่งมอบ', '<input id="f_deliveryNote">');
  t += fr('แผนกที่ขอเคลม', '<input id="f_dept">');
  t += fr('วันที่ต้องการของ', '<input id="f_wantDate" placeholder="DD/MM/YYYY">');
  t += '</div></div>';

  t += '<div class="card tight"><div class="cardhd"><h3>รายการที่เคลม</h3>' +
       '<span class="sub">จำนวนใส่มายังไงเก็บตามนั้น ไม่ปัดเอง · วันที่ DD/MM/YYYY</span>' +
       '<button class="btn ghost" onclick="addRow()">+ เพิ่มแถว</button>' +
       '<button class="btn ghost" onclick="translateAll()">🌐 แปลไทย → EN</button></div>';
  t += '<div style="overflow-x:auto"><table class="t" id="itab"><thead><tr>' +
       '<th style="width:30px">ที่</th><th style="width:104px">รหัสสินค้า</th><th style="width:160px">ชื่อสินค้า</th>' +
       '<th>รายละเอียดการเคลม (ไทย)</th><th>Claim description (EN)</th>' +
       '<th style="width:56px">จำนวน</th><th style="width:62px">หน่วย</th>' +
       '<th style="width:110px">PO</th><th style="width:170px">Supplier</th>' +
       '<th style="width:98px">วันรับสินค้า</th><th style="width:28px"></th></tr></thead><tbody></tbody></table></div>';
  t += '</div>';
  $('view').innerHTML = t;
  renderRows();
}
function fr(label, ctrl){ return '<div class="frow"><label>' + label + '</label>' + ctrl + '</div>'; }
function fld(label, ctrl){ return '<div class="fld"><label>' + label + '</label>' + ctrl + '</div>'; }
function areaChanged(){
  $('f_fkwrap').style.display = ($('f_area').value === 'for') ? '' : 'none';
}

function renderRows(){
  var tb = $('itab').getElementsByTagName('tbody')[0];
  var h = '';
  for (var i = 0; i < FORM.items.length; i++){
    var it = FORM.items[i];
    h += '<tr>' +
      '<td class="c">' + (i+1) + '</td>' +
      '<td><input data-k="code" data-i="' + i + '" value="' + esc(it.code) + '" onblur="goodLookup(' + i + ')"></td>' +
      '<td><input data-k="name" data-i="' + i + '" value="' + esc(it.name) + '"></td>' +
      '<td><textarea data-k="th" data-i="' + i + '">' + esc(it.th) + '</textarea></td>' +
      '<td><textarea data-k="en" data-i="' + i + '">' + esc(it.en) + '</textarea></td>' +
      '<td><input data-k="qty" data-i="' + i + '" class="r" value="' + esc(it.qty) + '"></td>' +
      '<td><input data-k="unit" data-i="' + i + '" value="' + esc(it.unit) + '"></td>' +
      '<td><input data-k="po" data-i="' + i + '" value="' + esc(it.po) + '"></td>' +
      '<td><input data-k="supplier" data-i="' + i + '" list="vlist" value="' + esc(it.supplier) + '"></td>' +
      '<td><input data-k="recv" data-i="' + i + '" value="' + esc(it.recv) + '" placeholder="DD/MM/YYYY"></td>' +
      '<td class="c"><button class="rowbtn" onclick="delRow(' + i + ')" title="ลบแถวนี้">&#10005;</button></td>' +
      '</tr>';
  }
  tb.innerHTML = h;
  var ins = tb.querySelectorAll('input,textarea');
  for (var k = 0; k < ins.length; k++){
    ins[k].addEventListener('change', function(){
      FORM.items[+this.getAttribute('data-i')][this.getAttribute('data-k')] = this.value;
    });
  }
  fillVendorList();
}
function fillVendorList(){
  var old = $('vlist'); if (old) old.parentNode.removeChild(old);
  if (!VENDORS || !VENDORS.length) return;
  var dl = document.createElement('datalist'); dl.id = 'vlist';
  var lim = Math.min(VENDORS.length, 400), h = '';
  for (var i = 0; i < lim; i++) h += '<option value="' + esc(VENDORS[i]) + '"></option>';
  dl.innerHTML = h;
  document.body.appendChild(dl);
}
function collect(){
  var tb = $('itab').getElementsByTagName('tbody')[0];
  var ins = tb.querySelectorAll('input,textarea');
  for (var k = 0; k < ins.length; k++){
    FORM.items[+ins[k].getAttribute('data-i')][ins[k].getAttribute('data-k')] = ins[k].value;
  }
}
function addRow(){ collect(); FORM.items.push(blankItem()); renderRows(); }
function delRow(i){ collect(); FORM.items.splice(i,1); if (!FORM.items.length) FORM.items.push(blankItem()); renderRows(); }

function jobLookup(){
  var j = $('f_jobNo').value.trim();
  if (!j) return;
  srv('lookupJob', [j], function(r){
    if (!r || !r.found){ $('fmsg').innerHTML = '<div class="msg bad">ไม่พบเลขจ๊อบ ' + esc(j) + ' ในทะเบียนงาน — กรอกข้อมูลรถเองได้</div>'; return; }
    $('fmsg').innerHTML = '<div class="msg good">พบจ๊อบ ' + esc(r.jobNo) + ' แล้ว — เด้งข้อมูลให้อัตโนมัติ</div>';
    if (r.jobName) $('f_jobName').value = r.jobName;
    if (r.model)   $('f_model').value   = r.model;
    if (r.loc && String(r.loc).indexOf('ต่าง') >= 0){ $('f_area').value = 'for'; areaChanged(); }
  }, function(m){ $('fmsg').innerHTML = '<div class="msg bad">' + esc(m) + '</div>'; });
}
function goodLookup(i){ /* รอบถัดไป: ใส่รหัสแล้วเด้งชื่อ/หน่วยจาก Data Good Code */ }
function translateAll(){ alert('ตัวแปลภาษาจะเปิดใช้ในรอบถัดไปครับ'); }

function submitClaim(){
  collect();
  var jobNo = $('f_jobNo').value.trim();
  if (!jobNo){ $('fmsg').innerHTML = '<div class="msg bad">ต้องระบุเลขที่ JOB ก่อน</div>'; return; }
  var any = false;
  for (var i = 0; i < FORM.items.length; i++){
    if (String(FORM.items[i].name).trim() || String(FORM.items[i].code).trim()) any = true;
  }
  if (!any){ $('fmsg').innerHTML = '<div class="msg bad">ต้องมีรายการที่เคลมอย่างน้อย 1 รายการ</div>'; return; }

  var h = {
    claimType : $('f_claimType').value,
    area      : $('f_area').value,
    foreignKind : ($('f_area').value === 'for') ? $('f_foreignKind').value : '',
    jobNo:jobNo, jobName:$('f_jobName').value, model:$('f_model').value,
    chassisStt:$('f_chassisStt').value, chassisMaker:$('f_chassisMaker').value,
    serialNo:$('f_serialNo').value, jmc:$('f_jmc').value,
    deliveryNote:$('f_deliveryNote').value, dept:$('f_dept').value,
    wantDate:$('f_wantDate').value,
    items: FORM.items
  };
  $('saveBtn').disabled = true; $('saveBtn').textContent = 'กำลังบันทึก…';
  srv('createClaim', [h, AUTH], function(r){
    $('saveBtn').disabled = false; $('saveBtn').textContent = '💾 บันทึกใบแจ้งเคลม';
    if (!r || !r.ok){ $('fmsg').innerHTML = '<div class="msg bad">บันทึกไม่สำเร็จ</div>'; return; }
    go('claim', r.docNo);
  }, function(m){
    $('saveBtn').disabled = false; $('saveBtn').textContent = '💾 บันทึกใบแจ้งเคลม';
    $('fmsg').innerHTML = '<div class="msg bad">' + esc(m) + '</div>';
  });
}

/* ─────────── ทะเบียนเอกสาร ─────────── */
function loadList(){
  busy(true, 'กำลังโหลดทะเบียนเอกสาร…');
  srv('listClaims', [{}, AUTH], function(rows){
    var t = '<div class="card"><h3>ทะเบียนเอกสาร</h3>';
    t += '<div style="margin-bottom:10px"><button class="btn primary" onclick="go(\'newclaim\')">+ เปิดใบแจ้งเคลมใหม่</button></div>';
    if (!rows || !rows.length){
      t += '<div class="hint">ยังไม่มีเอกสารในระบบ</div></div>';
      $('view').innerHTML = t; return;
    }
    t += '<table class="t"><thead><tr><th style="width:120px">เลขที่เอกสาร</th><th style="width:92px">วันที่</th>' +
         '<th style="width:120px">ประเภท</th><th style="width:120px">เลขที่ JOB</th><th>ชื่อลูกค้า</th>' +
         '<th style="width:104px">รูปหลักฐาน</th>' +
         '<th style="width:96px">สถานะ</th><th style="width:120px">ผู้เปิด</th></tr></thead><tbody>';
    for (var i = 0; i < rows.length; i++){
      var r = rows[i];
      t += '<tr style="cursor:pointer" onclick="go(\'claim\',\'' + r.docNo + '\')">' +
        '<td><b>' + esc(r.docNo) + '</b></td><td class="c">' + esc(r.date) + '</td>' +
        '<td>' + (r.claimType === 'pre' ? 'ก่อนส่งมอบ' : 'หลังส่งมอบ') + ' · ' + (r.area === 'for' ? 'ต่างประเทศ' : 'ในประเทศ') + '</td>' +
        '<td>' + esc(r.jobNo) + '</td><td>' + esc(r.jobName) + '</td>' +
        '<td class="c">' + photoPill(r) + '</td>' +
        '<td class="c">' + esc(r.status) + '</td><td>' + esc(r.by) + '</td></tr>';
    }
    t += '</tbody></table></div>';
    $('view').innerHTML = t;
  });
}

/* ─────────── เปิดดูใบเคลม (v0.2.0 · เห็นรูปทุกรายการ) ─────────── */
function openClaim(docNo){
  busy(true, 'กำลังเปิด ' + docNo + '…');
  srv('getClaim', [docNo, AUTH], function(c){
    if (!c){ $('view').innerHTML = '<div class="msg bad">ไม่พบเอกสาร ' + esc(docNo) + '</div>'; return; }
    var h = c.head;
    CURDOC = docNo;
    CURJOB = h['เลขที่ JOB'] || '';
    PHOTOS = c.photos || {};

    /* นับว่ารายการไหนมีรูปแล้วบ้าง — รูปคือหลักฐาน ไม่มีรูป = เคลมไม่ได้ */
    var nHave = 0, missing = [];
    for (var i = 0; i < c.items.length; i++){
      var sq = String(c.items[i].seq);
      if (PHOTOS[sq] && PHOTOS[sq].length) nHave++; else missing.push(sq);
    }

    var t = '<div class="card noprint"><h3>' + esc(h['เลขที่เอกสาร']) + ' — ใบแจ้งเคลมสินค้า</h3>' +
      '<div class="grid2"><div>' +
      row('เลขที่ JOB', h['เลขที่ JOB']) + row('ชื่อลูกค้า', h['ชื่อลูกค้า']) +
      row('MODEL', h['MODEL']) + row('CHASSIS NO. (STT)', h['CHASSIS NO. (STT)']) +
      row('CHASSIS NO. (ผู้ผลิต)', h['CHASSIS NO. (ผู้ผลิต)']) +
      '</div><div>' +
      row('วันที่', h['วันที่']) +
      row('ประเภทการเคลม', h['ประเภทการเคลม'] === 'pre' ? 'ก่อนส่งมอบ' : 'หลังส่งมอบ') +
      row('พื้นที่', h['พื้นที่'] === 'for' ? 'ต่างประเทศ' : 'ในประเทศ') +
      row('SERIAL NO.', h['SERIAL NO.']) + row('JMC ที่ผูก', h['JMC ที่ผูก'] || '— ยังไม่ผูก —') +
      '</div></div>';

    t += '<div class="phbar ' + (missing.length ? 'bad' : 'good') + '" id="phbar">' +
         (missing.length
            ? '📷 รูปหลักฐาน ' + nHave + ' / ' + c.items.length + ' รายการ — <b>ยังขาดรายการที่ ' + missing.join(', ') + '</b> · ยังส่งเคลมไม่ได้'
            : '📷 รูปหลักฐานครบทุกรายการแล้ว (' + c.items.length + ' รายการ) · พร้อมส่งเคลม') +
         '</div>';

    t += '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="btn" onclick="go(\'list\')">← กลับทะเบียน</button>' +
      '<button class="btn ghost" onclick="openMediaFolder()">📁 เปิดโฟลเดอร์รูปใน Drive</button>' +
      '<button class="btn ghost" onclick="checkPhotos()">✅ ตรวจความครบของรูป</button>' +
      '<button class="btn dark" onclick="window.print()">🖨️ ปริ้น / บันทึกเป็น PDF</button></div>' +
      '<div class="hint" style="margin-top:6px">แบบฟอร์มปริ้นเต็มรูปแบบ (หัวกระดาษ SUTEE · แยกใบตาม Supplier · เลขหน้า x/y) จะต่อในรอบถัดไป</div>' +
      '</div>';

    t += '<div class="card"><h3>รายการที่เคลม (' + c.items.length + ' รายการ)</h3>' +
         '<div class="hint" style="margin-bottom:10px">ทุกรายการต้องมีรูปถ่ายหลักฐาน กดที่รูปเพื่อดูใหญ่ · กด <b>+ เพิ่มรูป</b> เพื่อแนบรูปจากมือถือหรือเครื่อง</div>';
    for (var i = 0; i < c.items.length; i++){
      var it = c.items[i];
      t += '<div class="itemcard">' +
        '<div class="ihd"><span class="ino">' + esc(it.seq) + '</span>' +
        '<span class="inm">' + esc(it.name || '—') + '</span>' +
        '<span class="icode">' + (it.code ? 'รหัส ' + esc(it.code) : '') + '</span></div>' +
        '<div class="imeta">จำนวน <b>' + esc(it.qty) + '</b> ' + esc(it.unit) +
        ' · PO <b>' + esc(it.po || '—') + '</b> · Supplier <b>' + esc(it.supplier || '—') + '</b>' +
        ' · วันรับสินค้า <b>' + esc(it.recv || '—') + '</b></div>' +
        '<div class="idesc">' + esc(it.th || '—') +
        (it.en ? '<div class="ien">' + esc(it.en) + '</div>' : '') + '</div>' +
        '<div data-phbox="' + esc(it.seq) + '"></div>' +
        '</div>';
    }
    t += '</div>';
    $('view').innerHTML = t;
    drawAllPhotos();
  });
}
/** ป้ายบอกความครบของรูปในทะเบียนเอกสาร */
function photoPill(r){
  var n = r.nPhoto || 0, miss = r.nNoPhoto || 0;
  if (!r.nItem) return '<span class="pill">—</span>';
  if (miss > 0) return '<span class="pill red">📷 ' + n + ' · ขาด ' + miss + '</span>';
  return '<span class="pill green">📷 ' + n + ' ครบ</span>';
}
function row(k, v){ return '<div class="fld"><label>' + esc(k) + '</label><div><b>' + esc(v || '—') + '</b></div></div>'; }

/* ─── ตอนเปิดหน้าเว็บ ─── */
document.addEventListener('DOMContentLoaded', function(){
  // โชว์เวอร์ชันตั้งแต่หน้า login — ตรวจได้ว่า deploy เข้าจริงไหมโดยไม่ต้องล็อกอินก่อน
  google.script.run.withSuccessHandler(function(v){ $('loginVer').textContent = 'STT CLAIM HUB · ' + v; })
                   .withFailureHandler(function(){ $('loginVer').textContent = 'STT CLAIM HUB'; })
                   .getVersion();

  // ลองเข้าด้วยบัญชี Google ของบริษัทก่อน (เบียร์/พี่แบล็ค ไม่ต้องใส่ PIN)
  $('loginErr').innerHTML = '<span class="spin"></span> กำลังตรวจบัญชี Google…';
  google.script.run
    .withSuccessHandler(function(r){
      $('loginErr').textContent = '';
      if (r && r.ok){ AUTH = null; enterApp(r, 'บัญชี Google'); return; }
      $('empInput').focus();
    })
    .withFailureHandler(function(){ $('loginErr').textContent = ''; $('empInput').focus(); })
    .loginByEmail();
});
</script>
<script>
/* ═══════════ v0.2.0 · ระบบรูปถ่าย ═══════════
   รูป = หลักฐาน · ทุกรายการที่เคลมต้องมีรูป
   ย่อรูปในเครื่องก่อนส่ง (กว้างสุด 1600px) → ไฟล์เล็กลง 5-10 เท่า อัปเร็ว ไม่ติดลิมิต */

var PHOTOS = {};        // { '1':[{id,thumb,view,name}], '2':[...] }
var CURDOC = '', CURJOB = '';

/** ย่อรูปด้วย canvas ก่อนอัป — กล้องมือถือ 4-8 MB จะเหลือ ~300-600 KB */
function shrinkImage(file, maxW, quality){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onerror = function(){ rej(new Error('อ่านไฟล์ไม่ได้')); };
    fr.onload = function(){
      var img = new Image();
      img.onerror = function(){ rej(new Error('ไฟล์นี้ไม่ใช่รูปภาพ')); };
      img.onload = function(){
        var w = img.width, h = img.height;
        if (w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
        var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        res({ dataUrl: cv.toDataURL('image/jpeg', quality || 0.82), w:w, h:h });
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function pickPhotos(seq){
  if (!CURDOC){ alert('บันทึกใบเคลมก่อน แล้วค่อยแนบรูปครับ'); return; }
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = true;
  inp.onchange = function(){ uploadList(seq, Array.prototype.slice.call(inp.files)); };
  inp.click();
}

function uploadList(seq, files){
  if (!files.length) return;
  var box = $('ph_' + seq);
  var done = 0, fail = 0;
  function step(i){
    if (i >= files.length){
      var m = 'อัปโหลดเสร็จ ' + done + ' รูป' + (fail ? (' · ไม่สำเร็จ ' + fail) : '');
      setPhotoMsg(seq, m, fail ? 'bad' : 'good');
      loadPhotos();
      return;
    }
    setPhotoMsg(seq, 'กำลังย่อและอัปโหลดรูปที่ ' + (i+1) + ' / ' + files.length + '…', 'wait');
    shrinkImage(files[i], 1600, 0.82).then(function(r){
      google.script.run
        .withSuccessHandler(function(){ done++; step(i+1); })
        .withFailureHandler(function(e){ fail++; setPhotoMsg(seq, (e && e.message) || 'อัปโหลดไม่สำเร็จ', 'bad'); step(i+1); })
        .savePhoto(CURDOC, CURJOB, seq, r.dataUrl, files[i].name, AUTH);
    }).catch(function(e){ fail++; setPhotoMsg(seq, e.message, 'bad'); step(i+1); });
  }
  step(0);
}
function setPhotoMsg(seq, msg, cls){
  var el = $('phmsg_' + seq); if (!el) return;
  el.className = 'phmsg ' + (cls || '');
  el.innerHTML = (cls === 'wait' ? '<span class="spin"></span> ' : '') + esc(msg);
}

function loadPhotos(){
  if (!CURDOC) return;
  srv('listPhotos', [CURDOC, AUTH], function(p){
    PHOTOS = p || {};
    drawAllPhotos();
  });
}
function drawAllPhotos(){
  var boxes = document.querySelectorAll('[data-phbox]');
  for (var i = 0; i < boxes.length; i++){
    var seq = boxes[i].getAttribute('data-phbox');
    boxes[i].innerHTML = photoStrip(seq);
  }
}
function photoStrip(seq){
  var list = PHOTOS[String(seq)] || [];
  var h = '<div class="phwrap">';
  list.forEach(function(p, k){
    h += '<div class="phcell"><img src="' + p.thumb + '" alt="รูป ' + (k+1) + '" ' +
         'onclick="zoomPhoto(\'' + p.view + '\',\'' + p.thumb + '\')" ' +
         'onerror="this.parentNode.classList.add(\'bad\')">' +
         '<button class="phdel" title="เอารูปนี้ออก" onclick="delPhoto(' + seq + ',\'' + p.id + '\')">&#10005;</button></div>';
  });
  h += '<div class="phadd" onclick="pickPhotos(' + seq + ')"><b>+</b><span>เพิ่มรูป</span></div>';
  h += '</div>';
  if (!list.length) h += '<div class="phwarn">⚠️ ยังไม่มีรูปหลักฐาน — รายการนี้เคลมไม่ได้</div>';
  h += '<div class="phmsg" id="phmsg_' + seq + '"></div>';
  return h;
}
function delPhoto(seq, id){
  if (!confirm('เอารูปนี้ออกจากใบเคลม?\n(ไฟล์ยังอยู่ใน Drive ไม่ได้ลบทิ้ง)')) return;
  srv('removePhoto', [CURDOC, id, AUTH], function(){ loadPhotos(); });
}
function zoomPhoto(view, thumb){
  var d = document.createElement('div');
  d.className = 'lightbox';
  d.innerHTML = '<div class="lbbar"><a href="' + view + '" target="_blank">เปิดไฟล์เต็มใน Google Drive ↗</a>' +
                '<button onclick="this.closest(\'.lightbox\').remove()">ปิด ✕</button></div>' +
                '<img src="' + thumb.replace('sz=w1000','sz=w2000') + '">';
  d.onclick = function(e){ if (e.target === d) d.remove(); };
  document.body.appendChild(d);
}
function openMediaFolder(){
  srv('getMediaFolderLink', [CURDOC, CURJOB, AUTH], function(u){ window.open(u, '_blank'); });
}
function checkPhotos(){
  srv('photoCheck', [CURDOC, AUTH], function(r){
    alert(r.ok ? '✅ ' + r.msg : '⚠️ ' + r.msg);
  });
}
</script>
