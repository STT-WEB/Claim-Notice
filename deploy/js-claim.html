<script>
/* ═══ ② Claim — เอกสารใบเดียว 4 แท็บ ═══
   แท็บ ① กรอกจบในหน้าเดียว : หัวเอกสาร + ตารางรายการ + รูป → กดบันทึกครั้งเดียว
   แท็บ ②③④ แยกไว้ เพราะเกิดคนละเวลา (Supplier ตอบทีหลัง · ของกลับทีหลัง)      */

var VENDORS = null;
var CLAIM = null;
var GNEW = null;          // ตารางตอนเปิดใบใหม่
var GEDIT = null;         // ตารางตอนเปิดใบที่บันทึกแล้ว
var DRAFTID = '';         // คีย์ชั่วคราวสำหรับรูปที่แนบก่อนกดบันทึก

/* คอลัมน์ของตารางรายการเคลม — ลำดับนี้ตรงกับตารางใน GGS ที่เบียร์ใช้อยู่
   จะได้ก๊อปจาก GGS มาวางทับได้ตรง ๆ ไม่ต้องสลับคอลัมน์ */
/* เบียร์: "ถ้าเลือกเป็นในประเทศ ไม่ต้องมีตารางแปลงอังกฤษ ขึ้นมาเลยก็ได้นะ ทั้ง Inspec และก็ Claim"
   → คอลัมน์ EN โผล่เฉพาะงานต่างประเทศ · งานในประเทศไม่ต้องเห็นเลย ตารางจะได้ไม่รก */
function isForeign(){
  var el = $('f_area') || $('c_area');
  if (el) return el.value === 'for';
  if (CLAIM && CLAIM.head) return CLAIM.head['สถานที่ผลิต'] === 'for';
  return false;
}
function claimCols(){
  var c = [
    { k:'code',     label:'รหัสสินค้า', w:104, ph:'ใส่แล้วชื่อ+หน่วยขึ้นเอง' },
    { k:'name',     label:'ชื่อสินค้า',  w:170 },
    { k:'th',       label:'รายละเอียดการเคลม (ไทย)', type:'area' }
  ];
  if (isForeign()) c.push({ k:'en', label:'Claim description (EN)', sub:'แปลให้อัตโนมัติ', type:'area' });
  return c.concat(claimColsTail());
}
function claimColsTail(){
  return [
    { k:'qty',      label:'จำนวน',  w:64, type:'num' },
    { k:'unit',     label:'หน่วย',  w:62 },
    { k:'po',       label:'PO',     w:112, ph:'ใส่แล้ววันรับขึ้นเอง' },
    { k:'supplier', label:'Supplier', w:168, list:'vlist' },
    { k:'recv',     label:'วันรับสินค้า', w:100, ph:'DD/MM/YYYY' }
  ];
}

/* ═══════════ เปิดใบแจ้งเคลมใหม่ — จบในหน้าเดียว ═══════════ */

/* ═══ ตัวเลือกกลางของฟอร์มใบเคลม — เขียนที่เดียว ใช้ทั้งหน้าเปิดใบใหม่และหน้าใบที่บันทึกแล้ว
   เบียร์ 8 ก.ย. 2569 สั่งคำพูดของแต่ละตัวเลือกไว้ตรงนี้ ═══════════════════ */
var CLAIM_TYPES = [
  ['after', 'หลังส่งมอบ (After-Sales)', 0],
  ['pre',   'ก่อนส่งมอบ (Pre-Delivery)', 0],
  /* ตัวที่ 3 — ระบบตั้งให้เองเมื่อใบนี้เกิดจากใบ Inspection · คนเลือกเองไม่ได้ */
  ['insp',  'เคลมหลังตรวจรับ (จากใบ Inspection)', 1]
];
var WORK_KINDS = [
  ['PART',   'อะไหล่ หรือ อุปกรณ์'],
  ['LABOUR', 'งานซ่อม ไม่มีเปลี่ยนอะไหล่ (ค่าแรงและค่าใช้จ่ายอื่น ๆ)'],
  ['BOTH',   'อะไหล่ หรือ อุปกรณ์ และ งานซ่อม']
];
/* เบียร์: "ไม่ต้อง (ผ่านสโตร์หรือไม่ผ่านสโตร์)" — เอาวงเล็บออก เหลือแค่ชนิดของงาน */
var FOREIGN_KINDS = [
  ['equip',  'อะไหล่ หรือ อุปกรณ์'],
  ['tanker', 'Tankers']
];
function optsOf_(list, cur, autoOnly){
  var t = '';
  for (var i = 0; i < list.length; i++){
    var v = list[i][0], lb = list[i][1], sysOnly = list[i][2];
    /* ตัวเลือกที่ระบบตั้งให้เอง จะโผล่ก็ต่อเมื่อใบนี้เป็นตัวนั้นจริง ๆ และกดเลือกไม่ได้ */
    if (sysOnly && cur !== v) continue;
    t += '<option value="' + v + '"' + (cur === v ? ' selected' : '') +
         (sysOnly ? ' data-sys="1"' : '') + '>' + esc(lb) + '</option>';
  }
  return t;
}
function claimTypeOpts(cur){ return optsOf_(CLAIM_TYPES, norm2(cur)); }
function workKindOpts(cur){ return optsOf_(WORK_KINDS, norm2(cur) || 'PART'); }
function foreignKindOpts(cur){ return optsOf_(FOREIGN_KINDS, norm2(cur) || 'equip'); }
function norm2(v){ return String(v == null ? '' : v).trim(); }
/* ประเภทการเคลม → ข้อความไทย · เขียนที่เดียว ใช้ทุกหน้า (รวมหน้าปริ้น)
   ⚠️ ห้ามเขียน ternary pre/หลังส่งมอบ กระจายอีก ไม่งั้นใบ insp จะโผล่เป็น "หลังส่งมอบ" */
function claimTypeText(v){
  v = norm2(v);
  for (var i = 0; i < CLAIM_TYPES.length; i++) if (CLAIM_TYPES[i][0] === v) return CLAIM_TYPES[i][1];
  return CLAIM_TYPES[0][1];
}
/* แบบสั้น ใช้ในตารางและหัวใบ */
function claimTypeShort(v){
  v = norm2(v);
  if (v === 'pre')  return 'ก่อนส่งมอบ';
  if (v === 'insp') return 'เคลมหลังตรวจรับ';
  return 'หลังส่งมอบ';
}
/* แปลงลิสต์กลางเป็นคู่ [ค่า, ข้อความ] ให้ sel() ใช้ — ตัวเลือกที่ระบบตั้งเองจะโผล่เฉพาะใบที่เป็นตัวนั้น */
function pairsOf_(list, cur){
  var out = [];
  for (var i = 0; i < list.length; i++){
    if (list[i][2] && norm2(cur) !== list[i][0]) continue;
    out.push([list[i][0], list[i][1]]);
  }
  return out;
}
/* ใบที่ระบบตั้งประเภทให้เอง = ล็อกช่องไม่ให้เปลี่ยน (แต่ยังอ่านได้ว่าเป็นเคลมหลังตรวจรับ) */
function lockSysClaimType(id){
  var el = $(id || 'f_claimType'); if (!el) return;
  var on = el.value === 'insp';
  el.disabled = on;
  el.title = on ? 'ใบนี้เกิดจากใบตรวจรับ ระบบตั้งประเภทให้เอง เปลี่ยนไม่ได้' : '';
}

  var t = '';
  t += '<div class="card tight"><div class="cardhd"><h3>เปิดใบแจ้งเคลม (ใบใหม่)</h3>' +

       '<span><i class="ca"></i><b class="ka">สีเทา</b> ระบบเติมให้เอง</span></div>';

  var W1 = 'ขั้น 1|ขั้น 1 · ผลิต / ขาย / QC / ออกแบบ เป็นคนกรอก';

  var canStore = hasRole('STORE') || hasRole('PURCHASE') || hasRole('ADMIN');

  t += '<div class="fgrid">';
  /* เบียร์ 8 ก.ย. 2569: "ประเภทการเคลม มันต้องมีว่า เคลมหลังจาก inspection แท็งค์ด้วย
     ในกรณีที่มันเชื่อมมาจากใบ Inspection"

  t += fr('ประเภทการเคลม', '<select id="f_claimType">' + claimTypeOpts('') + '</select>', W1, true);
  /* เบียร์ 7 ก.ย.: "งานเคลมที่เป็นงานฝีมือ ที่แบบไปซ่อม แต่มีแต่ค่าแรง แต่ไม่มีอุปกรณ์" */
  t += fr('ลักษณะงาน', '<select id="f_workKind">' + workKindOpts('') + '</select>',
      'ขั้น 1|เลือกงานซ่อม = ไม่ต้องกรอกตารางของ แต่ต้องมีค่าแรงหรือค่าใช้จ่ายอื่น', true);
  t += fr('เลขที่ JOB', '<input id="f_jobNo" placeholder="JT-69/0009" onblur="jobLookup()">', W1, true);
  t += fr('ชื่อลูกค้า', '<input id="f_jobName" placeholder="ขึ้นเองจากเลขจ๊อบ">', 'อัตโนมัติ|ขึ้นเองจากเลขที่ JOB');

  t += fr('ประเภทงาน', '<input id="f_jobType" disabled placeholder="JT / JM — ขึ้นเองจากเลขจ๊อบ">', 'อัตโนมัติ|ตัวอักษรหน้าเครื่องหมาย - ในเลขจ๊อบ');

  t += fr('สถานที่ผลิต', '<select id="f_area" onchange="areaChanged()"><option value="dom">ในประเทศ</option><option value="for">ต่างประเทศ</option></select>', W1, true);
  t += fr('MODEL', '<input id="f_model">', W1, true);
  t += fr('SERIAL NO.', '<input id="f_serialNo">', W1);

  /* เบียร์ 8 ก.ย. 2569: "ถ้ามาจากการ inspection แท็งค์ ตรงนี้ก็ให้ขึ้นเลยว่า Tankers

  t += '<div id="f_fkwrap" style="display:none">' +

  /* เบียร์ 8 ก.ย. 2569: "สถานที่ผลิต >> จะไม่มี CHASSIS ผู้ผลิต / E. No."

  t += '<div id="f_cmkwrap">' + fr('CHASSIS <i>ผู้ผลิต</i>', '<input id="f_chassisMaker">', W1) + '</div>';
  t += '<div id="f_enowrap">' + fr('E. No.', '<input id="f_eNo" placeholder="หมายเลขเครื่อง">', W1) + '</div>';

  t += fr('JMC ที่ผูก', '<input id="f_jmc" placeholder="เว้นว่างได้ เติมทีหลัง">', 'ขั้น 1|ขั้น 1 · คนเปิดใบเป็นคนกรอก เติมทีหลังได้');
  t += fr('เลขใบส่งมอบ', '<input id="f_deliveryNote" placeholder="' +
       (canStore ? 'กรอกได้เลย' : 'สโตร์เป็นคนกรอกในขั้นที่ 2') + '"' +
       (canStore ? '' : ' disabled') + '>', W2);
  t += fr('ผู้ขอเคลม', '<input id="f_by" disabled>', 'อัตโนมัติ|ขึ้นเองจากคนที่เข้าสู่ระบบ');
  t += fr('แผนกที่ขอเคลม', '<select id="f_dept">' + deptOpts('') + '</select>',
          'อัตโนมัติ|ขึ้นเองตามสิทธิ์ของคนที่เข้าสู่ระบบ · เปลี่ยนได้', true);
  /* เบียร์ 7 ก.ย.: "วันที่ต้องการสินค้าตัดไปก็ได้" → เอาออกจากหน้าจอ
     คอลัมน์ในชีตยังอยู่ ข้อมูลเก่าไม่หาย แค่ไม่ให้กรอกใหม่แล้ว */
  t += '</div></div>';

  t += '<div class="card tight"><div class="cardhd"><h3>รายการที่เคลม</h3>' +
       '<span class="sub">ก๊อปจาก Google Sheets มาวางได้เลย · ทุกแถวต้องมีรูปอย่างน้อย 1 รูป</span>' +
       '<span id="trbtns"></span>' +
       '<span class="phbar" id="phbar">—</span></div>';
  t += '<div class="phmsg" id="trmsg"></div>';
  t += '<div id="gridBox"></div></div>';

  $('view').innerHTML = t;

  /* เบียร์: "ชื่อผู้ขอเคลมและแผนกขึ้นเองอัตโนมัติ จาก user" */

/** ปุ่มแปลโผล่เฉพาะงานต่างประเทศ — งานในประเทศไม่ต้องเห็นให้รก */
function drawTrBtns(which){
  var box = $('trbtns'); if (!box) return;
  if (!isForeign()){ box.innerHTML = ''; return; }
  box.innerHTML = '<button class="btn ghost" onclick="gridTranslate(' + which + '.id)">🌐 แปลไทย → EN</button>' +
                  '<button class="btn ghost" onclick="gridTrCheck(' + which + '.id)">🔎 ตรวจคำแปล</button>';
}

/* ── ช่องบังคับกรอก (v0.7.0) ───────────────────────────────────
   กฎของเบียร์: ทุกใบต้องมี ประเภทการเคลม · เลขที่ JOB · สถานที่ผลิต ·
   MODEL · แผนก · วันที่ต้องการของ
   ถ้าเลือก "ต่างประเทศ" เพิ่ม CHASSIS STT และ CHASSIS ผู้ผลิต */
var DEPTS = ['ผลิต','ขาย','QC','ออกแบบ','สโตร์','จัดซื้อ','คลังสินค้า','บุคคล','ผู้บริหาร'];
/** แผนกของคนที่เข้าสู่ระบบ — มาจาก role ไม่ใช่ให้พิมพ์เอง */
function myDept(){
  if (ME && ME.dept) return ME.dept;
  var m = { ADMIN:'ผู้บริหาร', APPROVER:'ผู้บริหาร', PRODUCTION:'ผลิต', SALES:'ขาย', QC:'QC',
            DESIGN:'ออกแบบ', STORE:'สโตร์', PURCHASE:'จัดซื้อ', HR:'บุคคล', PICKER:'คลังสินค้า' };
  var rs = (ME && ME.roles && ME.roles.length) ? ME.roles : [(ME && ME.role) || ''];
  for (var i = 0; i < rs.length; i++) if (m[rs[i]]) return m[rs[i]];
  return '';
}
/** รายการแผนกสำหรับ sel() — ต้องมีค่าเดิมอยู่ในรายการเสมอ ไม่งั้นค่าที่เคยกรอกไว้จะหายตอนเซฟ */
function deptPairs(cur){
  var list = DEPTS.slice();
  if (cur && list.indexOf(cur) < 0) list.unshift(cur);
  var out = [['','— เลือกแผนก —']];
  for (var i = 0; i < list.length; i++) out.push([list[i], list[i]]);
  return out;
}
function deptOpts(cur){
  var list = DEPTS.slice(), t = '<option value="">— เลือกแผนก —</option>';
  if (cur && list.indexOf(cur) < 0) list.push(cur);
  for (var i = 0; i < list.length; i++)
    t += '<option value="' + esc(list[i]) + '"' + (list[i] === cur ? ' selected' : '') + '>' + esc(list[i]) + '</option>';
  return t;
}
/** ประเภทงาน = ตัวอักษรหน้า "-" ในเลขจ๊อบ (JT / JM) */
function jobTypeOf(jobNo){
  var m = String(jobNo || '').toUpperCase().match(/^([A-Z]{2,4})-/);
  return m ? m[1] : '';
}
/** สถานะเป็นผลของขั้นตอน ไม่ใช่ของที่ใครมาเลือกเอง (เบียร์ถามว่าใครเป็นคนเปลี่ยน) */
/** ลายเซ็นตามขั้นตอน — ขึ้นเองเมื่อแต่ละคนกดรับ/อนุมัติ/ส่งต่อ ไม่ต้องเซ็นมือ */
function signRow(signs){
  if (!signs || !signs.length) return '';
  /* 9 ช่อง 2 รอบ — รอบ 1 ครบ 4 ช่อง ปุ่มพิมพ์ใบส่ง Supplier ถึงเปิด (สเปคข้อ 7) */
  if (signs[0] && signs[0].round){
    var r1 = signs.filter(function(x){ return x.round === 1; });
    var r2 = signs.filter(function(x){ return x.round === 2; });
    var done1 = r1.every(function(x){ return !!x.text; });
    var box = function(a){
      var o = '<div class="signrow">';
      for (var i = 0; i < a.length; i++){
        o += '<div class="signbox' + (a[i].text ? '' : ' wait') + '">' +
             '<i>' + esc(a[i].role) + '</i><b>' +
             esc(a[i].text || '— ยังไม่ถึงขั้นนี้ —') + '</b></div>';
      }
      return o + '</div>';
    };
    return '<div class="signttl">รอบที่ 1 — เปิดและส่งเคลม' +
             (done1 ? '<b class="okt"> ✓ ครบ 4 ช่อง — เปิดปุ่มพิมพ์ใบส่ง Supplier แล้ว</b>'
                    : '<span class="sub"> ครบ 4 ช่องเมื่อไหร่ ปุ่มพิมพ์ใบส่ง Supplier ถึงจะเปิดใช้ได้</span>') +
           '</div>' + box(r1) +

  }

function statusText(v){

            REPLIED:'Supplier ตอบแล้ว · ของกลับมา', BILLED:'ออกใบเรียกเก็บแล้ว', CLOSED:'ปิดงานแล้ว' };

}
function hasRole(r){

function markReq(wrapId, on){
  var w = $(wrapId); if (!w) return;
  var lb = w.querySelector('label'); if (!lb) return;
  var st = lb.querySelector('.req');
  if (on && !st){
    st = document.createElement('b'); st.className = 'req'; st.title = 'ต้องกรอก';
    st.textContent = ' *';
    lb.insertBefore(st, lb.querySelector('.who') || null);
  } else if (!on && st) st.parentNode.removeChild(st);
}
function reqFields(){
  var need = [
    ['f_claimType','ประเภทการเคลม'], ['f_jobNo','เลขที่ JOB'], ['f_area','สถานที่ผลิต'],
    ['f_model','MODEL'], ['f_dept','แผนกที่ขอเคลม']
  ];
  if ($('f_area') && $('f_area').value === 'for'){
    need.push(['f_chassisStt','CHASSIS STT']);
    need.push(['f_chassisMaker','CHASSIS ผู้ผลิต']);
  }
  return need;
}
/** คืนรายชื่อช่องที่ยังว่าง + ทำกรอบแดงให้เห็นว่าช่องไหน */
function missingFields(){
  var need = reqFields(), miss = [];
  for (var i = 0; i < need.length; i++){
    var el = $(need[i][0]); if (!el) continue;
    if (!el.value || !String(el.value).trim()){ el.classList.add('need'); miss.push(need[i][1]); }
    else el.classList.remove('need');
  }
  return miss;
}
/** ใบที่บันทึกแล้ว: เปลี่ยนในประเทศ↔ต่างประเทศ ต้องให้คอลัมน์แปลอังกฤษเข้า/ออกตามด้วย
 *  เบียร์: "เปลี่ยนเป็นต่างประเทศ มันไม่มีช่องแปลภาษามาให้ ข้อมูลมันไม่ล้อกัน" */
/* กด "บันทึกไว้ก่อน" — รีดทุกช่องที่ยังค้างอยู่ลงชีต แล้วเช็คว่าครบหรือยัง

  var el = document.activeElement;
  if (el && el.blur) el.blur();

  if (typeof GEDIT !== 'undefined' && GEDIT) syncGrid(GEDIT.id);
  setTimeout(function(){

    srv('cleanClaimItems', [CURDOC, AUTH], function(r){

                bar.textContent = '✓ บันทึกแล้ว' +
                  (r && r.removed && r.removed.length ? ' · เก็บแถวเปล่าออก ' + r.removed.length + ' แถว' : ''); }
      if (r && r.removed && r.removed.length) return go('claim', CURDOC);   // เลขข้อเปลี่ยน ต้องวาดใหม่

function areaChanged(){
  var isFor = ($('f_area').value === 'for');
  $('f_fkwrap').style.display  = isFor ? '' : 'none';
  /* เบียร์ 8 ก.ย. 2569: ในประเทศ = ไม่มี CHASSIS ผู้ผลิต และไม่มี E. No.
     ซ่อนแล้วล้างค่าด้วย ไม่ให้ค่าที่พิมพ์ค้างไว้ตอนเลือกต่างประเทศหลุดไปกับใบในประเทศ */
  var cm = $('f_cmkwrap'), en = $('f_enowrap');
  if (cm) cm.style.display = isFor ? '' : 'none';
  if (en) en.style.display = isFor ? '' : 'none';

    if ($('f_chassisMaker')) $('f_chassisMaker').value = '';

     ประเภทการเคลม เลขที่ JOB ด้วย" → ดาวแดงขึ้น/ลงตามสถานที่ผลิต */
  markReq('f_csttwrap', isFor);

  /* สลับในประเทศ↔ต่างประเทศ = คอลัมน์ EN เข้า/ออก → สร้างตารางใหม่โดยเก็บข้อมูลที่กรอกไว้ */
  if (GNEW){

function gridOptsNew(){
  return {
    photos:true, maxPhoto:5, requireKeys:['code','name','th'],
    trFrom: isForeign() ? 'th' : '', trTo: isForeign() ? 'en' : '',
    onChange:function(r, k){ if (k === 'code') autoGoods(GNEW); if (k === 'po') autoPo(GNEW); },
    onPaste:function(){ autoGoods(GNEW); autoPo(GNEW); updateNewPhBar(); if (isForeign()) gridTranslate(GNEW.id); },
    onPhoto:updateNewPhBar
  };
}

function updateNewPhBar(){
  var bar = $('phbar'); if (!bar || !GNEW) return;
  var miss = gridPhotoMissing(GNEW.id);

  if (!n){ bar.className = 'phbar'; bar.textContent = 'ยังไม่ได้กรอกรายการ'; return; }
  bar.className = 'phbar ' + (miss.length ? 'bad' : 'good');
  bar.innerHTML = miss.length
    ? '📷 ยังขาดรูป: แถวที่ ' + miss.join(', ')
    : '📷 รูปครบทุกแถวแล้ว (' + n + ' รายการ)';
}

/* ─── เติมชื่อ/หน่วยจากรหัสสินค้า และวันรับจาก PO — ถามทีเดียวทั้งตาราง ─── */
function autoGoods(g){
  var rows = gridData(g.id), codes = [];
  for (var i = 0; i < rows.length; i++){
    var c = String(rows[i].code || '').trim();
    if (c && (!String(rows[i].name || '').trim() || !String(rows[i].unit || '').trim())) codes.push(c);
  }
  if (!codes.length) return;
  srv('lookupGoods', [codes, AUTH], function(map){
    if (!map) return;
    var hit = false;
    for (var r = 0; r < g.rows.length; r++){
      var m = map[String(g.rows[r].code || '').trim()];
      if (!m) continue;
      if (!String(g.rows[r].name || '').trim() && m.name){ g.rows[r].name = m.name; hit = true; }
      if (!String(g.rows[r].unit || '').trim() && m.unit){ g.rows[r].unit = m.unit; hit = true; }
    }
    if (hit) drawGrid(g.id);
  }, function(){});
}
function autoPo(g){
  var rows = gridData(g.id), pos = [];
  for (var i = 0; i < rows.length; i++){
    var p = String(rows[i].po || '').trim();
    if (p && !String(rows[i].recv || '').trim() && pos.indexOf(p) < 0) pos.push(p);
  }
  if (!pos.length) return;
  srv('lookupPoDates', [pos, AUTH], function(map){
    if (!map) return;
    var hit = false;
    for (var r = 0; r < g.rows.length; r++){
      var d = map[String(g.rows[r].po || '').trim()];
      if (d && !String(g.rows[r].recv || '').trim()){ g.rows[r].recv = d; hit = true; }
    }
    if (hit) drawGrid(g.id);
  }, function(){});
}

  for (var i = 0; i < lim; i++) h += '<option value="' + esc(VENDORS[i]) + '"></option>';

/** โหลดรายชื่อจ๊อบใหม่ทันที — ใช้ตอนเพิ่งเพิ่มจ๊อบในชีตแล้วระบบยังหาไม่เจอ */
function reloadJobs(){

function jobLookup(){
  var j = $('f_jobNo').value.trim(); if (!j) return;
  CURJOB = j.toUpperCase();
  if ($('f_jobType')) $('f_jobType').value = jobTypeOf(j);   // JT / JM ขึ้นทันทีไม่ต้องรอเซิร์ฟเวอร์
  srv('lookupJob', [j], function(r){
    if (!r || !r.found){
      /* บอกให้ครบว่าทำอะไรต่อได้ — ของเดิมบอกแค่ "ไม่พบ" แล้วจบ พนักงานไม่รู้ว่าต้องทำไง */
      var m = '<div class="msg bad">ไม่พบเลขจ๊อบ <b>' + esc(r && r.asked ? r.asked : j) + '</b> ในทะเบียนงาน (' +
              esc(String((r && r.total) || 0)) + ' จ๊อบ)';
      if (r && r.near && r.near.length) m += '<br>ใกล้เคียง: ' + r.near.map(function(x){
        return '<a href="#" onclick="$(\'f_jobNo\').value=\'' + esc(x) + '\';jobLookup();return false">' + esc(x) + '</a>';
      }).join(' · ');
      m += '<br><span style="font-size:12px">ถ้าเป็นจ๊อบที่เพิ่งเพิ่มในชีตวันนี้ กด ' +
           '<a href="#" onclick="reloadJobs();return false"><b>โหลดรายชื่อจ๊อบใหม่</b></a> แล้วลองอีกครั้ง · ' +
           'หรือกรอกข้อมูลรถเองก็ได้</span></div>';
      $('fmsg').innerHTML = m; return;
    }
    $('fmsg').innerHTML = '<div class="msg good">พบจ๊อบ ' + esc(r.jobNo) + ' แล้ว — เด้งข้อมูลให้อัตโนมัติ</div>';
    if (r.jobName) $('f_jobName').value = r.jobName;
    if ($('f_jobType')) $('f_jobType').value = r.type || jobTypeOf(r.jobNo);
    if (r.model)   $('f_model').value   = r.model;
    if (r.loc && String(r.loc).indexOf('ต่าง') >= 0){ $('f_area').value = 'for'; areaChanged(); }
  }, function(m){ $('fmsg').innerHTML = '<div class="msg bad">' + esc(m) + '</div>'; });
}

/** submit = 0 บันทึกร่าง (ข้อมูลไม่ครบก็เก็บไว้ได้) · 1 บันทึกแล้วส่งขออนุมัติเลย
 *  เบียร์: "ข้อมูลไม่ครบ ... พอกรอกเสร็จ คือมีปุ่มบันทึกร่าง และปุ่มส่งอนุมัติได้เลย" */
function submitClaim(submit){
  if (!submit){                                  // ── บันทึกร่าง: ขอแค่เลขจ๊อบ ──
    var j = $('f_jobNo').value.trim();
    if (!j){ $('fmsg').innerHTML = '<div class="msg bad">อย่างน้อยต้องใส่ <b>เลขที่ JOB</b> ก่อน ระบบถึงจะออกเลขเอกสารให้ได้</div>';
             window.scrollTo(0,0); return; }
    return sendClaim(0);
  }
  /* ── ส่งอนุมัติ: ต้องครบทุกอย่าง บอกทีเดียวพร้อมกรอบแดง ── */
  var need = missingFields();
  if (need.length){
    $('fmsg').innerHTML = '<div class="msg bad">ยังไม่ได้กรอก: <b>' + esc(need.join(' · ')) + '</b>' +
      ($('f_area').value === 'for' ? '<br><span class="hint">งานต่างประเทศบังคับ CHASSIS ทั้งของ STT และของผู้ผลิต</span>' : '') +
      '</div>';
    window.scrollTo(0, 0);
    return;
  }
  var rows0 = gridFilledRows(GNEW.id);
  if (!rows0.length){ $('fmsg').innerHTML = '<div class="msg bad">ต้องมีรายการที่เคลมอย่างน้อย 1 รายการ</div>'; return; }

  /* รูปคือหลักฐาน — เช็คตรงนี้ก่อนส่ง จะได้ไม่ต้องไปแก้ทีหลัง */
  var miss = gridPhotoMissing(GNEW.id);
  if (miss.length){
    $('fmsg').innerHTML = '<div class="msg bad">แถวที่ ' + miss.join(', ') + ' ยังไม่มีรูป — ทุกรายการต้องมีรูปอย่างน้อย 1 รูป</div>';
    window.scrollTo(0, 0);
    return;
  }
  sendClaim(1);
}

/** ส่งขึ้นเซิร์ฟเวอร์จริง — ใช้ร่วมกันทั้งปุ่มบันทึกร่างและปุ่มส่งอนุมัติ */
function sendClaim(submit){
  var rows = gridFilledRows(GNEW.id);
  /* แถวที่เว้นว่างถูกตัดออก ลำดับจึงเลื่อน — ส่งตารางแปลงลำดับไปด้วย ไม่งั้นรูปไปติดผิดรายการ */
  var seqMap = {};
  for (var i = 0; i < rows.length; i++) seqMap[rows[i]._rid] = i + 1;

  var h = {
    claimType : $('f_claimType').value,
    area      : $('f_area').value,
    foreignKind : ($('f_area').value === 'for') ? $('f_foreignKind').value : '',
    jobNo: $('f_jobNo').value.trim(), jobName:$('f_jobName').value, model:$('f_model').value,
    chassisStt:$('f_chassisStt').value, chassisMaker:$('f_chassisMaker').value,
    serialNo:$('f_serialNo').value, jmc:$('f_jmc').value,
    deliveryNote:$('f_deliveryNote').value, dept:$('f_dept').value,
    eNo:$('f_eNo').value,
    workKind:$('f_workKind') ? $('f_workKind').value : 'PART',
    items: rows
  };
  var btn = submit ? $('saveBtn') : $('draftBtn');
  var label = btn.textContent;
  $('saveBtn').disabled = true; $('draftBtn').disabled = true;
  btn.textContent = submit ? 'กำลังส่งอนุมัติ…' : 'กำลังบันทึก…';

  srv('createClaimWithPhotos', [h, DRAFTID, seqMap, AUTH, submit ? 1 : 0], function(r){
    $('saveBtn').disabled = false; $('draftBtn').disabled = false; btn.textContent = label;
    if (!r || !r.ok){ $('fmsg').innerHTML = '<div class="msg bad">บันทึกไม่สำเร็จ</div>'; return; }
    DRAFTID = '';
    if (submit && r.submitted === false){
      alert('บันทึกใบ ' + r.docNo + ' แล้ว แต่ยังส่งอนุมัติไม่ได้:\n\n' + (r.submitMsg || ''));
    }
    go('claim', r.docNo);
  }, function(m){
    $('saveBtn').disabled = false; $('draftBtn').disabled = false; btn.textContent = label;
    $('fmsg').innerHTML = '<div class="msg bad">' + esc(m) + '</div>';
  });
}

function photoPill(r){
  var n = r.nPhoto || 0, miss = r.nNoPhoto || 0;
  if (!r.nItem) return '<span class="pill">—</span>';
  if (miss > 0) return '<span class="pill red">📷 ' + n + ' · ขาด ' + miss + '</span>';

function openClaim(docNo){

var CURTAB = 1;

    '<h3>' + esc(docNo) + '</h3>' +

       ต้องให้มันบันทึกร่างไปได้เรื่อย ๆ จนกว่าจะเสร็จ ค่อยกดส่งอนุมัติ"

  t += '<div id="pane3" class="pane" style="display:none">' + paneBill(c, docNo) + '</div>';
  t += '<div id="pane4" class="pane" style="display:none">' + paneReturn(c, docNo) + '</div>';

  $('view').innerHTML = t;
  fillVendorList();
  bindAll($('view'), docNo);
  applyLocks($('view'));

  /* ตารางรายการของใบที่บันทึกแล้ว — รูปผูกกับ "ลำดับรายการ" ตรง ๆ */
  var rows = [];
  for (var i = 0; i < c.items.length; i++){
    var it = c.items[i];
    rows.push({ _rid:String(it.seq), _seq:String(it.seq),
      code:it.code, name:it.name, th:it.th, en:it.en, qty:it.qty,
      unit:it.unit, po:it.po, supplier:it.supplier, recv:it.recv });
  }
  GEDIT = makeGrid('gridEdit', claimCols(), rows, {
    photos:true, maxPhoto:5, requireKeys:['code','name','th'],
    trFrom: isForeign() ? 'th' : '', trTo: isForeign() ? 'en' : '',
    onDraw:function(g){ applyGridLocks(g.id); },
    /* ระบบเติม EN ให้ในใบที่บันทึกแล้ว ต้องบันทึกลงชีตด้วย ไม่งั้นรีเฟรชแล้วหาย */
    /* ระบบเติมคำแปลให้ ต้องบันทึกลงชีตด้วย ไม่งั้นรีเฟรชแล้วหาย
       key = ช่องที่ถูกเติม (en หรือ th) — แปลได้ 2 ทางแล้ว จึงส่ง key มาด้วย */
    onFill:function(rowsFilled, g, key){
      key = key || 'en';
      for (var i = 0; i < rowsFilled.length; i++){
        var rr = rowsFilled[i], sq = g.rows[rr]._seq;
        if (!sq) continue;
        google.script.run.saveItemField(CURDOC, sq, key, g.rows[rr][key], AUTH);
      }
    },
    onChange:function(r, k, v, g){
      var seq = g.rows[r]._seq;
      if (!seq) return;                               // แถวใหม่ต้องกด "+ เพิ่มรายการ" ก่อน
      var el = gridCell(g.id, r, colIndexOf(g, k));
      fieldMark(el, 'wait');
      google.script.run
        .withSuccessHandler(function(){ fieldMark(el, 'ok'); })
        .withFailureHandler(function(e){ fieldMark(el, 'bad', (e && e.message) || 'บันทึกไม่สำเร็จ'); })
        .saveItemField(CURDOC, seq, k, v, AUTH);
    },
    onDel:function(seq){ delClaimRow(seq); },     // ลบแถวของใบที่บันทึกแล้ว = ลบในชีตจริง
    onPhoto:updatePhBar
  });
  drawAllPhotos();

  drawExpense();
  drawTrBtns('GEDIT');
  applyGridLocks(GEDIT.id);
  lockSysClaimType('c_claimType');      // ใบที่เกิดจากใบตรวจรับ ห้ามเปลี่ยนประเภทเอง
  areaChangedSaved();                   // ซ่อน CHASSIS ผู้ผลิต / E. No. / ชนิดงาน ตปท. ตามสถานที่ผลิต
  showTab(CURTAB);
  updatePhBar();
}
function colIndexOf(g, k){
  for (var i = 0; i < g.cols.length; i++) if (g.cols[i].k === k) return i;
  return 0;
}
function tab(n, label, sub){
  return '<button class="tabbtn' + (CURTAB === n ? ' on' : '') + '" id="tabbtn' + n + '" onclick="showTab(' + n + ')">' +
         '<b>' + label + '</b><span>' + sub + '</span></button>';
}
function showTab(n){
  CURTAB = n;
  for (var i = 1; i <= 4; i++){
    var p = $('pane' + i), b = $('tabbtn' + i);
    if (p) p.style.display = (i === n) ? '' : 'none';
    if (b) b.className = 'tabbtn' + (i === n ? ' on' : '');
  }
  if (n === 3) refreshTotals();
}

function updatePhBar(){
  var bar = $('phbar'); if (!bar || !CLAIM) return;
  var have = 0, missing = [];
  for (var i = 0; i < CLAIM.items.length; i++){
    var s = String(CLAIM.items[i].seq);
    if (PHOTOS[s] && PHOTOS[s].length) have++; else missing.push(s);
  }
  bar.className = 'phbar ' + (missing.length ? 'bad' : 'good');
  bar.innerHTML = missing.length
    ? '📷 ' + have + ' / ' + CLAIM.items.length + ' รายการ — ขาดรายการที่ ' + missing.join(', ')
    : '📷 รูปครบทุกรายการ (' + CLAIM.items.length + ')';
}

function refreshTotals(){
  if (!CLAIM || CURTAB !== 3) return;
  var h = CLAIM.head;
  var rate = Number(String($('c_rate') ? $('c_rate').value : h['อัตราแลกเปลี่ยน']).replace(/,/g,'')) || 0;
  var cur = $('c_currency') ? $('c_currency').value : h['สกุลเงิน'];
  var lbl = $('curlbl'); if (lbl) lbl.textContent = cur || '—';

  for (var i = 0; i < CLAIM.items.length; i++){
    var it = CLAIM.items[i], s = String(it.seq);
    var pe = document.querySelector('[data-price="' + s + '"]');
    var price = pe ? Number(String(pe.value).replace(/,/g,'')) || 0 : 0;
    var qty = Number(String(it.qty).replace(/,/g,'')) || 0;
    var tot = Math.round(price * qty * 100) / 100;
    var te = document.querySelector('[data-tot="' + s + '"]');
    var fe = document.querySelector('[data-fx="' + s + '"]');
    if (te) te.textContent = tot ? money(tot) : '—';
    if (fe) fe.textContent = (tot && rate > 0) ? money(tot / rate) : '—';
  }
  srv('claimTotals', [CURDOC, AUTH], function(r){
    var b = $('totbox'); if (!b || !r) return;
    var t = '<table class="t"><thead><tr><th>Supplier</th><th style="width:130px">ค่าของ (บาท)</th>' +
      '<th style="width:130px">ค่าแรง (บาท)</th><th style="width:140px">รวม (บาท)</th>' +
      '<th style="width:140px">รวม (' + esc(r.currency || '—') + ')</th></tr></thead><tbody>';
    if (!r.bySupplier.length){
      t += '<tr><td colspan="5" class="c hint">ยังไม่ได้ใส่ราคา — ใส่ต้นทุนในตารางด้านบนแล้วยอดจะขึ้นเอง</td></tr>';
    }
    for (var i = 0; i < r.bySupplier.length; i++){
      var x = r.bySupplier[i];
      t += '<tr><td><b>' + esc(x.supplier) + '</b></td><td class="r">' + money(x.items) + '</td>' +
        '<td class="r">' + money(x.labour) + '</td><td class="r b">' + money(x.thb) + '</td>' +
        '<td class="r b">' + (x.foreign === '' ? '—' : money(x.foreign)) + '</td></tr>';
    }
    t += '</tbody><tfoot><tr><th>รวมทั้งใบ</th><th></th><th></th>' +
      '<th class="r">' + money(r.thb) + '</th><th class="r">' + (r.foreign === '' ? '—' : money(r.foreign)) + '</th></tr></tfoot></table>';
    if (!r.rate) t += '<div class="hint" style="margin-top:6px">ยังไม่ได้ใส่เรท — ช่องสกุลเงินต่างประเทศจะขึ้นเมื่อใส่เรทแล้ว</div>';
    b.innerHTML = t;
  }, function(){});
}

function expRows(){
  var tb = $('exptab').getElementsByTagName('tbody')[0], out = [];
  var trs = tb.getElementsByTagName('tr');
  for (var i = 0; i < trs.length; i++){
    if (!trs[i].querySelector('[data-x]')) continue;
    var tr = trs[i];
    var g = function(k){ var e = tr.querySelector('[data-x="' + k + '"]'); return e ? e.value : ''; };
    out.push({ kind:g('kind'), th:g('th'), en:g('en'), covers:g('covers'),
               supplier:g('supplier'), amount:g('amount') });
  }
  return out;
}
function expRowsSafe(){
  var tb = $('exptab'); if (!tb) return (CLAIM && CLAIM.expense) || [];
  if (!tb.querySelector('[data-x]')) return [];
  return expRows();
}
function addExpense(){
  CLAIM.expense = expRowsSafe();
  CLAIM.expense.push({ kind:'', th:'', en:'', covers:'', supplier:'', amount:'' });
  drawExpense();
}
function delExpense(i){
  CLAIM.expense = expRowsSafe();
  CLAIM.expense.splice(i, 1);
  drawExpense();
}
function saveExpenseRows(){
  var rows = expRowsSafe();

function delLabour(i){

  t += '</select><label>วันที่รับกลับ</label><input id="r_date" placeholder="DD/MM/YYYY">' +
    '<label>จำนวนที่รับ</label><input id="r_qty" class="r"></div>';
  t += '<div class="frow"><label>หมายเหตุ</label><input id="r_note" placeholder="สภาพของที่ได้กลับมาเป็นยังไง"></div>';
  t += '<div class="rethd">📷 รูปของที่ได้กลับมา (ถ่ายก่อนกด Accept)</div>' +
       '<div data-phbox="R" data-phreq="soft"></div>';
  t += '<div class="accrow" style="margin-top:8px">' +
    '<button class="accbtn ok" onclick="addReturn(\'ACC\')">✓ Accept — ใช้ได้ ปิดจบ</button>' +
    '<button class="accbtn bad" onclick="addReturn(\'UNACC\')">✕ ไม่ Accept — ยังใช้ไม่ได้</button>' +
    '<span class="accnote" id="retnote"></span></div></div>';

  var rets = c.returns || [];
  t += '<table class="t" style="margin-top:14px"><thead><tr><th style="width:30px">ที่</th>' +
    '<th style="width:88px">รายการที่</th><th style="width:100px">วันที่รับกลับ</th>' +
    '<th style="width:80px">จำนวน</th><th style="width:140px">ผลตรวจ</th>' +
    '<th>หมายเหตุ</th><th style="width:130px">ผู้ตรวจ</th></tr></thead><tbody>';
  var anyBad = false;
  for (var k = 0; k < rets.length; k++){
    var r = rets[k];
    if (r.acc === 'UNACC') anyBad = true;
    t += '<tr><td class="c">' + esc(r.seq) + '</td><td class="c">' + esc(r.itemSeq) + '</td>' +
      '<td class="c">' + esc(r.date) + '</td><td class="r">' + esc(r.qty) + '</td>' +
      '<td class="c">' + (r.acc === 'ACC' ? '<span class="pill green">✓ Accept</span>'
                        : r.acc === 'UNACC' ? '<span class="pill red">✕ ไม่ Accept</span>' : '—') + '</td>' +
      '<td>' + esc(r.note) + '</td><td>' + esc(r.by) + '</td></tr>';
  }
  if (!rets.length) t += '<tr><td colspan="7" class="c hint">ยังไม่มีการรับของกลับ</td></tr>';
  t += '</tbody></table>';

  if (anyBad || f.canRejectReturn){
    t += '<div class="phbar bad" style="margin-top:12px">' +
      (anyBad ? 'มีของที่ QC ไม่ Accept — ' : '') +
      'ไม่ Accept = <b>วนกลับเป็นเคลมรอบใหม่</b> ใบเดิม เลขเดิม' +
      (f.round > 1 ? ' · ตอนนี้เป็น<b>รอบที่ ' + f.round + '</b>' : '') + '</div>' +
      '<div style="margin-top:8px"><button class="btn primary" onclick="doRejectReturn()">' +
      '↩ ไม่ Accept — วนกลับเป็นเคลมรอบใหม่</button></div>';
  }
  t += '<div id="retmsg"></div></div>';

  /* ═══ ขั้น 8 · สโตร์เบิกออกให้หน้างาน ═══ */
  t += '<div class="card"><div class="cardhd"><h3>📤 ขั้นที่ 8 · เบิกของออกให้หน้างาน — สโตร์</h3>' +
    '<span class="sub">QC ตรวจผ่านแล้วเท่านั้น สโตร์ถึงจ่ายของออกได้</span></div>';
  t += '<div class="fgrid">' +
    fr('เลขที่ใบเบิก', '<input value="' + esc(dn.is || '') + '" disabled placeholder="ระบบออกให้ตอนกดเบิกออก">', 'อัตโนมัติ') +
    fr('วันที่เบิกออก', '<input value="' + esc(dn.isDate || '') + '" disabled>', 'อัตโนมัติ') +
    fr('ผู้รับของ (หน้างาน)', ip('c_issueTo','saveClaimField','issueTo',h['ผู้รับของหน้างาน']), 'สโตร์', true) +
    fr('แผนกที่เบิกไปใช้', ip('c_issueDept','saveClaimField','issueDept',h['แผนกที่เบิกไปใช้']), 'สโตร์', true) +
    fr('อ้างอิงใบตรวจรับ', '<input value="' + esc(dn.rcv || '—') + '" disabled>', 'อัตโนมัติ') +
    '</div>';
  if (dn.is){
    t += '<div class="phbar ok" style="margin-top:10px">✓ เบิกออกแล้ว <b>' + esc(dn.is) + '</b> · ' +
         esc(dn.isDate) + ' — ของถึงมือหน้างานเรียบร้อย</div>';
  }
  t += '</div>';

  /* ═══ ขั้น 9 · ปิดจบ ต้นทุนไปทางไหน (สเปคข้อ 3.7-3.8) ═══ */
  var bl = String(h['ความรับผิดชอบ'] || '');
  t += '<div class="card"><div class="cardhd"><h3>🏁 ขั้นที่ 9 · ปิดจบ — ต้นทุนไปทางไหน</h3>' +
    '<span class="sub">จัดซื้อระบุก่อนให้ผู้บริหารกดปิด · ระบบส่งต่อให้ HR และบัญชีเอง</span></div>';
  t += '<div class="frow"><label>ความรับผิดชอบ</label>' +
    sel('c_blame','saveClaimField','blame',bl,
      [['','— ยังไม่ระบุ —'],
       ['EMP','พนักงานทำเสียหาย → ออกรายงานส่ง HR ไปหักเงิน'],
       ['JOB','ไม่ใช่ความผิดพนักงาน → ลงเป็นต้นทุนของแท็งค์ ผูกกับ JMC']]) + '</div>';
  if (bl === 'EMP'){
    t += '<div class="fgrid">' +
      fr('ชื่อผู้ทำเสียหาย', ip('c_blameWho','saveClaimField','blameWho',h['ชื่อผู้ทำเสียหาย']), 'จัดซื้อ', true) +
      fr('แผนกของคนนั้น', ip('c_blameDept','saveClaimField','blameDept',h['แผนกผู้ทำเสียหาย']), 'จัดซื้อ', true) +
      '</div>' +
      '<div class="hint" style="margin-top:8px">ใบนี้จะไปโผล่ในเมนู <b>รายงานส่ง HR</b> · ' +
      'ระบบไม่หักเงินเอง HR เป็นคนตัดสินใจตามระเบียบบริษัท</div>';
  }
  t += '<div class="hint" style="margin-top:8px">ทั้ง 2 กรณี ระบบส่งข้อมูลให้ <b>บัญชี</b> อัตโนมัติเมื่อใบปิดจบ ' +
       '(บัญชีรับข้อมูลอย่างเดียว ไม่ต้องกดติ๊กอะไรในระบบเคลม)</div></div>';
  return t;
}

/** ไม่ Accept ของที่ Supplier ส่งกลับมา → วนกลับเป็นเคลมรอบใหม่ (ใบเดิม เลขเดิม) */
function doRejectReturn(){
  var why = prompt('ไม่ Accept ของที่ Supplier ส่งกลับมา\n\nไม่ Accept เพราะอะไร (Supplier จะได้รู้ว่าไม่ผ่านตรงไหน):');
  if (why === null) return;
  if (!String(why).trim()){ alert('ต้องบอกเหตุผลครับ'); return; }
  srv('rejectReturn', [CURDOC, why, AUTH], function(r){
    alert('↩ วนกลับเป็นเคลมรอบใหม่แล้ว — รอบที่ ' + r.round + '\n\n' +
          'ใบเดิม เลขเดิม · ล้างลายเซ็นรอบ 2 และเลขเอกสาร GR / RCV / IS ให้แล้ว\n' +
          'กลับไปหาจัดซื้อให้คุยกับ Supplier ใหม่');
    go('claim', CURDOC);
  }, function(m){ alert(m); });
}
function addReturn(acc){
  var rec = { itemSeq:$('r_item') ? $('r_item').value : '', date:$('r_date').value,
              qty:$('r_qty').value, acc:acc, note:$('r_note').value };
  $('retnote').textContent = 'กำลังบันทึก…'; $('retnote').className = 'accnote wait';
  srv('saveReturn', [CURDOC, rec, AUTH], function(){ go('claim', CURDOC); },
      function(m){ $('retnote').textContent = m; $('retnote').className = 'accnote bad'; });
}
function doReclaim(){
  if (!confirm('เปิดใบเคลมรอบใหม่จากรายการที่ QC ไม่ Accept?')) return;
  srv('reclaimFromReturn', [CURDOC, AUTH], function(r){
    alert('เปิดใบเคลม ' + r.claimNo + ' แล้ว (' + r.n + ' รายการ)');
    go('claim', r.claimNo);
  }, function(m){ $('retmsg').innerHTML = '<div class="msg bad">' + esc(m) + '</div>'; });
}
</script>

<script>
/* ═══════════ ระบบรูปถ่าย (ใช้ร่วมกันทั้งใบเคลม · ใบตรวจ · ตาราง) ═══════════
   รูป = หลักฐาน · ย่อในเครื่องก่อนส่ง (กว้างสุด 1600px) เล็กลง 5-10 เท่า อัปเร็ว */

var PHOTOS = {};
var CURDOC = '', CURJOB = '';

function shrinkImage(file, maxW, quality){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onerror = function(){ rej(new Error('อ่านไฟล์ไม่ได้')); };
    fr.onload = function(){
      var img = new Image();
      img.onerror = function(){ rej(new Error('ไฟล์นี้ไม่ใช่รูปภาพ')); };
      img.onload = function(){
        var w = img.width, h = img.height;
        if (w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
        var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        res({ dataUrl: cv.toDataURL('image/jpeg', quality || 0.82), w:w, h:h });
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function pickPhotos(seq, cam){
  if (!CURDOC){ alert('เปิดเอกสารก่อน แล้วค่อยแนบรูปครับ'); return; }
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = !cam;
  if (cam) inp.setAttribute('capture', 'environment');
  inp.onchange = function(){ uploadList(seq, Array.prototype.slice.call(inp.files)); };
  inp.click();
}

function uploadList(seq, files, done){
  if (!files.length) return;
  var ok = 0, fail = 0;
  function step(i){
    if (i >= files.length){
      setPhotoMsg(seq, 'อัปโหลดเสร็จ ' + ok + ' รูป' + (fail ? (' · ไม่สำเร็จ ' + fail) : ''), fail ? 'bad' : 'good');
      loadPhotos(done);
      return;
    }
    setPhotoMsg(seq, 'กำลังย่อและอัปโหลดรูปที่ ' + (i+1) + ' / ' + files.length + '…', 'wait');
    shrinkImage(files[i], 1600, 0.82).then(function(r){
      google.script.run
        .withSuccessHandler(function(){ ok++; step(i+1); })
        .withFailureHandler(function(e){ fail++; setPhotoMsg(seq, (e && e.message) || 'อัปโหลดไม่สำเร็จ', 'bad'); step(i+1); })
        .savePhoto(CURDOC, CURJOB, seq, r.dataUrl, files[i].name, AUTH);
    }).catch(function(e){ fail++; setPhotoMsg(seq, e.message, 'bad'); step(i+1); });
  }
  step(0);
}
function setPhotoMsg(seq, msg, cls){
  var el = $('phmsg_' + seq); if (!el) return;
  el.className = 'phmsg ' + (cls || '');
  el.innerHTML = (cls === 'wait' ? '<span class="spin"></span> ' : '') + esc(msg);
}

function loadPhotos(done){
  if (!CURDOC) return;
  srv('listPhotos', [CURDOC, AUTH], function(p){
    PHOTOS = p || {};
    drawAllPhotos();
    if (typeof updateInsBar === 'function' && $('insbar')) updateInsBar();
    if (done) done();
  });
}
function drawAllPhotos(){
  var boxes = document.querySelectorAll('[data-phbox]');
  for (var i = 0; i < boxes.length; i++) drawPhotoBox(boxes[i]);
}
function drawPhotoBox(box){
  if (typeof box === 'string') box = document.querySelector('[data-phbox="' + box + '"]');
  if (!box) return;
  box.innerHTML = photoStrip(box.getAttribute('data-phbox'), box.getAttribute('data-phreq') || 'hard');
}
function photoStrip(seq, req){
  var list = PHOTOS[String(seq)] || [];
  var h = '<div class="phwrap">';
  list.forEach(function(p, k){
    var inDoc = p.doc !== false;
    h += '<div class="phcell' + (inDoc ? '' : ' nodoc') + '"><img src="' + p.thumb + '" alt="รูป ' + (k+1) + '" ' +
         'onclick="zoomPhoto(\'' + p.view + '\',\'' + p.thumb + '\')" ' +
         'onerror="this.parentNode.classList.add(\'bad\')">' +
         '<button class="phdoc' + (inDoc ? ' on' : '') + '" title="' +
           (inDoc ? 'รูปนี้จะขึ้นบนเอกสารที่ปริ้น — กดเพื่อไม่ให้ขึ้น' : 'รูปนี้ไม่ขึ้นบนเอกสาร — กดเพื่อให้ขึ้น') + '" ' +
           'onclick="toggleDocPhoto(\'' + seq + '\',\'' + p.id + '\',' + (inDoc ? 'false' : 'true') + ')">' +
           (inDoc ? '🖨' : '🚫') + '</button>' +
         '<button class="phdel" title="เอารูปนี้ออก" onclick="delPhoto(\'' + seq + '\',\'' + p.id + '\')">&#10005;</button></div>';
  });
  if (list.length < 5) h += '<div class="phadd" onclick="pickPhotos(\'' + seq + '\')"><b>+</b><span>เพิ่มรูป</span></div>';
  h += '</div>';
  if (!list.length){
    h += (req === 'soft')
      ? '<div class="phsoft">📷 ยังไม่มีรูปข้อนี้ — ถ่ายไว้ด้วยจะดี เป็นหลักฐานว่าตรวจแล้วจริง</div>'
      : '<div class="phwarn">⚠️ ยังไม่มีรูปหลักฐาน — รายการนี้เคลมไม่ได้</div>';
  }
  h += '<div class="phmsg" id="phmsg_' + seq + '"></div>';
  return h;
}
/** ติ๊กว่ารูปนี้จะขึ้นบนเอกสารที่ปริ้นไหม (ไม่ได้ลบรูป) */
function toggleDocPhoto(seq, id, on){
  srv('setPhotoInDoc', [CURDOC, id, on ? 1 : 0, AUTH], function(){
    var list = PHOTOS[String(seq)] || [];
    for (var i = 0; i < list.length; i++) if (list[i].id === id) list[i].doc = !!on;
    drawPhotoBox(String(seq));
  }, function(m){ alert(m); });
}

function delPhoto(seq, id){
  if (!confirm('เอารูปนี้ออกจากเอกสาร?\n(ไฟล์ยังอยู่ใน Drive ไม่ได้ลบทิ้ง)')) return;
  srv('removePhoto', [CURDOC, id, AUTH], function(){ loadPhotos(); });
}
function zoomPhoto(view, thumb){
  var d = document.createElement('div');
  d.className = 'lightbox';
  d.innerHTML = '<div class="lbbar"><a href="' + view + '" target="_blank">เปิดไฟล์เต็มใน Google Drive ↗</a>' +
                '<button onclick="this.closest(\'.lightbox\').remove()">ปิด ✕</button></div>' +
                '<img src="' + thumb.replace('sz=w1000','sz=w2000') + '">';
  d.onclick = function(e){ if (e.target === d) d.remove(); };
  document.body.appendChild(d);
}
/** เบียร์: "รูปที่โหลดมาใส่แล้ว เบียร์จะ Copy ไปให้ Supplier ยังไง"
 *  ให้ 3 ทาง: ปริ้น/PDF (รูปติดไปในเอกสารเลย) · ลิงก์โฟลเดอร์ · ก๊อปลิงก์รูปทีละรายการ */
function sharePhotos(){
  var seqs = Object.keys(PHOTOS).sort(function(a,b){ return num2(a) - num2(b); });
  var total = 0;
  for (var z = 0; z < seqs.length; z++) total += (PHOTOS[seqs[z]] || []).length;

  var t = '<div class="card"><div class="cardhd"><h3>📤 ส่งรูปให้ Supplier — ' + esc(CURDOC) + '</h3>' +
    '<span class="sub">' + total + ' รูป</span>' +
    '<button class="btn" onclick="go(\'claim\',CURDOC)">← กลับใบเคลม</button></div>';

  t += '<div class="sharebar">' +
    '<button class="btn primary" onclick="dlZip()">⬇️ ดาวน์โหลดรูปทั้งหมดเป็นไฟล์ .zip</button>' +
    '<span class="hint">ได้ไฟล์รูปตัวจริงมาที่เครื่อง ลากเข้า LINE หรือแนบอีเมลได้เลย</span>' +
    '<span id="zipmsg" class="hint"></span></div>';
  t += '<div class="hint" style="margin:2px 0 12px">หรือกด ⬇️ ใต้รูปแต่ละใบ เพื่อโหลดเฉพาะรูปนั้น · ' +
       'ถ้าอยากให้รูปติดไปในเอกสารเลย ใช้ <b>ปริ้น → บันทึกเป็น PDF</b> แทน</div>';

  if (!total){
    t += '<div class="empty">ใบนี้ยังไม่มีรูป</div></div>';
    $('view').innerHTML = t; return;
  }

  for (var i = 0; i < seqs.length; i++){
    var sq = seqs[i], list = PHOTOS[sq] || [];
    if (!list.length) continue;
    var nm = '';
    for (var k = 0; k < CLAIM.items.length; k++) if (String(CLAIM.items[k].seq) === String(sq)) nm = CLAIM.items[k].name;
    t += '<div class="shgrp"><div class="shhd">ข้อ ' + esc(sq) + (nm ? ' · ' + esc(nm) : '') +
         ' <span>(' + list.length + ' รูป)</span></div><div class="phwrap">';
    for (var j = 0; j < list.length; j++){
      t += '<div class="phcell rep"><img src="' + list[j].thumb + '" ' +
           'onclick="zoomPhoto(\'' + list[j].view + '\',\'' + list[j].thumb + '\')" ' +
           'onerror="this.parentNode.classList.add(\'bad\')">' +
           '<a class="phdl" title="ดาวน์โหลดรูปนี้" target="_blank" rel="noopener" ' +
           'href="https://drive.google.com/uc?export=download&id=' + esc(list[j].id) + '">⬇️</a></div>';
    }
    t += '</div></div>';
  }
  t += '</div>';
  $('view').innerHTML = t;
}

/** มัดรูปทั้งใบเป็น .zip แล้วเปิดให้โหลด */
function dlZip(){
  $('zipmsg').innerHTML = '<span class="spin"></span> กำลังมัดรูปเป็นไฟล์ zip…';
  srv('zipPhotos', [CURDOC, AUTH], function(r){
    $('zipmsg').innerHTML = '✓ ได้ไฟล์ <b>' + esc(r.name) + '</b> (' + r.n + ' รูป) — ' +
      '<a href="' + r.url + '" target="_blank" rel="noopener">ถ้าไม่เริ่มโหลดเอง กดตรงนี้</a>';
    window.open(r.url, '_blank');
  }, function(m){ $('zipmsg').innerHTML = '<span class="bad">' + esc(m) + '</span>'; });
}

function num2(v){ var n = parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isNaN(n) ? 0 : n; }
function openMediaFolder(){
  srv('getMediaFolderLink', [CURDOC, CURJOB, AUTH], function(u){ window.open(u, '_blank'); });
}
</script>
