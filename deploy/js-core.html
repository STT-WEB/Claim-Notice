<script>
/* ═══ แกนกลาง: เข้าสู่ระบบ · เมนู · เรียก server · บันทึกอัตโนมัติ ═══ */
/* ═══════════ กับดักที่เพิ่งเจอ (v0.6.3) — ต้องอ่าน ═══════════
   ป้ายเวอร์ชันเดิมอ่านค่าจาก getVersion() ซึ่งเป็น **โค้ดฝั่งเซิร์ฟเวอร์**
   แต่หน้าตาเว็บทั้งหมด (ปุ่ม ตาราง แถบขั้นตอน) อยู่ในไฟล์ .html ที่ **เบราว์เซอร์เก็บแคชไว้**

   → เบราว์เซอร์จำหน้าเก่าไว้ได้ ทั้งที่เซิร์ฟเวอร์อัปเดตแล้ว
     ป้ายขึ้นเวอร์ชันใหม่ (เพราะถามเซิร์ฟเวอร์) แต่หน้าจอยังเป็นของเก่า
     = **"ป้ายบอกว่าใหม่" ไม่ได้แปลว่า "สิ่งที่เห็นบนจอใหม่"** — หลงกันมาแล้ว 2 รอบ

   วิธีแก้: ฝังเลขเวอร์ชันไว้ในไฟล์หน้าเว็บเองด้วย (CLIENT_VER ข้างล่างนี้)
   ถ้า 2 ค่าไม่ตรงกัน = จอที่เห็นเป็นของเก่าแน่นอน ระบบจะขึ้นแถบแดงบอกให้กด Ctrl+Shift+R
   ⚠️ แก้ไฟล์หน้าเว็บทุกครั้ง ต้องเลื่อน CLIENT_VER ให้ตรงกับ VERSION ใน CLAIM-Hub.js */
var CLIENT_VER = 'v1.6.0';

var AUTH = null;        // {emp, pin} — อยู่ในหน่วยความจำหน้าเว็บเท่านั้น ไม่เก็บลงเครื่อง
var ME   = null;
var CURVIEW = 'home';

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function money(v){
  var n = Number(String(v == null ? '' : v).replace(/,/g,''));
  if (isNaN(n) || String(v).trim() === '') return '';
  return n.toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2});
}
function busy(on, msg){
  var v = $('view'); if (!v) return;
  if (on) v.innerHTML = '<div class="card"><span class="spin"></span> ' + esc(msg || 'กำลังทำงาน…') + '</div>';
}
function srv(fn, args, ok, fail){
  google.script.run
    .withSuccessHandler(function(r){ try{ ok && ok(r); }catch(e){ alert('แสดงผลผิดพลาด: ' + e.message); } })
    .withFailureHandler(function(e){
      var m = (e && e.message) ? e.message : String(e);
      if (fail) fail(m); else $('view').innerHTML = '<div class="msg bad">' + esc(m) + '</div>';
    })[fn].apply(null, args || []);
}
function hasRole(r){
  if (!ME) return false;
  var rs = (ME.roles && ME.roles.length) ? ME.roles : [ME.role];
  return rs.indexOf('ADMIN') >= 0 || rs.indexOf(r) >= 0;
}

/* ═══════════ บันทึกอัตโนมัติ (เหมือน Google Sheets) ═══════════
   เบียร์: "ในระบบ เมื่อพิมแล้ว ต้องบันทึกเองเลย เหมือนทำใน GGS · ห้ามเด้งขึ้นลงเอง"

   กฎที่โค้ดนี้ต้องรักษาให้ได้ 3 ข้อ
   1. พิมพ์เสร็จ (หยุดพิมพ์ 0.6 วิ) หรือคลิกออกจากช่อง → บันทึกเอง ไม่มีปุ่ม Save
   2. บันทึกแล้ว **ห้ามวาดหน้าใหม่** — ไม่งั้นจอเด้ง เคอร์เซอร์หลุด ตรงที่พิมพ์อยู่หาย
      → เซิร์ฟเวอร์ตอบกลับมาก็แค่ติ๊กเขียวข้างช่อง ไม่แตะ DOM ส่วนอื่น
   3. บันทึกไม่ผ่าน ต้องเห็นชัดว่าช่องไหน + เพราะอะไร ไม่ใช่เงียบหาย                */
var SAVET = {};      // ตัวจับเวลาแยกตามช่อง — พิมพ์รัว ๆ ส่งครั้งเดียว
var SAVING = 0;

/* บันทึกสำเร็จเมื่อไหร่ → ถามเซิร์ฟเวอร์ว่า "ตอนนี้ส่งต่อได้หรือยัง"
   หน้าที่ไม่มี refreshGate (เช่นหน้าทะเบียน) ก็แค่ไม่ทำอะไร */
function gateTouch(){ if (typeof refreshGate === 'function') refreshGate(); }

function fieldMark(el, state, msg){
  if (!el) return;
  el.classList.remove('sv-wait','sv-ok','sv-bad');
  if (state) el.classList.add('sv-' + state);
  el.title = msg || (state === 'ok' ? 'บันทึกแล้ว' : state === 'bad' ? msg : '');
  if (state === 'ok') setTimeout(function(){ el.classList.remove('sv-ok'); }, 1400);
  var b = $('savebar');
  if (b){
    if (state === 'wait'){ SAVING++; b.className = 'savebar wait'; b.textContent = 'กำลังบันทึก…'; }
    else {
      SAVING = Math.max(0, SAVING - 1);
      if (state === 'bad'){ b.className = 'savebar bad'; b.textContent = '⚠️ ' + (msg || 'บันทึกไม่สำเร็จ'); }
      else if (!SAVING){ b.className = 'savebar ok'; b.textContent = '✓ บันทึกแล้วทุกช่อง'; gateTouch(); }
    }
  }
}

/** ผูกช่องกรอก 1 ช่องเข้ากับฟังก์ชันบันทึกฝั่งเซิร์ฟเวอร์ */
function bindSave(el, fn, argsFn, onDone){
  if (!el) return;
  var key = fn + ':' + (el.id || el.name || Math.random());
  function fire(){
    var args = argsFn();
    fieldMark(el, 'wait');
    google.script.run
      .withSuccessHandler(function(r){ fieldMark(el, 'ok'); if (onDone) onDone(r); })
      .withFailureHandler(function(e){ fieldMark(el, 'bad', (e && e.message) || 'บันทึกไม่สำเร็จ'); })
      [fn].apply(null, args);
  }
  el.addEventListener('input', function(){
    if (SAVET[key]) clearTimeout(SAVET[key]);
    SAVET[key] = setTimeout(fire, 600);
  });
  el.addEventListener('change', function(){
    if (SAVET[key]) clearTimeout(SAVET[key]);
    fire();
  });
  el.addEventListener('blur', function(){
    if (SAVET[key]){ clearTimeout(SAVET[key]); fire(); }
  });
}

/** ผูกทุกช่องในกล่องที่มี data-save="ชื่อฟังก์ชัน" data-f="ชื่อช่อง" */
function bindAll(scopeEl, docNo){
  var els = (scopeEl || document).querySelectorAll('[data-save]');
  for (var i = 0; i < els.length; i++){
    (function(el){
      var fn  = el.getAttribute('data-save');
      var f   = el.getAttribute('data-f');
      var seq = el.getAttribute('data-seq');
      bindSave(el, fn, function(){
        return seq == null ? [docNo, f, el.value, AUTH] : [docNo, seq, f, el.value, AUTH];
      }, function(r){
        // เซิร์ฟเวอร์คิดราคาให้ใหม่ → เติมเฉพาะช่องนั้นช่องเดียว ไม่วาดหน้าใหม่
        if (r && r.price != null && r.price !== ''){
          var p = document.querySelector('[data-price="' + seq + '"]');
          if (p) p.value = r.price;
        }
        if (typeof refreshTotals === 'function') refreshTotals();
      });
    })(els[i]);
  }
}

/* ─── ตัวช่วยสร้างช่องกรอก (ใช้ร่วมกันทุกหน้า) ─── */
/* who = ป้ายบอกว่าช่องนี้ใครเป็นคนกรอก · req = true ใส่ดาวแดงว่าต้องกรอก
   เบียร์: "ใครต้องใส่ข้อมูลตรงไหน ไม่มีบอกเลย" — ตอนนี้ทุกช่องบอกเจ้าของงานแล้ว */
/** เครื่องนี้เป็นจอสัมผัสไหม — ใช้ตัดสินว่าจะโชว์ปุ่มถ่ายรูปหน้างานหรือเปล่า */
function isTouch(){
  try { return ('ontouchstart' in window) || navigator.maxTouchPoints > 0; } catch(e){ return false; }
}

function fr(label, ctrl, who, req){
  /* เบียร์: "ไม่ต้องมี ขั้น 1 2 3 แต่ให้เป็นสีตรงหัวข้อที่จะกรอกเลย จะได้ดูไม่เลอะเทอะ"
     → ไม่มีป้ายแล้ว ใช้ "สีของหัวข้อ" บอกว่าใครกรอก · คำอธิบายสีอยู่แถบบนสุดของฟอร์ม */
  var cls = '', tip = '';
  if (who){
    var q = who.split('|'); tip = q[1] || q[0];
    cls = q[0].indexOf('ขั้น 1') === 0 ? ' o1' : q[0].indexOf('ขั้น 2') === 0 ? ' o2'
        : q[0].indexOf('ขั้น 3') === 0 ? ' o3' : ' oa';
  }
  return '<div class="frow' + cls + '"><label' + (tip ? ' title="' + esc(tip) + '"' : '') + '>' +
         label + (req ? ' <b class="req" title="ต้องกรอก">*</b>' : '') + '</label>' + ctrl + '</div>';
}
function fld(label, ctrl){ return '<div class="fld"><label>' + label + '</label><div><b>' + ctrl + '</b></div></div>'; }
/** ช่องที่บันทึกเอง — bindAll() จะอ่าน data-save / data-f / data-seq แล้วผูก event ให้ */
function ip(id, fn, field, val, ph, list){
  return '<input id="' + id + '" data-save="' + fn + '" data-f="' + field + '" ' +
         (list ? 'list="' + list + '" ' : '') +
         (ph ? 'placeholder="' + esc(ph) + '" ' : '') +
         'value="' + esc(val == null ? '' : val) + '">';
}
function sel(id, fn, field, val, opts){
  var t = '<select id="' + id + '" data-save="' + fn + '" data-f="' + field + '">';
  for (var i = 0; i < opts.length; i++){
    t += '<option value="' + esc(opts[i][0]) + '"' + (String(val == null ? '' : val) === opts[i][0] ? ' selected' : '') + '>' +
         esc(opts[i][1]) + '</option>';
  }
  return t + '</select>';
}

/** เทียบเวอร์ชันหน้าเว็บกับเวอร์ชันเซิร์ฟเวอร์ — ไม่ตรง = เบราว์เซอร์ยังใช้หน้าเก่า */
function checkVer(serverVer){
  var el = $('loginVer');
  if (el) el.textContent = 'STT CLAIM HUB · ' + CLIENT_VER;
  var b = $('verBadge'); if (b) b.textContent = CLIENT_VER;
  if (!serverVer || serverVer === CLIENT_VER) return;

  /* ขึ้นเตือนแบบไม่ต้องเดา บอกไปเลยว่าเห็นของเก่าอยู่ ต้องทำอะไร */
  if (document.querySelector('.stalebar')) return;   // ขึ้นแถบเดียวพอ
  var w = document.createElement('div');
  w.className = 'stalebar';
  w.innerHTML = '⚠️ <b>หน้าเว็บที่คุณเห็นเป็นของเก่า</b> — ' +
    'หน้าจอเวอร์ชัน <b>' + esc(CLIENT_VER) + '</b> แต่ระบบอัปเดตเป็น <b>' + esc(serverVer) + '</b> แล้ว ' +
    'เบราว์เซอร์ยังจำหน้าเดิมไว้ · กด <b>Ctrl+Shift+R</b> (หรือปุ่มนี้) เพื่อโหลดใหม่ ' +
    '<button onclick="hardReload()">โหลดหน้าใหม่</button>';
  document.body.insertBefore(w, document.body.firstChild);
}
/** บังคับโหลดใหม่โดยไม่เอาของในแคช — เติมพารามิเตอร์กันแคชไปด้วย */
function hardReload(){
  var u = location.href.split('#')[0].replace(/[?&]_r=\d+/, '');
  location.href = u + (u.indexOf('?') >= 0 ? '&' : '?') + '_r=' + Date.now();
}

/* ─── หน้า login ─── */
function loginTab(which){
  var isLogin = (which === 'login');
  $('tabLogin').className = 'lrole' + (isLogin ? ' on' : '');
  $('tabReg').className   = 'lrole' + (isLogin ? '' : ' on');
  $('loginPin').style.display = isLogin ? '' : 'none';
  $('loginReg').style.display = isLogin ? 'none' : '';
}

function enterApp(r, via){
  ME = { name:r.name, role:r.role, roles:r.roles || [], dept:r.dept || '', emp:r.emp || '' };
  startPulse();                       // เริ่มเช็คของใหม่ทุก 30 วินาที
  $('loginScreen').style.display = 'none';
  $('app').style.display = '';
  var rs = (r.roles && r.roles.length) ? r.roles.join(' · ') : r.role;
  $('whoami').textContent = r.name + ' · ' + rs + (via ? ' (' + via + ')' : '');
  go('home');
}

function submitLogin(){
  var emp = $('empInput').value.trim(), pin = $('pinInput').value.trim();
  $('loginErr').textContent = '';
  if (!emp || !pin){ $('loginErr').textContent = 'กรอกรหัสพนักงานและ PIN ให้ครบ'; return; }
  google.script.run
    .withSuccessHandler(function(r){
      if (!r || !r.ok){ $('loginErr').textContent = (r && r.msg) || 'เข้าสู่ระบบไม่สำเร็จ'; return; }
      AUTH = { emp:emp, pin:pin };
      enterApp(r, '');
    })
    .withFailureHandler(function(e){ $('loginErr').textContent = (e && e.message) ? e.message : 'เชื่อมต่อไม่ได้'; })
    .loginEmpPin(emp, pin);
}

/* ═══ ตั้ง PIN ครั้งแรก — ทำในระบบนี้เลย ไม่ต้องไป NOVA (v1.2.6) ═══ */
function checkReg(){
  var emp = $('rgEmp').value.trim();
  $('rgErr').textContent = '';
  if (!emp){ $('rgErr').textContent = 'กรอกรหัสพนักงานก่อน'; return; }
  $('rgErr').innerHTML = '<span class="spin"></span> กำลังตรวจ…';
  google.script.run
    .withSuccessHandler(function(r){
      if (!r || !r.ok){ $('rgErr').textContent = (r && r.msg) || 'ตรวจไม่สำเร็จ'; $('rgStep2').style.display='none'; return; }
      $('rgErr').textContent = '';
      $('rgWho').innerHTML = '✅ พบรหัสนี้ในทะเบียน — <b style="color:#fff">' + esc(r.hint) + '</b>' +
        (r.dept ? ' · ' + esc(r.dept) : '') + (r.role ? ' · สิทธิ์ ' + esc(r.role) : '') +
        '<br>ถ้าใช่ตัวคุณ พิมพ์ชื่อ-สกุลเต็ม แล้วกดขอ PIN ได้เลย';
      $('rgStep2').style.display = '';
      $('rgName').focus();
    })
    .withFailureHandler(function(e){ $('rgErr').textContent = (e && e.message) || 'เชื่อมต่อไม่ได้'; })
    .checkPinSetup(emp);
}

/* ═══ ขอ PIN ครั้งแรก — ระบบสุ่มให้ แล้วโชว์ครั้งเดียว ═══════════════════
   เบียร์ 8 ก.ย. 2569: "พอกดขอ PIN ก็จะโชว์ให้พนักงานเห็นในหน้านั้นเลย แล้วเค้าก็จำกัน
                        เพราะเบียร์จะไม่ให้ซ้ำ เพราะว่าแต่ละคนต้องจำของตัวเอง"
   ⚠️ ห้ามพาเข้าระบบให้อัตโนมัติ — ต้องให้เขาเห็นเลขและจำก่อน
      แล้วพิมพ์เองรอบแรก จะได้รู้ว่าจำได้จริง                                */
function doReg(){
  var emp = $('rgEmp').value.trim(), nm = $('rgName').value.trim();
  $('rgErr').textContent = '';
  if (!nm){ $('rgErr').textContent = 'พิมพ์ชื่อ-สกุลของคุณ'; return; }
  $('rgErr').innerHTML = '<span class="spin"></span> กำลังขอ PIN…';
  google.script.run
    .withSuccessHandler(function(r){
      if (!r || !r.ok){ $('rgErr').textContent = (r && r.msg) || 'ขอ PIN ไม่สำเร็จ'; return; }
      $('rgErr').textContent = '';
      $('rgStep2').style.display = 'none';
      $('rgEmp').disabled = true;
      $('rgPinShow').textContent = r.pin;
      $('rgDone').style.display = '';
    })
    .withFailureHandler(function(e){ $('rgErr').textContent = (e && e.message) || 'เชื่อมต่อไม่ได้'; })
    .requestPin(emp, nm);
}

/* กดจำแล้ว → ไปแท็บเข้าสู่ระบบ เติมรหัสพนักงานให้ แต่ PIN ต้องพิมพ์เอง */
function regGoLogin(){
  var emp = $('rgEmp').value.trim();
  $('rgPinShow').textContent = '••••••';       // ลบเลขออกจากหน้าจอทันที
  $('rgDone').style.display = 'none';
  $('rgEmp').disabled = false; $('rgEmp').value = ''; $('rgName').value = '';
  loginTab('login');
  $('empInput').value = emp;
  $('pinInput').value = '';
  $('pinInput').focus();
}

function logout(){
  AUTH = null; ME = null;
  $('app').style.display = 'none';
  $('loginScreen').style.display = '';
  $('empInput').value = ''; $('pinInput').value = ''; $('loginErr').textContent = '';
  loginTab('login');
}
function refreshData(){ go(CURVIEW, CURARG); }

/* ─── เปลี่ยนหน้า ─── */
var CURARG = null;
function go(v, arg){
  CURVIEW = v; CURARG = arg;
  window.scrollTo(0, 0);
  if (v === 'home')       return loadHome();
  if (v === 'work')       return drawQueue(arg);
  /* ① Inspection */
  if (v === 'inslist')    return loadInspList();
  if (v === 'newins')     return newInspForm();
  if (v === 'ins')        return openInspection(arg);
  /* ② Claim */
  if (v === 'list')       return loadList();
  if (v === 'newclaim')   return newClaimForm(arg);
  if (v === 'claim')      return openClaim(arg);
  if (v === 'print')      return (CLAIM && CLAIM.head['เลขที่เอกสาร'] === arg)
                                  ? openPrint()
                                  : srv('getClaimFull', [arg, AUTH], function(c){
                                      CLAIM = c; FLOW = c.flow || null; CURDOC = arg;
                                      CURJOB = c.head['เลขที่ JOB'] || ''; PHOTOS = c.photos || {};
                                      openPrint();
                                    });
  /* ③ All Data and Report */
  if (v === 'dash')       return loadDash();
  if (v === 'tpl')        return loadTplList();
  if (v === 'reports')    return loadReportHome();
  if (v === 'repmedia')   return loadRepMedia();
  if (v === 'repjob')     return loadRepJob();
  if (v === 'repdocs')    return loadRepDocs();
  if (v === 'repcost')    return loadRepCost();
  if (v === 'repbill')    return loadRepBill();
  if (v === 'rephr')      return loadRepHR();
  if (v === 'repacc')     return loadRepAcc();
  if (v === 'supdoc')     return loadSupDocs();
  $('view').innerHTML = '<div class="msg bad">ไม่รู้จักหน้า ' + esc(v) + '</div>';
}

/* ═══════════ หน้าแรก = 3 กล่อง (ตามที่เบียร์ออกแบบ) ═══════════ */
/* เบียร์: "กำลังโหลดหน้าแรก… โหลดทำไมช้ามาก"
   หน้าแรกต้องต้องนับของทั้งระบบ (ใบตรวจ ใบเคลม รายการ รูป) ซึ่งกินเวลาจริง
   → วาดหน้าให้ก่อนเลยด้วยตัวเลขจำล่าสุด กดใช้งานได้ทันที แล้วค่อยเติมตัวเลขจริงทีหลัง
   HOME_LAST เก็บไว้ในหน่วยความจำหน้าเว็บ กลับมาหน้าแรกรอบสองจึงขึ้นทันที */
var HOME_LAST = null;
var STAGES_C = null;      // รายชื่อขั้นตอนใบเคลม จากเซิร์ฟเวอร์ — ห้ามเขียนซ้ำในหน้าเว็บ

/* ═══════════ อัปเดตอัตโนมัติ (v1.2.5) ═══════════════════════════
 * เบียร์ 7 ก.ย.: "ตอนนี้ต้องกด Refresh ตลอดเลย มันไม่อัปเดตอัตโนมัติหรอ
 *                 แบบพนักงานกดเซฟมา ของเบียร์ก็จะเห็นเลยว่ามีเอกสารใหม่มาแล้ว"
 * เบียร์เลือกแบบ (ก): ระบบเช็คให้เองทุก 30 วิ ถ้ามีของใหม่ **ขึ้นแถบบอก** ให้กดเอง
 * ⚠️ ห้ามวาดจอใหม่เองเด็ดขาด — ถ้าจอเด้งตอนพนักงานกำลังพิมพ์ ข้อมูลที่พิมพ์ค้างจะหาย
 *    (นี่คือเหตุผลที่ไม่เลือกแบบ ข) */
var PULSE_MS = 30000;
var PULSE_LAST = null;
var PULSE_TIMER = null;

function startPulse(){
  if (PULSE_TIMER) return;
  PULSE_TIMER = setInterval(function(){
    if (document.hidden) return;                  // ซ่อนแท็บอยู่ ไม่ต้องถาม ประหยัดโควตา
    srv('pulse', [AUTH], function(p){
      if (!p) return;
      if (!PULSE_LAST){ PULSE_LAST = p; return; }
      if (p.sig !== PULSE_LAST.sig){
        var dNew = (p.nClaim - PULSE_LAST.nClaim) + (p.nInsp - PULSE_LAST.nInsp);
        showPulseBar(dNew, p);
      }
    }, function(){});                             // เน็ตสะดุดก็เงียบไว้ ไม่ต้องกวนคนใช้งาน
  }, PULSE_MS);
}

function showPulseBar(nNew, p){
  var bar = $('pulsebar');
  if (!bar){
    bar = document.createElement('div');
    bar.id = 'pulsebar';
    bar.className = 'pulsebar';
    document.body.appendChild(bar);
  }
  bar.innerHTML = (nNew > 0
      ? '🔔 <b>มีเอกสารใหม่ ' + nNew + ' ใบ</b>'
      : '🔄 <b>มีคนอัปเดตเอกสาร</b>') +
    ' <span>อัปเดตเมื่อ ' + esc(p.at) + '</span>' +
    '<button class="btn primary" onclick="pulseApply()">ดูของใหม่</button>' +
    '<button class="btn ghost" onclick="pulseDismiss()">ไว้ก่อน</button>';
  bar.classList.add('show');
  PULSE_PENDING = p;
}
var PULSE_PENDING = null;

function pulseApply(){
  PULSE_LAST = PULSE_PENDING || PULSE_LAST;
  pulseDismiss();
  HOME_LAST = null;
  clearCachesQuiet();
  go(CURVIEW === 'home' ? 'home' : CURVIEW, CURARG);
}
function pulseDismiss(){
  PULSE_LAST = PULSE_PENDING || PULSE_LAST;      // กด "ไว้ก่อน" = รับรู้แล้ว ไม่เด้งซ้ำเรื่องเดิม
  var bar = $('pulsebar'); if (bar) bar.classList.remove('show');
}
function clearCachesQuiet(){ try { google.script.run.clearCaches(); } catch(e){} }

function loadHome(){
  if (HOME_LAST) drawWork(HOME_LAST, true);
  else busy(true, 'กำลังเปิดหน้าแรก…');
  srv('workQueues', [AUTH], function(w){
    HOME_LAST = w;
    if (CURVIEW === 'home') drawWork(w, false);
  });
  /* ดึงรายชื่อขั้นตอน + ตัวเลขรวมมาเก็บไว้เงียบ ๆ ใช้ในหน้าอื่น */
  srv('getHome2', [AUTH], function(h){
    if (!h) return;                       /* กันหน้าเด้ง alert ถ้าเซิร์ฟเวอร์ตอบว่างมา */
    KPI_LAST = h;
    if (h.stages && h.stages.length) STAGES_C = h.stages;
    if (h.insStages && h.insStages.length) STAGES_I = h.insStages;
    if (CURVIEW === 'home' && HOME_LAST) drawWork(HOME_LAST, false);
  });
}

var WTAB = '';
function goTab(k){ WTAB = k; go('work', k); }

function canSeeItem(it){
  if (!it.only) return true;
  for (var i = 0; i < it.only.length; i++) if (hasRole(it.only[i])) return true;
  return false;
}

function drawWork(w, stale){
  var t = '<div class="hero"><h1>STT CLAIM HUB</h1>' +
    '<p>งานเคลม · ตรวจรับสินค้า — เลือกกล่องงานของคุณ</p>' +
    '<span class="hchip">' + esc(w.me || '') + (w.dept ? ' · ' + esc(w.dept) : '') + '</span></div>';

  t += '<div class="modgrid">';
  for (var m = 0; m < MODULES.length; m++){
    var mo = MODULES[m], body = '';
    for (var i = 0; i < mo.items.length; i++){
      var it = mo.items[i], allowed = canSeeItem(it);
      /* เบียร์ 8 ก.ย. 2569: "รายงานส่ง HR ... จะมีแค่ HR กับ Admin และคนที่ Approve เห็น"
         เมนูที่ตั้ง hide:true = คนไม่มีสิทธิ์ต้อง "ไม่เห็น" เลย ไม่ใช่แค่จาง ๆ กดไม่ได้
         (ใช้กับข้อมูลที่แค่เห็นหัวข้อก็ไม่เหมาะ เช่น เรื่องหักเงินเดือนพนักงาน) */
      if (!allowed && it.hide) continue;
      var q = it.q ? ((w.tabs && w.tabs[it.q]) || { n:0 }) : null;
      var act = allowed
        ? (it.k.indexOf('w:') === 0 ? "goTab('" + it.k.slice(2) + "')" : "go('" + it.k + "')")
        : "alert('เมนูนี้เปิดได้เฉพาะ " + esc(it.only.join(' / ')) + "')";
      body += '<div class="moditem' + (allowed ? '' : ' off') + '" onclick="' + act + '">' +
        '<div class="mi-ic">' + it.ic + '</div>' +
        '<div><div class="mi-t">' + esc(it.t) + '</div>' +
        '<div class="mi-d">' + esc(it.d) + '</div></div>' +
        (q ? '<span class="mi-n' + (q.n ? '' : ' zero') + '">' + q.n + '</span>' : '') +
        '</div>';
    }
    t += '<div class="modcard" style="--ac:' + mo.ac + ';--acbg:' + mo.acbg + '">' +
      '<div class="modhd"><div class="modic">' + mo.ic + '</div>' +
      '<div class="modttl">' + esc(mo.name) + '</div>' +
      (mo.id ? '<span class="modstep">ขั้นที่ ' + mo.id + '</span>' : '') + '</div>' +
      '<div class="modrole">' + esc(mo.role) + '</div>' + body +
      '<div class="modtag">' + esc(mo.tag) + '</div></div>';
  }
  t += '</div>';

  var h = KPI_LAST;
  if (h){
    t += '<div class="kpirow">' +
      kpi('ใบตรวจรับ', h.ins.total) + kpi('ตรวจยังไม่จบ', h.ins.open, h.ins.open ? 'warn' : '') +
      kpi('ใบเคลม', h.clm.total) + kpi('เคลมยังไม่ปิด', h.clm.open, h.clm.open ? 'warn' : '') +
      kpi('ใบที่รูปยังไม่ครบ', h.clm.noPhoto + h.ins.noPhoto, (h.clm.noPhoto + h.ins.noPhoto) ? 'bad' : '') +
      kpi('รูปในระบบ', h.rep.photos) + '</div>';
  }
  if (stale) t += '<div class="hint"><span class="spin"></span> กำลังอัปเดตตัวเลขล่าสุด…</div>';
  $('view').innerHTML = t;
}

  var ti = WTITLE[k] || ['งานเคลม',''];
  var t = '<div class="card"><div class="cardhd"><h3>' + esc(ti[0]) + '</h3>' +
    '<span class="sub">' + esc(ti[1]) + '</span>' +
    '<button class="btn" onclick="go(\'home\')">← หน้าแรก</button>' +
    (k === 'open' ? '<button class="btn primary" onclick="go(\'newclaim\')">+ เปิดใบขอเคลมใหม่</button>' : '') +
    '</div>';
  t += '<div class="wnote' + (cur.mine ? '' : ' notmine') + '">' +
       (cur.mine ? '✋ <b>ขั้นนี้เป็นงานของคุณ</b>' : '👁 <b>ขั้นนี้ไม่ใช่หน้าที่คุณ</b> ดูได้อย่างเดียว') + '</div>';
  if (!cur.rows.length){
    t += '<div class="empty">ยังไม่มีใบค้างในขั้นนี้</div></div>';
    $('view').innerHTML = t; return;
  }
  /* กล่อง "เอกสารถูกตีกลับ" ต้องเห็น **เหตุผล** ตั้งแต่ในตาราง
     ไม่ใช่ต้องเปิดใบทีละใบถึงจะรู้ว่าโดนตีกลับเพราะอะไร */
  var isRj = (k === 'reject');
  t += '<div class="tblwrap"><table class="grid"><thead><tr>' +
    '<th style="width:124px">เลขที่</th><th style="width:92px">วันที่</th>' +
    '<th style="width:116px">เลขที่ JOB</th><th>ชื่อลูกค้า</th>' +
    (isRj ? '<th style="width:300px">ตีกลับเพราะอะไร</th><th style="width:170px">ตีกลับโดย · เมื่อไหร่</th>'
          : '<th style="width:190px">ขั้นตอนตอนนี้</th><th style="width:150px">รอใครทำ</th>') +
    '<th style="width:74px">รูป</th><th style="width:120px">ผู้เปิดใบ</th></tr></thead><tbody>';
  for (var r = 0; r < cur.rows.length; r++){
    var x = cur.rows[r];
    t += '<tr style="cursor:pointer" onclick="go(\'claim\',\'' + esc(x.docNo) + '\')">' +
      '<td><b>' + esc(x.docNo) + '</b></td>' +
      '<td class="c" style="white-space:nowrap">' + esc(x.date) + '</td>' +
      '<td>' + esc(x.jobNo) + '</td><td>' + esc(x.jobName) + '</td>' +
      (isRj
        ? '<td><b style="color:var(--red,#C4161C)">' + esc(x.rejectNote || '(ไม่ได้ระบุเหตุผล)') + '</b>' +
          '<div class="sub2">กลับไปขั้น ' + esc(x.stageNo) + ' · ' + esc(x.stageName) + '</div></td>' +
          '<td class="hint">' + esc(x.rejectBy || '') +
          (x.rejectAt ? '<div class="sub2">' + esc(x.rejectAt) + '</div>' : '') + '</td>'
        : '<td class="c"><span class="pill">' + esc(x.stageNo) + ' · ' + esc(x.stageName) + '</span></td>' +
          '<td class="hint">' + esc(x.waitWho || '') + '</td>') +
      '<td class="c">' + (x.nNoPhoto ? '<span class="pill red">ขาด ' + x.nNoPhoto + '</span>'
                                     : '<span class="pill green">ครบ</span>') + '</td>' +
      '<td>' + esc(x.by) + '</td></tr>';
  }
  t += '</tbody></table></div></div>';
  $('view').innerHTML = t;
}


function replink(v, no, ic, label, right){
  return '<a class="replink" onclick="go(\'' + v + '\')">' +
         '<span class="rno">' + no + '</span><span class="ric">' + ic + '</span>' +
         '<span class="rlb">' + esc(label) + '</span>' +
         (right ? '<span class="rrt">' + esc(right) + '</span>' : '') + '</a>';
}
function kpi(label, n, cls){
  return '<span class="kpi ' + (cls || '') + '"><b>' + n + '</b>' + esc(label) + '</span>';
}
function box(no, ic, title, sub, lines, btns, foot){
  var t = '<div class="box"><div class="boxhd"><span class="boxno">' + no + '</span>' +
          '<span class="boxic">' + ic + '</span>' +
          '<div><h3>' + esc(title) + '</h3><p>' + esc(sub) + '</p></div></div><ul class="boxul">';
  for (var i = 0; i < lines.length; i++) t += '<li>' + lines[i] + '</li>';
  t += '</ul><div class="boxbtn">';
  for (var k = 0; k < btns.length; k++){
    t += '<button class="btn ' + btns[k][2] + '" onclick="go(\'' + btns[k][0] + '\')">' + btns[k][1] + '</button>';
  }
  t += '</div>' + (foot ? '<div class="boxfoot">' + esc(foot) + '</div>' : '') + '</div>';
  return t;
}
