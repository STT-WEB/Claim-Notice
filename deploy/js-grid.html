<script>
/* ═══════════ ตารางแบบ Excel (v0.4.0) ═══════════
   เบียร์: "ตารางทั้งหมด ต้องเป็นเหมือนตาราง Excel และต้อง Copy ตารางจากข้างนอกมาวางได้เลย"

   ทำอะไรได้บ้าง
   · วางทับจาก Google Sheets / Excel ได้เลย (Ctrl+V) — ข้อมูลหลายแถวหลายคอลัมน์วางทีเดียว
     แถวไม่พอระบบเติมให้เอง · ตัวเลขที่มีลูกน้ำ (1,250) ตัดลูกน้ำให้
   · เดินด้วยคีย์บอร์ดเหมือน Excel — Enter ลงล่าง · Tab ไปขวา · ลูกศรขึ้นลง
   · แถวสุดท้ายพิมพ์แล้วเพิ่มแถวใหม่ให้เอง ไม่ต้องกดปุ่ม
   · ช่องรูปอยู่ในแถวเลย แนบได้ตั้งแต่ยังไม่บันทึก

   วิธีใช้:  var g = makeGrid('gridBox', COLS, rows, {onChange:fn, photos:true});
             g.data()  → คืนข้อมูลทั้งตาราง                                        */

var GRIDS = {};
var GRIDSEQ = 0;

function makeGrid(hostId, cols, rows, opt){
  opt = opt || {};
  var id = 'g' + (++GRIDSEQ);
  var g = {
    id:id, host:hostId, cols:cols, rows:(rows && rows.length ? rows : []),
    opt:opt, rid:0
  };
  if (!g.rows.length) g.rows = [blankRow(g), blankRow(g)];
  else for (var i = 0; i < g.rows.length; i++) if (!g.rows[i]._rid) g.rows[i]._rid = 'r' + (++g.rid);
  GRIDS[id] = g;
  g.data = function(){ return gridData(id); };
  g.redraw = function(){ drawGrid(id); };
  drawGrid(id);
  return g;
}
function blankRow(g){
  var o = { _rid:'r' + (++g.rid) };
  for (var i = 0; i < g.cols.length; i++) o[g.cols[i].k] = '';
  return o;
}
function gridData(id){
  syncGrid(id);
  return GRIDS[id].rows;
}

function drawGrid(id){
  var g = GRIDS[id];
  var t = '<div class="xwrap"><table class="xt" id="' + id + '"><thead><tr><th class="xno">#</th>';
  for (var c = 0; c < g.cols.length; c++){
    var col = g.cols[c];
    t += '<th style="' + (col.w ? 'width:' + col.w + 'px' : '') + '">' + col.label +
         (col.sub ? '<span>' + col.sub + '</span>' : '') + '</th>';
  }
  if (g.opt.photos) t += '<th style="width:250px">รูป <span>อย่างน้อย 1 · มากสุด ' + (g.opt.maxPhoto || 5) + '</span></th>';
  t += '<th class="xdel"></th></tr></thead><tbody>';

  for (var r = 0; r < g.rows.length; r++){
    t += gridRowHtml(g, r);
  }
  t += '</tbody></table></div>';
  t += '<div class="xfoot"><button class="btn ghost" onclick="gridAddRow(\'' + id + '\')">+ เพิ่มแถว</button>' +
       '<span class="hint">คัดลอกจาก Google Sheets แล้วกด <b>Ctrl+V</b> ในตารางนี้ได้เลย · ' +
       'Enter = ลงแถวล่าง · Tab = ไปช่องขวา</span></div>';
  $(g.host).innerHTML = t;
  bindGrid(id);
  if (g.opt.photos) gridDrawPhotos(id);
}

function gridRowHtml(g, r){
  var row = g.rows[r];
  var t = '<tr data-r="' + r + '"><td class="xno">' + (r + 1) + '</td>';
  for (var c = 0; c < g.cols.length; c++){
    var col = g.cols[c];
    var v = esc(row[col.k] == null ? '' : row[col.k]);
    var cls = (col.type === 'num') ? ' class="r"' : '';
    if (col.type === 'area'){
      t += '<td><textarea data-r="' + r + '" data-c="' + c + '">' + v + '</textarea></td>';
    } else {
      t += '<td><input' + cls + ' data-r="' + r + '" data-c="' + c + '"' +
           (col.list ? ' list="' + col.list + '"' : '') +
           (col.ph ? ' placeholder="' + esc(col.ph) + '"' : '') +
           ' value="' + v + '"></td>';
    }
  }
  if (g.opt.photos){
    t += '<td class="xph"><div data-gph="' + row._rid + '"></div></td>';
  }
  t += '<td class="xdel"><button class="rowbtn" title="ลบแถวนี้" onclick="gridDelRow(\'' + g.id + '\',' + r + ')">&#10005;</button></td></tr>';
  return t;
}

/** อ่านค่าจากหน้าจอกลับเข้าข้อมูล — เรียกก่อนทุกครั้งที่จะใช้ข้อมูลจริง */
function syncGrid(id){
  var g = GRIDS[id], tb = $(id); if (!tb) return;
  var els = tb.querySelectorAll('[data-r][data-c]');
  for (var i = 0; i < els.length; i++){
    var r = +els[i].getAttribute('data-r'), c = +els[i].getAttribute('data-c');
    if (g.rows[r]) g.rows[r][g.cols[c].k] = els[i].value;
  }
}

function bindGrid(id){
  var g = GRIDS[id], tb = $(id);
  var els = tb.querySelectorAll('[data-r][data-c]');
  for (var i = 0; i < els.length; i++){
    els[i].addEventListener('keydown', function(e){ gridKey(id, e, this); });
    els[i].addEventListener('paste',   function(e){ gridPaste(id, e, this); });
    els[i].addEventListener('change',  function(){
      var r = +this.getAttribute('data-r'), c = +this.getAttribute('data-c');
      g.rows[r][g.cols[c].k] = this.value;
      if (g.opt.onChange) g.opt.onChange(r, g.cols[c].k, this.value, g);
      if (g.opt.trFrom && g.cols[c].k === g.opt.trFrom) gridTranslate(id, r);
      gridGrowIfNeeded(id, r);
    });
  }
}

function gridCell(id, r, c){
  var tb = $(id); if (!tb) return null;
  return tb.querySelector('[data-r="' + r + '"][data-c="' + c + '"]');
}
function gridFocus(id, r, c){
  var el = gridCell(id, r, c);
  if (el){ el.focus(); if (el.select) el.select(); }
}

function gridKey(id, e, el){
  var g = GRIDS[id];
  var r = +el.getAttribute('data-r'), c = +el.getAttribute('data-c');
  var isArea = (el.tagName === 'TEXTAREA');

  if (e.key === 'Enter' && !e.shiftKey && !isArea){
    e.preventDefault();
    if (r + 1 >= g.rows.length){ gridAddRow(id, true); }
    gridFocus(id, r + 1, c);
    return;
  }
  if (e.key === 'ArrowDown' && !isArea){ e.preventDefault(); if (r + 1 < g.rows.length) gridFocus(id, r + 1, c); return; }
  if (e.key === 'ArrowUp'   && !isArea){ e.preventDefault(); if (r > 0) gridFocus(id, r - 1, c); return; }
}

/** วางทับจาก Google Sheets / Excel — หัวใจของข้อนี้ */
function gridPaste(id, e, el){
  var txt = (e.clipboardData || window.clipboardData).getData('text');
  if (!txt || (txt.indexOf('\t') < 0 && txt.indexOf('\n') < 0)) return;   // ข้อความสั้น ๆ ปล่อยให้วางปกติ
  e.preventDefault();

  var g = GRIDS[id];
  var r0 = +el.getAttribute('data-r'), c0 = +el.getAttribute('data-c');
  syncGrid(id);

  var lines = txt.replace(/\r/g, '').split('\n');
  while (lines.length && lines[lines.length - 1] === '') lines.pop();

  for (var i = 0; i < lines.length; i++){
    var r = r0 + i;
    while (g.rows.length <= r) g.rows.push(blankRow(g));
    var cells = lines[i].split('\t');
    for (var j = 0; j < cells.length; j++){
      var c = c0 + j;
      if (c >= g.cols.length) break;
      g.rows[r][g.cols[c].k] = cleanCell(cells[j], g.cols[c].type);
    }
  }
  g.rows.push(blankRow(g));            // เหลือแถวว่างรอไว้เสมอ เหมือน Sheets
  drawGrid(id);
  gridFocus(id, r0, c0);
  if (g.opt.onPaste) g.opt.onPaste(g);
}

/** ตัวเลขจาก Sheets มักติดลูกน้ำ (1,250.00) — ตัดออกให้ ไม่งั้นบันทึกแล้วกลายเป็นศูนย์ */
function cleanCell(v, type){
  v = String(v == null ? '' : v).trim();
  if (type === 'num') return v.replace(/,/g, '');
  return v;
}

function gridAddRow(id, quiet){
  var g = GRIDS[id];
  syncGrid(id);
  g.rows.push(blankRow(g));
  drawGrid(id);
  if (!quiet) gridFocus(id, g.rows.length - 1, 0);
}
function gridDelRow(id, r){
  var g = GRIDS[id];
  syncGrid(id);
  g.rows.splice(r, 1);
  if (!g.rows.length) g.rows.push(blankRow(g));
  drawGrid(id);
}
/** พิมพ์ที่แถวสุดท้าย = มีแถวใหม่รออยู่เสมอ (เหมือน Sheets) */
function gridGrowIfNeeded(id, r){
  var g = GRIDS[id];
  if (r === g.rows.length - 1){
    g.rows.push(blankRow(g));
    drawGrid(id);
  }
}

/* ─── รูปในแถว ─── */
function gridDrawPhotos(id){
  var g = GRIDS[id];
  var boxes = $(g.host).querySelectorAll('[data-gph]');
  for (var i = 0; i < boxes.length; i++){
    var rid = boxes[i].getAttribute('data-gph');
    boxes[i].innerHTML = gridPhotoStrip(g, rid);
  }
}
function gridPhotoStrip(g, rid){
  var max = g.opt.maxPhoto || 5;
  var list = PHOTOS[rid] || [];
  var h = '<div class="phwrap sm">';
  for (var k = 0; k < list.length; k++){
    h += '<div class="phcell xs"><img src="' + list[k].thumb + '" ' +
         'onclick="zoomPhoto(\'' + list[k].view + '\',\'' + list[k].thumb + '\')" ' +
         'onerror="this.parentNode.classList.add(\'bad\')">' +
         '<button class="phdel" title="เอาออก" onclick="gridDelPhoto(\'' + g.id + '\',\'' + rid + '\',\'' + list[k].id + '\')">&#10005;</button></div>';
  }
  if (list.length < max){
    h += '<div class="phadd xs" onclick="gridPickPhotos(\'' + g.id + '\',\'' + rid + '\')"><b>+</b></div>';
  }
  h += '</div>';
  if (!list.length) h += '<div class="phwarn sm">ต้องมีรูป</div>';
  else if (list.length >= max) h += '<div class="hint">ครบ ' + max + ' รูปแล้ว</div>';
  h += '<div class="phmsg" id="phmsg_' + rid + '"></div>';
  return h;
}
function gridPickPhotos(gid, rid){
  var g = GRIDS[gid], max = g.opt.maxPhoto || 5;
  var have = (PHOTOS[rid] || []).length;
  if (have >= max){ alert('แถวนี้ใส่ได้มากสุด ' + max + ' รูปครับ'); return; }
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = true;
  inp.onchange = function(){
    var files = Array.prototype.slice.call(inp.files);
    if (files.length > max - have){
      alert('แถวนี้เหลือที่อีก ' + (max - have) + ' รูป — ระบบจะเอาเฉพาะ ' + (max - have) + ' รูปแรก');
      files = files.slice(0, max - have);
    }
    uploadList(rid, files, function(){ gridDrawPhotos(gid); if (g.opt.onPhoto) g.opt.onPhoto(); });
  };
  inp.click();
}
function gridDelPhoto(gid, rid, fileId){
  if (!confirm('เอารูปนี้ออก?\n(ไฟล์ยังอยู่ใน Drive ไม่ได้ลบทิ้ง)')) return;
  srv('removePhoto', [CURDOC, fileId, AUTH], function(){
    loadPhotos(function(){ gridDrawPhotos(gid); if (GRIDS[gid].opt.onPhoto) GRIDS[gid].opt.onPhoto(); });
  });
}

/** แถวไหนยังไม่มีรูปบ้าง (นับเฉพาะแถวที่กรอกข้อมูลแล้ว) */
function gridPhotoMissing(id){
  var g = GRIDS[id];
  syncGrid(id);
  var miss = [];
  for (var r = 0; r < g.rows.length; r++){
    if (!gridRowFilled(g, r)) continue;
    var rid = g.rows[r]._rid;
    if (!PHOTOS[rid] || !PHOTOS[rid].length) miss.push(r + 1);
  }
  return miss;
}
function gridRowFilled(g, r){
  var row = g.rows[r];
  var keys = g.opt.requireKeys || [g.cols[0].k];
  for (var i = 0; i < keys.length; i++) if (String(row[keys[i]] || '').trim()) return true;
  return false;
}
/** เฉพาะแถวที่กรอกจริง เรียงตามลำดับบนจอ */
function gridFilledRows(id){
  var g = GRIDS[id];
  syncGrid(id);
  var out = [];
  for (var r = 0; r < g.rows.length; r++) if (gridRowFilled(g, r)) out.push(g.rows[r]);
  return out;
}

/* ─── แปลไทย → EN ───
   เติมให้เฉพาะช่องที่ยังว่าง — ถ้าเบียร์พิมพ์อังกฤษเองไว้แล้ว ระบบไม่ทับของเดิม */
function gridTranslate(id, onlyRow){
  var g = GRIDS[id];
  if (!g.opt.trFrom || !g.opt.trTo) return;
  syncGrid(id);
  var idx = [], texts = [];
  for (var r = 0; r < g.rows.length; r++){
    if (onlyRow != null && r !== onlyRow) continue;
    var src = String(g.rows[r][g.opt.trFrom] || '').trim();
    var dst = String(g.rows[r][g.opt.trTo]   || '').trim();
    if (src && !dst){ idx.push(r); texts.push(src); }
  }
  if (!texts.length){
    if (onlyRow == null) setTrMsg('ไม่มีช่องที่ต้องแปล — ช่องที่พิมพ์อังกฤษไว้แล้วระบบไม่ทับให้', '');
    return;
  }
  if (onlyRow == null) setTrMsg('กำลังแปล ' + texts.length + ' ช่อง…', 'wait');
  srv('translateBatch', [texts, 'th', 'en', AUTH], function(res){
    var n = 0, filled = [];
    for (var i = 0; i < idx.length; i++){
      if (res && res[i]){ g.rows[idx[i]][g.opt.trTo] = res[i]; filled.push(idx[i]); n++; }
    }
    if (n){ drawGrid(id); if (g.opt.onFill) g.opt.onFill(filled, g); }
    if (onlyRow == null){
      setTrMsg(n ? ('แปลให้แล้ว ' + n + ' ช่อง — อ่านทวนก่อนส่ง Supplier นะครับ ศัพท์ช่างบางคำแปลไม่เนียน')
                 : 'แปลไม่สำเร็จ ลองใหม่อีกครั้ง', n ? 'good' : 'bad');
    }
  }, function(m){ if (onlyRow == null) setTrMsg(m, 'bad'); });
}
function setTrMsg(msg, cls){
  var el = $('trmsg'); if (!el) return;
  el.className = 'phmsg ' + (cls || '');
  el.innerHTML = (cls === 'wait' ? '<span class="spin"></span> ' : '') + esc(msg);
}

/** แปลกลับเป็นไทยให้ตรวจ — กันคำแปลเพี้ยนหลุดไปถึง Supplier */
function gridTrCheck(id){
  var g = GRIDS[id];
  syncGrid(id);
  var pairs = [];
  for (var r = 0; r < g.rows.length; r++){
    var th = String(g.rows[r][g.opt.trFrom] || '').trim();
    var en = String(g.rows[r][g.opt.trTo]   || '').trim();
    if (en) pairs.push({ seq:r + 1, th:th, en:en });
  }
  if (!pairs.length){ alert('ยังไม่มีข้อความอังกฤษให้ตรวจครับ'); return; }
  setTrMsg('กำลังแปลกลับเป็นไทยเพื่อตรวจ…', 'wait');
  srv('translateCheck', [pairs, AUTH], function(res){
    setTrMsg('', '');
    var t = '<div class="lightbox trbox"><div class="trpanel"><div class="trhd">' +
      '<b>ตรวจคำแปล</b><span>อ่าน “แปลกลับเป็นไทย” เทียบกับต้นฉบับ — ถ้าความหมายเพี้ยน แปลว่าคำอังกฤษนั้นใช้ไม่ได้ ให้พิมพ์แก้เอง</span>' +
      '<button onclick="this.closest(\'.lightbox\').remove()">ปิด ✕</button></div>' +
      '<table class="t"><thead><tr><th style="width:34px">แถว</th><th>ต้นฉบับ (ไทย)</th>' +
      '<th>คำแปล (EN)</th><th>แปลกลับเป็นไทย</th></tr></thead><tbody>';
    for (var i = 0; i < res.length; i++){
      var x = res[i];
      var same = looksClose(x.th, x.back);
      t += '<tr><td class="c">' + x.seq + '</td><td>' + esc(x.th) + '</td>' +
        '<td>' + esc(x.en) + '</td>' +
        '<td class="' + (same ? '' : 'trbad') + '">' + esc(x.back) +
        (same ? '' : ' <span class="pill red">ตรวจดูอีกที</span>') + '</td></tr>';
    }
    t += '</tbody></table></div></div>';
    var d = document.createElement('div'); d.innerHTML = t;
    var node = d.firstChild;
    node.onclick = function(e){ if (e.target === node) node.remove(); };
    document.body.appendChild(node);
  }, function(m){ setTrMsg(m, 'bad'); });
}
/** เทียบหยาบ ๆ ว่าแปลกลับแล้วยังใกล้ของเดิมไหม — ใช้แค่ชี้จุดที่ควรอ่านซ้ำ ไม่ได้ตัดสินแทนคน */
function looksClose(a, b){
  a = String(a || '').replace(/\s+/g, ''); b = String(b || '').replace(/\s+/g, '');
  if (!a || !b) return false;
  var hit = 0, n = 0;
  for (var i = 0; i + 2 <= a.length; i += 2){ n++; if (b.indexOf(a.substr(i, 2)) >= 0) hit++; }
  return n ? (hit / n) >= 0.45 : false;
}
</script>
