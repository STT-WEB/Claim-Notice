<script>
/* ═══ ① Inspection — ใบตรวจรับสินค้า ═══
   ตรวจทีละหัวข้อ · ติ๊ก Acc / Un-Acc · ถ่ายรูปทุกข้อ
   ข้อที่ Un-Acc กดส่งไปเปิดใบเคลมได้เลย รูปตามไปด้วย                  */

var INSP = null;          // ใบตรวจที่เปิดอยู่ — หน้าปริ้นใช้ตัวนี้ (คู่กับ CLAIM ของใบเคลม)
var INSTPL = null;
var INSFOREIGN = false;
var INSTANKER = true;    // ใบนี้เป็นงานแท็งค์ไหม — แท็งค์ต้องมีช่องรูป STD เทียบ   // งานในประเทศไม่ต้องมีช่องภาษาอังกฤษให้รก

/* ─────────── เปิดใบตรวจใหม่ ─────────── */
/* ═══ เปิดใบตรวจรับสินค้า (ใบใหม่) ═══════════════════════════════════════
   เบียร์ 8 ก.ย. 2569
     · "ต้องมีลักษณะงาน >> อะไหล่ หรือ อุปกรณ์ / Tankers"
     · "ต้องมี E. No หลัง CHASSIS ผู้ผลิต"
     · "ชนิดงาน อันนี้มันรู้ได้เองจากลักษณะงานเลยใช่ไหม"  → ใช่ รวมเป็นช่องเดียว
        ("ชนิดงาน" เดิมกับ "ลักษณะงาน" คือเรื่องเดียวกัน เลยเหลือช่องเดียว ไม่ต้องกรอกซ้ำ)
     · แม่แบบเช็คลิสต์มาจากทะเบียนในระบบแล้ว (เมนู 🧾 แม่แบบเช็คลิสต์) ไม่ได้ฝังในโค้ด
   ═════════════════════════════════════════════════════════════════════ */
function newInspForm(){
  busy(true, 'กำลังเตรียมแม่แบบเช็คลิสต์…');
  srv('listTemplates', [false, AUTH], function(tpl){
    INSTPL = tpl || [];
    var t = '<div class="card tight"><div class="cardhd"><h3>เปิดใบตรวจรับสินค้า (ใบใหม่)</h3>' +
      '<span class="sub">เลขที่ INS-YY/NNNN · คนละชุดกับใบเคลม</span>' +
      '<button class="btn primary" id="insSave" onclick="submitInsp()">💾 บันทึกเป็นร่าง</button></div>';
    t += flowBarNew('ins');
    t += '<div id="imsg"></div>';
    t += '<div class="phnote">📷 ตรวจแล้วต้อง<b>ถ่ายรูปทุกข้อที่ไม่ผ่าน</b> ระบบถึงจะยอมให้ส่งไปเปิดใบเคลม</div>';
    t += '<div class="fgrid">';
    t += fr('ลักษณะงาน', '<select id="i_kind" onchange="inspKindChanged()">' +
            '<option value="tanker">Tankers</option>' +
            '<option value="equip">อะไหล่ หรือ อุปกรณ์</option></select>',
            'ขั้น 1|Tankers = แท็งค์ทั้งคัน มีช่องรูป STD เทียบ · อะไหล่/อุปกรณ์ = ไม่มีรูป STD', true);
    t += fr('สถานที่ผลิต', '<select id="i_area" onchange="inspAreaChanged()">' +
            '<option value="for">ต่างประเทศ</option><option value="dom">ในประเทศ</option></select>', 'ขั้น 1|', true);
    t += fr('เลขที่ JOB', '<input id="i_jobNo" placeholder="JT-69/0009" onblur="inspJobLookup()">', 'ขั้น 1|', true);
    t += fr('ชื่อลูกค้า', '<input id="i_jobName">', 'อัตโนมัติ|ขึ้นเองจากเลขที่ JOB');

    t += fr('MODEL', '<input id="i_model" onblur="inspModelChanged()">',
            'ขั้น 1|พิมพ์รุ่นแล้วระบบจะเลือกแม่แบบเช็คลิสต์ของรุ่นนั้นให้เอง');
    t += fr('แม่แบบเช็คลิสต์', '<select id="i_template" onchange="inspTplNote()"></select>',
            'ขั้น 1|หัวข้อที่ต้องตรวจของรุ่นนี้ + รูป STD · แก้ทะเบียนแม่แบบได้ที่เมนู 🧾 แม่แบบเช็คลิสต์');
    t += fr('SERIAL NO.', '<input id="i_serialNo">');

    t += fr('CHASSIS <i>STT</i>', '<input id="i_chassisStt">');
    t += '<div id="i_cmkwrap">' + fr('CHASSIS <i>ผู้ผลิต</i>', '<input id="i_chassisMaker">') + '</div>';
    /* เบียร์: "ต้องมี E. No หลัง CHASSIS ผู้ผลิต" · ในประเทศไม่มีทั้งคู่ (กติกาเดียวกับใบเคลม) */
    t += '<div id="i_enowrap">' + fr('E. No.', '<input id="i_eNo" placeholder="หมายเลขเครื่อง">') + '</div>';

    t += fr('PO', '<input id="i_po">');
    t += fr('Supplier', '<input id="i_supplier" list="vlist">');
    t += fr('วันรับสินค้า', '<input id="i_recv" placeholder="DD/MM/YYYY">');
    t += '</div>';
    /* ข้อความอธิบายแม่แบบวางเป็นบรรทัดเต็มใต้ฟอร์ม — ถ้ายัดไว้ในช่องจะดันคอลัมน์กว้างจนล้นการ์ด */
    t += '<div class="hint" id="i_tplauto" style="margin-top:8px"></div>';
    t += '<div class="hint" id="i_tplnote" style="margin-top:4px"></div></div>';
    $('view').innerHTML = t;
    inspKindChanged();
    if (!VENDORS) srv('listVendors', [], function(v){ VENDORS = v || []; fillVendorList(); });
    else fillVendorList();
  });
}

/* รายชื่อแม่แบบที่ให้เลือก = เฉพาะของลักษณะงานที่เลือกไว้ ไม่ต้องเลื่อนหาในของที่ไม่เกี่ยว */
/* กด "บันทึกไว้ก่อน" ในใบตรวจ — รีดทุกช่องลงชีต แล้วเช็คว่าส่งขออนุมัติได้หรือยัง */
function saveInspNow(){
  var b = $('insSaveBtn');
  if (b){ b.disabled = true; b.textContent = '💾 กำลังบันทึก…'; }
  var el = document.activeElement; if (el && el.blur) el.blur();
  if (INSGRID) syncGrid(INSGRID.id);
  setTimeout(function(){
    if (b){ b.disabled = false; b.textContent = '💾 บันทึกไว้ก่อน'; }
    var bar = $('savebar'); if (bar){ bar.className = 'savebar ok'; bar.textContent = '✓ บันทึกแล้ว'; }
    refreshInsGate(true);
  }, 900);
}

/* เช็คสด ๆ ว่าใบตรวจส่งขออนุมัติได้หรือยัง — เรียกหลังบันทึกทุกครั้ง
   เบียร์: "ยังส่งต่อไม่ได้ — ข้อ 1..12 ยังไม่ได้ติ๊กผลตรวจ ทั้ง ๆ ที่เบียร์ติ๊กหมดแล้ว" */
var INSGATET = null;
function refreshInsGate(now){
  if (!CURDOC) return;
  if (INSGATET) clearTimeout(INSGATET);
  INSGATET = setTimeout(function(){
    srv('inspGate', [CURDOC, AUTH], function(g){
      if (!g) return;
      var box = $('insmiss');
      if (box){
        if (g.ok){ box.style.display = 'none'; }
        else { box.textContent = g.msg; box.style.display = ''; }
      }
      var b2 = $('insAdvBtn');
      if (b2){ if (g.ok) b2.classList.remove('notready'); else b2.classList.add('notready'); }
    });
  }, now ? 0 : 900);
}

function inspTplFill(pick){
  var kind = $('i_kind') ? $('i_kind').value : 'tanker', opts = '', n = 0;
  for (var i = 0; i < (INSTPL || []).length; i++){
    var x = INSTPL[i];
    if (x.kind !== kind) continue;
    n++;
    opts += '<option value="' + esc(x.key) + '"' + (x.key === pick ? ' selected' : '') + '>' +
            esc(x.name) + (x.model ? ' · ' + esc(x.model) : '') +
            ' (' + x.n + ' หัวข้อ' + (x.nStd ? ' · รูป STD ' + x.nStd : '') + ')</option>';
  }
  if (!n) opts = '<option value="">— ยังไม่มีแม่แบบของลักษณะงานนี้ —</option>';
  $('i_template').innerHTML = opts;
  inspTplNote();
}

function inspKindChanged(){
  var isTanker = $('i_kind').value === 'tanker';
  /* งานอะไหล่/อุปกรณ์ ส่วนใหญ่เป็นของเข้าสโตร์ในประเทศ — เดาให้ก่อน แก้เองได้ */
  if (!isTanker && $('i_area').value === 'for' && !$('i_chassisMaker').value) { /* ไม่บังคับ */ }
  inspTplFill('');
  inspAreaChanged();
}

function inspAreaChanged(){
  /* เบียร์ 8 ก.ย. 2569: ในประเทศ = ไม่มี CHASSIS ผู้ผลิต และไม่มี E. No. (กติกาเดียวกับใบเคลม) */
  var isFor = $('i_area').value === 'for';
  ['i_cmkwrap','i_enowrap'].forEach(function(id){
    var w = $(id); if (w) w.style.display = isFor ? '' : 'none';
  });
  if (!isFor){
    if ($('i_chassisMaker')) $('i_chassisMaker').value = '';
    if ($('i_eNo')) $('i_eNo').value = '';
  }
}

/* พิมพ์ MODEL แล้วให้ระบบเลือกแม่แบบของรุ่นนั้นให้เลย — ไม่ต้องจำว่ารุ่นไหนใช้แม่แบบอะไร */
function inspModelChanged(){
  var m = $('i_model').value;
  if (!m) { $('i_tplauto').innerHTML = ''; return; }
  srv('suggestTemplate', [m, $('i_kind').value, AUTH], function(r){
    if (!r){ $('i_tplauto').innerHTML = ''; return; }
    inspTplFill(r.key);
    $('i_tplauto').innerHTML = r.exact
      ? '✅ เจอแม่แบบของรุ่นนี้ — <b>' + esc(r.name) + '</b> ' + r.n + ' หัวข้อ'
      : '💡 ยังไม่มีแม่แบบผูกกับรุ่นนี้ ใช้ <b>' + esc(r.name) + '</b> ไปก่อน (เปลี่ยนเองได้)';
  });
}

function inspTplNote(){
  if (!INSTPL) return;
  var k = $('i_template').value, n = '', nStd = 0;
  for (var i = 0; i < INSTPL.length; i++) if (INSTPL[i].key === k){ n = INSTPL[i].note; nStd = INSTPL[i].nStd; }
  $('i_tplnote').innerHTML = '💡 ' + esc(n || 'ยังไม่มีคำอธิบายแม่แบบนี้') +
    (nStd ? ' — <b>มีรูป STD ' + nStd + ' ข้อ</b> ระบบใส่ให้ตอนเปิดใบเลย' : '') +
    ' — เปิดใบแล้ว <b>เพิ่ม / ลบ / แก้หัวข้อได้ทุกข้อ</b> แม่แบบเป็นแค่ตัวตั้งต้น';
}
function inspJobLookup(){
  var j = $('i_jobNo').value.trim(); if (!j) return;
  srv('lookupJob', [j], function(r){
    if (!r || !r.found){ $('imsg').innerHTML = '<div class="msg bad">ไม่พบเลขจ๊อบ ' + esc(j) + ' — กรอกข้อมูลเองได้</div>'; return; }
    $('imsg').innerHTML = '<div class="msg good">พบจ๊อบ ' + esc(r.jobNo) + ' — เด้งข้อมูลให้อัตโนมัติ</div>';
    if (r.jobName) $('i_jobName').value = r.jobName;
    if (r.model)   $('i_model').value   = r.model;
  }, function(m){ $('imsg').innerHTML = '<div class="msg bad">' + esc(m) + '</div>'; });
}
function submitInsp(){
  var jobNo = $('i_jobNo').value.trim();
  if (!jobNo){ $('imsg').innerHTML = '<div class="msg bad">ต้องระบุเลขที่ JOB ก่อน</div>'; return; }
  var h = { area:$('i_area').value, kind:$('i_kind').value, template:$('i_template').value,
    jobNo:jobNo, jobName:$('i_jobName').value, model:$('i_model').value,
    chassisStt:$('i_chassisStt').value, chassisMaker:$('i_chassisMaker').value,
    serialNo:$('i_serialNo').value, po:$('i_po').value, supplier:$('i_supplier').value,
    eNo:$('i_eNo') ? $('i_eNo').value : '',
    recv:$('i_recv').value };
  $('insSave').disabled = true; $('insSave').textContent = 'กำลังเปิดใบ…';
  srv('createInspection', [h, AUTH], function(r){
    if (!r || !r.ok){ $('insSave').disabled = false; $('insSave').textContent = '💾 เปิดใบตรวจ'; return; }
    go('ins', r.docNo);
  }, function(m){
    $('insSave').disabled = false; $('insSave').textContent = '💾 เปิดใบตรวจ';
    $('imsg').innerHTML = '<div class="msg bad">' + esc(m) + '</div>';
  });
}

/* ─────────── ทะเบียนใบตรวจ ─────────── */
function loadInspList(){
  busy(true, 'กำลังโหลดใบตรวจรับ…');
  srv('listInspections', [{}, AUTH], function(rows){
    var t = '<div class="card"><div class="cardhd"><h3>ใบตรวจรับสินค้าทั้งหมด</h3>' +
            '<button class="btn" onclick="go(\'home\')">← หน้าแรก</button>' +
            '<button class="btn primary" onclick="go(\'newins\')">+ เปิดใบตรวจรับใหม่</button></div>';
    if (!rows || !rows.length){
      t += '<div class="empty">ยังไม่มีใบตรวจรับในระบบ<br><span>กด “+ เปิดใบตรวจรับใหม่” เพื่อเริ่มใบแรก</span></div></div>';
      $('view').innerHTML = t; return;
    }
    t += '<table class="t"><thead><tr><th style="width:116px">เลขที่</th><th style="width:88px">วันที่</th>' +
      '<th style="width:112px">เลขที่ JOB</th><th>ชื่อลูกค้า / Supplier</th>' +
      '<th style="width:172px">ผลตรวจ</th><th style="width:96px">รูป</th>' +
      '<th style="width:120px">สถานะ</th></tr></thead><tbody>';
    for (var i = 0; i < rows.length; i++){
      var r = rows[i];
      t += '<tr style="cursor:pointer" onclick="go(\'ins\',\'' + r.docNo + '\')">' +
        '<td><b>' + esc(r.docNo) + '</b></td><td class="c">' + esc(r.date) + '</td>' +
        '<td>' + esc(r.jobNo) + '</td>' +
        '<td>' + esc(r.jobName) + (r.supplier ? '<div class="hint">' + esc(r.supplier) + '</div>' : '') + '</td>' +
        '<td class="c">' + accBar(r) + '</td>' +
        '<td class="c">' + (r.nPhoto ? '<span class="pill green">📷 ' + r.nPhoto + '</span>' : '<span class="pill">—</span>') + '</td>' +
        '<td class="c">' + (r.claimNo ? '<span class="pill red">→ ' + esc(r.claimNo) + '</span>' : esc(r.status)) + '</td></tr>';
    }
    t += '</tbody></table></div>';
    $('view').innerHTML = t;
  });
}
function accBar(r){
  if (!r.n) return '<span class="pill">ไม่มีหัวข้อ</span>';
  var h = '<span class="pill green">ผ่าน ' + r.acc + '</span> ';
  if (r.un)   h += '<span class="pill red">ไม่ผ่าน ' + r.un + '</span> ';
  if (r.todo) h += '<span class="pill">ยังไม่ตรวจ ' + r.todo + '</span>';
  return h;
}

/* ─────────── เปิดใบตรวจ (หน้าตรวจจริง) ─────────── */
function openInspection(docNo){
  busy(true, 'กำลังเปิด ' + docNo + '…');
  srv('getInspFull', [docNo, AUTH], function(c){
    if (!c){ $('view').innerHTML = '<div class="msg bad">ไม่พบใบตรวจ ' + esc(docNo) + '</div>'; return; }
    var h = c.head;
    INSP = c;                       // เก็บไว้ให้หน้าปริ้นใช้ ไม่ต้องยิงเซิร์ฟเวอร์ซ้ำ
    CURDOC = docNo; CURJOB = h['เลขที่ JOB'] || '';
    PHOTOS = c.photos || {};
    INSFOREIGN = (h['สถานที่ผลิต'] === 'for');
    INSTANKER  = String(h['ชนิดงาน'] || '').indexOf('equip') < 0;

    var acc = 0, un = 0, todo = 0, unNoPhoto = [];
    for (var i = 0; i < c.items.length; i++){
      var a = c.items[i].acc;
      if (a === 'ACC') acc++;
      else if (a === 'UNACC'){
        un++;
        if (!PHOTOS[String(c.items[i].seq)] || !PHOTOS[String(c.items[i].seq)].length) unNoPhoto.push(c.items[i].seq);
      } else todo++;
    }

    if (c.vendors && c.vendors.length) VENDORS = c.vendors;

    var t = '<div class="card noprint"><div class="cardhd">' +
      '<h3>' + esc(h['เลขที่เอกสาร']) + ' — ใบตรวจรับสินค้า</h3>' +
      '<span class="sub">' + esc(h['แม่แบบเช็คลิสต์']) + '</span>' +
      /* เบียร์ 8 ก.ย. 2569: "พอกดร่างแล้ว พอใส่ข้อมูลเพิ่มมันไม่มีให้บันทึก
         มันมีแต่ปริ้น PDF กับ ส่งขออนุมัติ มันไม่ถูกต้องนะ"
         → ใส่ปุ่มบันทึกให้กดยืนยันได้ตลอด เหมือนฝั่งใบเคลม */
      '<button class="btn" id="insSaveBtn" onclick="saveInspNow()">💾 บันทึกไว้ก่อน</button>' +
      '<button class="btn ghost" onclick="openPrintIns()">🖨️ ปริ้น / PDF</button>' +
      '<span class="savebar ok" id="savebar">✓ บันทึกอัตโนมัติ</span></div>';

    INSFLOW = c.flow || null;
    t += insFlowBar(INSFLOW);

    t += '<div class="fgrid">';
    t += fr('เลขที่ JOB', ip('i2_jobNo','saveInspHeadField','jobNo',h['เลขที่ JOB'])) +
         fr('ชื่อลูกค้า', ip('i2_jobName','saveInspHeadField','jobName',h['ชื่อลูกค้า'])) +
         fr('วันที่', '<input value="' + esc(h['วันที่']) + '" disabled>');
    t += fr('MODEL', ip('i2_model','saveInspHeadField','model',h['MODEL'])) +
         fr('SERIAL NO.', ip('i2_serialNo','saveInspHeadField','serialNo',h['SERIAL NO.'])) +
         fr('ผู้ตรวจ', ip('i2_inspector','saveInspHeadField','inspector',h['ผู้ตรวจ']));
    t += fr('CHASSIS <i>STT</i>', ip('i2_chassisStt','saveInspHeadField','chassisStt',h['CHASSIS NO. (STT)']));
    /* ในประเทศไม่มี CHASSIS ผู้ผลิต / E. No. (เบียร์ 8 ก.ย. 2569 — กติกาเดียวกับใบเคลม) */
    if (INSFOREIGN){
      t += fr('CHASSIS <i>ผู้ผลิต</i>', ip('i2_chassisMaker','saveInspHeadField','chassisMaker',h['CHASSIS NO. (ผู้ผลิต)'])) +
           fr('E. No.', ip('i2_eNo','saveInspHeadField','eNo',h['E. No.'],'หมายเลขเครื่อง'));
    }
    t += fr('ลักษณะงาน', '<input value="' + esc(INSTANKER ? 'Tankers' : 'อะไหล่ หรือ อุปกรณ์') + '" disabled>',
            'อัตโนมัติ|ตั้งตอนเปิดใบ · Tankers = มีช่องรูป STD เทียบ') +
         fr('วันรับสินค้า', ip('i2_recv','saveInspHeadField','recv',h['วันรับสินค้า'],'DD/MM/YYYY'));
    t += fr('PO', ip('i2_po','saveInspHeadField','po',h['PO'])) +
         fr('Supplier', ip('i2_supplier','saveInspHeadField','supplier',h['Supplier'],'','vlist')) +
         fr('หมายเหตุ', ip('i2_note','saveInspHeadField','note',h['หมายเหตุ']));
    t += '</div>';

    t += '<div class="phbar ' + (un && !unNoPhoto.length ? 'good' : (unNoPhoto.length ? 'bad' : '')) + '" id="insbar">' +
         insBarText(c.items.length, acc, un, todo, unNoPhoto) + '</div>';

    t += '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="btn" onclick="go(\'inslist\')">← ใบตรวจทั้งหมด</button>' +
      '<button class="btn ghost" onclick="addInspRow()">+ เพิ่มหัวข้อตรวจ</button>' +
      (INSFOREIGN ? '<button class="btn ghost" onclick="inspTranslate()">🌐 แปลไทย → EN</button>' : '') +
      '<button class="btn ghost" onclick="openMediaFolder()">📁 โฟลเดอร์รูปใน Drive</button>';
    if (h['ใบเคลมที่ออกจากใบนี้']){
      t += '<button class="btn dark" onclick="go(\'claim\',\'' + esc(h['ใบเคลมที่ออกจากใบนี้']) + '\')">' +
           '📋 เปิดใบเคลม ' + esc(h['ใบเคลมที่ออกจากใบนี้']) + '</button>';
    } else {
      t += '<button class="btn primary" id="sendBtn" onclick="sendToClaim()">➜ ส่งข้อที่ไม่ผ่านไปเปิดใบเคลม</button>';
    }
    t += '</div><div id="insmsg"></div></div>';

    /* ⚠️ v1.2.4 — หัวข้อตรวจเป็น "ตาราง Excel" ชุดเดียวกับใบเคลม
       เบียร์ (4 ก.ย.): "ตารางต้องเหมือน Excel ไม่เอาเป็นกล่อง ๆ มันดูยาก และก็เสียพื้นที่"
       ผมแก้ให้ฝั่งใบเคลมไปแล้ว แต่ลืมฝั่งใบตรวจ → เบียร์: "ทำไมไม่เห็นเหมือนงานเคลมเลย"
       ตอนนี้ใช้ makeGrid ตัวเดียวกัน = ก๊อปจาก Sheets มาวางได้ · Enter ลงล่าง · Tab ไปขวา */
    t += '<div class="card tight"><div class="cardhd"><h3>หัวข้อตรวจ (' + c.items.length + ' ข้อ)</h3>' +
         '<span class="sub">แก้ในตารางได้เลย บันทึกเอง · ก๊อปจาก Sheets มาวางได้</span>' +
         '<span class="phbar" id="insphbar">—</span></div>';
    t += '<div id="insGrid"></div>';
    if (!c.items.length){
      t += '<div class="empty">ใบนี้ยังไม่มีหัวข้อตรวจ<br><span>กด “+ เพิ่มหัวข้อตรวจ” ด้านบน</span></div>';
    }
    t += '</div>';

    $('view').innerHTML = t;
    fillVendorList();
    bindAll($('view'), docNo);
    drawInspGrid(c, docNo);
  });
}

function insBarText(n, acc, un, todo, noPhoto){
  if (!n) return 'ใบนี้ยังไม่มีหัวข้อตรวจ';
  var s = '📋 ตรวจแล้ว ' + (acc + un) + ' / ' + n + ' ข้อ · <b>ผ่าน ' + acc + '</b> · <b>ไม่ผ่าน ' + un + '</b>';
  if (todo) s += ' · ยังไม่ตรวจ ' + todo + ' ข้อ';
  if (noPhoto.length) s += ' — <b>ข้อที่ไม่ผ่านยังไม่มีรูป: ข้อ ' + noPhoto.join(', ') + ' · ส่งเคลมไม่ได้</b>';
  else if (un) s += ' — 📷 รูปครบ พร้อมส่งเคลม';
  return s;
}

/* ═══ ตารางหัวข้อตรวจ — ชุดเดียวกับตารางรายการของใบเคลม ═══════════
 * คอลัมน์: หมวด · หัวข้อตรวจ (ไทย) · หัวข้อ (EN) · ผลตรวจ · คำอธิบาย · จำนวน · หน่วย
 * งานแท็งค์เพิ่มคอลัมน์ "รูป STD" ไว้ซ้ายมือของ "ของที่ได้รับจริง" เทียบกันได้ในแถวเดียว
 * ทุกช่องบันทึกทันทีที่พิมพ์เสร็จ ไม่มีปุ่ม Save (เหมือน Google Sheets ตามที่เบียร์สั่ง) */
var INSGRID = null;

function inspCols(){
  var c = [
    { k:'cat',   label:'หมวด', w:120, ph:'เช่น ตัวถัง / วาล์ว' },
    { k:'title', label:'หัวข้อตรวจ (ไทย)', type:'area' }
  ];
  if (INSFOREIGN) c.push({ k:'titleEn', label:'Check point (EN)', sub:'แปลให้อัตโนมัติ', type:'area' });
  c.push({ k:'acc',   label:'ผลตรวจ', sub:'Acc / Un-Acc', w:104 });
  c.push({ k:'found', label:'สิ่งที่พบ / ตรวจแล้วเป็นยังไง', sub:'ผ่านก็เขียนได้', type:'area' });
  if (INSFOREIGN) c.push({ k:'foundEn', label:'Findings (EN)', type:'area' });
  c.push({ k:'qty',  label:'จำนวน', w:62, type:'num' });
  c.push({ k:'unit', label:'หน่วย', w:60 });
  return c;
}

function drawInspGrid(c, docNo){
  var rows = [];
  for (var i = 0; i < c.items.length; i++){
    var it = c.items[i];
    rows.push({ _rid:String(it.seq), _seq:String(it.seq),
      cat:it.cat, title:it.title, titleEn:it.titleEn, acc:it.acc,
      found:it.found, foundEn:it.foundEn, qty:it.qty, unit:it.unit });
  }
  var opt = {
    photos:true, maxPhoto:5,
    photoLabel:'📷 ของที่ได้รับจริง',
    photoSub: INSTANKER ? 'ถ่ายตอนตรวจ · ข้อที่ไม่ผ่านต้องมี' : 'ถ่ายตอนของมาถึง · ข้อที่ไม่ผ่านต้องมี',
    trFrom: INSFOREIGN ? 'th' : '', trTo: INSFOREIGN ? 'en' : '',
    onDraw: function(g){ paintAccCells(g); },
    /* ระบบเติมคำแปลให้ ต้องบันทึกลงชีตด้วย ไม่งั้นรีเฟรชแล้วหาย */
    onFill: function(rowsFilled, g, key){
      key = key || 'titleEn';
      for (var i = 0; i < rowsFilled.length; i++){
        var rr = rowsFilled[i], sq = g.rows[rr]._seq;
        if (!sq) continue;
        google.script.run.saveInspItemField(CURDOC, sq, key, g.rows[rr][key], AUTH);
      }
    },
    onChange: function(r, k, v, g){
      var seq = g.rows[r]._seq; if (!seq) return;
      if (k === 'acc') v = String(v || '').toUpperCase();
      var el = gridCell(g.id, r, colIdxIns(g, k));
      fieldMark(el, 'wait');
      google.script.run
        .withSuccessHandler(function(){ fieldMark(el, 'ok');
          if (k === 'acc'){ g.rows[r].acc = v; paintAccCells(g); updateInsPhBar(); }
          refreshInsGate(); })
        .withFailureHandler(function(e){ fieldMark(el, 'bad', (e && e.message) || 'บันทึกไม่สำเร็จ'); })
        .saveInspItemField(CURDOC, seq, k, v, AUTH);
    },
    /* บังคับรูปเฉพาะข้อที่ติ๊ก "ไม่ผ่าน" — ข้อที่ผ่านถ่ายไว้ก็ดี แต่ไม่บังคับ */
    photoNeed: function(rid, g){
      for (var r = 0; r < g.rows.length; r++)
        if (String(g.rows[r]._rid) === String(rid))
          return String(g.rows[r].acc || '').toUpperCase() === 'UNACC';
      return false;
    },
    onDel: function(seq){ delInspRow(seq); },     // ลบหัวข้อตรวจ = ลบในชีตจริง
    onPhoto: updateInsPhBar
  };
  /* งานแท็งค์: คอลัมน์รูป STD ประจำรุ่น อยู่ก่อนคอลัมน์รูปของจริง เทียบได้ในแถวเดียว
     งานอุปกรณ์ไม่มี STD — เบียร์: "กรณีที่เป็นอุปกรณ์ ไม่มีรูป STD" */
  if (INSTANKER) opt.photos2 = { key:'S', label:'📐 รูป STD ประจำรุ่น', sub:'ไม่มีก็เว้นไว้ได้' };

  INSGRID = makeGrid('insGrid', inspCols(), rows, opt);
  drawAllPhotos();
  updateInsPhBar();
}

function colIdxIns(g, k){
  for (var i = 0; i < g.cols.length; i++) if (g.cols[i].k === k) return i;
  return 0;
}

/** ช่องผลตรวจ = ปุ่ม 2 ปุ่มในช่องตาราง (พิมพ์ ACC/UNACC เองก็ได้)
 *  ทาสีทั้งแถวให้เห็นแต่ไกลว่าข้อไหนไม่ผ่าน */
function paintAccCells(g){
  var tb = $(g.id); if (!tb) return;
  var ci = colIdxIns(g, 'acc');
  for (var r = 0; r < g.rows.length; r++){
    var el = gridCell(g.id, r, ci); if (!el) continue;
    var v = String(g.rows[r].acc || '').toUpperCase();
    el.value = v;
    el.readOnly = true;
    el.className = 'acccell ' + (v === 'ACC' ? 'ok' : v === 'UNACC' ? 'no' : '');
    var td = el.parentNode;
    if (!td.querySelector('.accbtns')){
      var d = document.createElement('div');
      d.className = 'accbtns';
      d.innerHTML = '<button class="ab ok" title="ผ่าน" onclick="setAccCell(' + r + ',\'ACC\')">✓</button>' +
                    '<button class="ab no" title="ไม่ผ่าน" onclick="setAccCell(' + r + ',\'UNACC\')">✕</button>' +
                    '<button class="ab" title="ล้าง" onclick="setAccCell(' + r + ',\'\')">–</button>';
      td.appendChild(d);
    }
    var tr = td.parentNode;
    tr.className = (v === 'UNACC' ? 'unrow' : v === 'ACC' ? 'okrow' : '');
  }
}

function setAccCell(r, v){
  var g = INSGRID; if (!g) return;
  g.rows[r].acc = v;
  var el = gridCell(g.id, r, colIdxIns(g, 'acc'));
  if (el) el.value = v;
  paintAccCells(g);
  g.opt.onChange(r, 'acc', v, g);
}

function updateInsPhBar(){
  var bar = $('insphbar'), g = INSGRID; if (!bar || !g) return;
  var n = g.rows.length, acc = 0, un = 0, todo = 0, noPhoto = [];
  for (var r = 0; r < n; r++){
    var v = String(g.rows[r].acc || '').toUpperCase(), sq = g.rows[r]._seq;
    if (v === 'ACC') acc++;
    else if (v === 'UNACC'){
      un++;
      if (!PHOTOS[sq] || !PHOTOS[sq].length) noPhoto.push(sq);
    } else todo++;
  }
  bar.className = 'phbar ' + (noPhoto.length ? 'bad' : (un || acc ? 'good' : ''));
  var msg = '📋 ตรวจแล้ว ' + (acc + un) + ' / ' + n + ' ข้อ · ผ่าน ' + acc + ' · ไม่ผ่าน ' + un;
  if (todo) msg += ' · ยังไม่ตรวจ ' + todo;
  if (noPhoto.length) msg += ' — <b>ข้อที่ไม่ผ่านยังไม่มีรูป: ข้อ ' + noPhoto.join(', ') + '</b>';
  else if (un) msg += ' — 📷 รูปครบ พร้อมส่งเคลม';
  bar.innerHTML = msg;
}

/* setAcc / updateInsBar / insBarText ของการ์ดแบบเก่า ถูกลบทิ้งตอน v1.2.4
   ตารางแบบ Excel ใช้ setAccCell + updateInsPhBar แทนแล้ว
   ⚠️ อย่าเอากลับมา — โค้ดสองชุดที่ทำเรื่องเดียวกัน คือต้นเหตุที่แก้ที่หนึ่งแล้วอีกที่ไม่เปลี่ยน */

function addInspRow(){
  srv('addInspItem', [CURDOC, AUTH], function(){ go('ins', CURDOC); });
}
function delInspRow(seq){
  if (!confirm('ลบหัวข้อที่ ' + seq + ' ออกจากใบตรวจ?')) return;
  srv('delInspItem', [CURDOC, seq, AUTH], function(){ go('ins', CURDOC); },
      function(m){ $('insmsg').innerHTML = '<div class="msg bad">' + esc(m) + '</div>'; });
}

/** ส่งข้อที่ Un-Acc ไปเปิดใบเคลม — รูปตามไปด้วย ไม่ต้องถ่ายซ้ำ */
function sendToClaim(){
  var b = $('sendBtn');
  srv('inspCheck', [CURDOC, AUTH], function(chk){
    if (!chk.ok){ $('insmsg').innerHTML = '<div class="msg bad">' + esc(chk.msg) + '</div>'; return; }
    if (!confirm('เปิดใบเคลมจากข้อที่ไม่ผ่าน ' + chk.un + ' ข้อ?\nรูปของแต่ละข้อจะถูกส่งไปด้วย')) return;
    b.disabled = true; b.textContent = 'กำลังเปิดใบเคลม…';
    srv('sendUnAccToClaim', [CURDOC, AUTH], function(r){
      alert('เปิดใบเคลม ' + r.claimNo + ' แล้ว (' + r.n + ' รายการ)');
      go('claim', r.claimNo);
    }, function(m){
      b.disabled = false; b.textContent = '➜ ส่งข้อที่ไม่ผ่านไปเปิดใบเคลม';
      $('insmsg').innerHTML = '<div class="msg bad">' + esc(m) + '</div>';
    });
  });
}

/** แปล "สิ่งที่พบ" ของทุกข้อที่ Un-Acc — เติมเฉพาะช่องที่ยังว่าง แล้วบันทึกลงชีตให้เลย */
/** ปุ่ม "แปลไทย → EN" — ใช้ตัวแปลของตาราง (ตัวเดียวกับใบเคลม)
 *  เติมเฉพาะช่องที่ยังว่าง แล้วบันทึกลงชีตให้เลย */
function inspTranslate(){
  if (!INSGRID){ return; }
  gridTranslate(INSGRID.id);
}

function insFlowBar(f){
  if (!f) return '';
  var t = flowBar(f);
  /* flowBar วาดปุ่มของใบเคลม — ใบตรวจต้องเรียกคนละฟังก์ชัน และใช้ id คนละชุด
     (ไม่งั้น refreshGate ของใบเคลมจะมาแตะปุ่มของใบตรวจ) */
  t = t.replace(/onclick="advClick\(\)"/g, 'onclick="advClickIns()"')
       .replace(/onclick="doAdvance\(\)"/g, 'onclick="doAdvanceInsp()"')
       .replace(/onclick="openReject\(\)"/g, 'onclick="openRejectInsp()"')
       .replace(/id="advBtn"/g, 'id="insAdvBtn"')
       .replace(/id="flowmiss"/g, 'id="insmiss"');
  return t;
}

function advClickIns(){
  var b = $('insAdvBtn');
  if (b && b.classList.contains('notready')){
    var box = $('insmiss');
    if (box && box.textContent) alert(box.textContent);
    else alert('ยังกรอกไม่ครบ — ดูบรรทัดสีแดงเหนือปุ่ม');
    return;
  }
  doAdvanceInsp();
}
</script>
