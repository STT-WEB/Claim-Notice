/* ═══════════ หน้าปริ้นเอกสารจริง (v0.6.0) ═══════════
   ยกแบบฟอร์มจาก "Mockup-ใบเคลม-ร่าง5.html" ที่เบียร์เคาะไว้แล้วมาใช้ ไม่ประดิษฐ์ใหม่

   ฉบับที่ปริ้นได้ 3 แบบ
     ภายใน   — ข้อมูลครบทุกอย่าง **มีชื่อลูกค้า** · มีต้นทุน กำไร เรท · มีรูป
     แจ้งเคลม (ส่ง Supplier) — **ไม่มีชื่อลูกค้า ใช้เลขจ๊อบอย่างเดียว** · ไม่มีราคาใด ๆ
     เรียกเก็บ (ส่ง Supplier) — **ไม่มีชื่อลูกค้า** · มีราคาเรียกเก็บ แต่ **ไม่โชว์ต้นทุนและเรท**

   เบียร์ 4 ก.ย. 2569: "ตอนที่ปริ้นภายในเห็นรายชื่อลูกค้าได้ แต่ว่าถ้าปริ้นให้ซัพ
                        ใช้แค่เลขจ๊อบพอ ไม่ต้องมีชื่อลูกค้า"
   → เหตุผลทางธุรกิจ: ไม่ควรบอก Supplier ว่าเราขายให้ใคร
     กฎนี้เขียนไว้ที่เดียวคือ pv() ด้านล่าง ทุกฉบับที่ส่งออกใช้ตัวกรองตัวเดียวกัน

   1 ใบเคลมมีได้หลาย Supplier → **แยกใบให้อัตโนมัติ** แต่ละเจ้าเห็นเฉพาะรายการของตัวเอง  */

var PR = { kind:'int', sup:'', cols:{} };

/* A4 ที่ 96dpi = 794 × 1122 px เป๊ะ ๆ
   เนื้อที่ใส่ของได้ = 1122 − 16(ขอบบน) − 34(ขอบล่าง) − 30(ท้ายกระดาษ) = 1042 */
var PAGE_H = 1042;

function openPrint(){
  if (!CLAIM){ alert('เปิดใบเคลมก่อนครับ'); return; }
  PR.sup = '';
  drawPrint();
}

function drawPrint(){
  var c = CLAIM, h = c.head;
  var sups = supplierList();

  var t = '<div class="card noprint"><div class="cardhd"><h3>ปริ้นเอกสาร ' + esc(h['เลขที่เอกสาร']) + '</h3>' +
    '<button class="btn" onclick="go(\'claim\',CURDOC)">← กลับใบเคลม</button>' +
    '<button class="btn dark" onclick="doPrint()">🖨️ ปริ้น / บันทึกเป็น PDF</button></div>';

  t += '<div class="prbar">';
  t += '<div class="prgrp"><span>ฉบับ</span>' +
    prBtn('int',   '📋 ภายใน', 'ข้อมูลครบ มีชื่อลูกค้า ต้นทุน กำไร') +
    prBtn('notice','📤 แจ้งเคลม (ส่ง Supplier)', 'ไม่มีราคา ไม่มีชื่อลูกค้า') +
    prBtn('debit', '🧾 เรียกเก็บ (ส่ง Supplier)', 'มีราคาเรียกเก็บ ไม่มีต้นทุน/เรท') +
    '</div>';

  if (sups.length > 1){
    t += '<div class="prgrp"><span>Supplier</span><select id="prSup" onchange="PR.sup=this.value;drawPrint()">';
    t += '<option value="">— แยกใบให้ทุกเจ้า (' + sups.length + ' ใบ) —</option>';
    for (var i = 0; i < sups.length; i++){
      t += '<option value="' + esc(sups[i]) + '"' + (PR.sup === sups[i] ? ' selected' : '') + '>' + esc(sups[i]) + '</option>';
    }
    t += '</select></div>';
  }
  t += '</div>';

  if (PR.kind === 'int'){
    t += '<div class="prnote">📋 <b>ฉบับภายใน</b> — เก็บไว้ในบริษัท มีชื่อลูกค้า ต้นทุน กำไร และเรทครบ <b>ห้ามส่งออกนอกบริษัท</b></div>';
  } else {
    t += '<div class="prnote ext">📤 <b>ฉบับส่ง Supplier</b> — ตัดชื่อลูกค้า ผู้ขอเคลม แผนก และ JMC ออกแล้ว ' +
         'เหลือแต่เลขจ๊อบไว้อ้างอิง' + (PR.kind === 'debit' ? ' · โชว์เฉพาะราคาเรียกเก็บ ไม่โชว์ต้นทุนกับเรท' : ' · ไม่มีราคาใด ๆ') + '</div>';
  }
  t += '</div>';

  t += '<div id="prPages" class="wrapprint"></div>';
  $('view').innerHTML = t;
  buildPages(sups);
}
/** ปริ้นฉบับที่ส่งออกไปข้างนอก = บันทึกว่าใบนี้ออกไปแล้ว → เพิ่มรายการไม่ได้อีก
 *  เบียร์: "ปริ้นเอกสารแล้ว จะไม่สามารถเพิ่มรายการสินค้าได้ ต้องเปิดใบใหม่เท่านั้น" */
function doPrint(){
  if (PR.kind === 'int'){ window.print(); return; }        // ฉบับภายใน ปริ้นดูได้ไม่จำกัด
  var already = FLOW && FLOW.printedAt;
  if (!already && !confirm('ปริ้นฉบับที่ส่งให้ Supplier แล้ว จะ "เพิ่มรายการสินค้าไม่ได้อีก"\n' +
      'ถ้ามีของเพิ่มทีหลัง ต้องเปิดใบเคลมใบใหม่\n\nยืนยันปริ้นเลยไหม?')) return;
  srv('markPrinted', [CURDOC, PR.kind, AUTH], function(){
    if (FLOW) FLOW.printedAt = FLOW.printedAt || 'เพิ่งปริ้น';
    window.print();
  }, function(m){ alert(m); });
}

function prBtn(k, label, sub){
  return '<button class="prb' + (PR.kind === k ? ' on' : '') + '" title="' + esc(sub) + '" ' +
         'onclick="PR.kind=\'' + k + '\';drawPrint()">' + label + '</button>';
}

function supplierList(){
  var out = [];
  for (var i = 0; i < CLAIM.items.length; i++){
    var s = norm2(CLAIM.items[i].supplier) || '(ไม่ระบุ Supplier)';
    if (out.indexOf(s) < 0) out.push(s);
  }
  return out;
}
function norm2(v){ return String(v == null ? '' : v).trim(); }

/* ─────────── ตัวกรองข้อมูลตามฉบับ ───────────
   pv = print value — กฎ "อะไรส่งออกได้บ้าง" อยู่ที่นี่ที่เดียว
   ถ้าวันหลังต้องซ่อนเพิ่ม แก้ตรงนี้จุดเดียว ทุกฉบับเปลี่ยนตาม ไม่มีหลุด */
function isInternal(){ return PR.kind === 'int'; }
function showMoney(){ return PR.kind !== 'notice'; }
function showCost(){  return PR.kind === 'int'; }      // ต้นทุน/กำไร/เรท = ภายในเท่านั้น

function docTitle(){
  if (PR.kind === 'int')    return ['ใบสรุปงานเคลม (ภายใน)', 'INTERNAL CLAIM SUMMARY'];
  if (PR.kind === 'notice') return ['ใบแจ้งเคลมสินค้า', 'CLAIM NOTICE'];
  return ['ใบเรียกเก็บค่าเคลม', 'CLAIM DEBIT NOTE'];
}

/* ─────────── ประกอบเอกสาร ─────────── */
function buildPages(sups){
  var targets = PR.sup ? [PR.sup] : (isInternal() ? [null] : sups);
  var html = '';
  for (var i = 0; i < targets.length; i++) html += buildOneDoc(targets[i]);
  $('prPages').innerHTML = html;
  paginate();
}

function buildOneDoc(sup){
  var c = CLAIM, h = c.head;
  var items = [];
  for (var i = 0; i < c.items.length; i++){
    var s = norm2(c.items[i].supplier) || '(ไม่ระบุ Supplier)';
    if (sup == null || s === sup) items.push(c.items[i]);
  }
  if (!items.length) return '';

  var blocks = [];
  blocks.push(blkJob(h, sup));
  blocks.push(blkItems(items, h));
  if (showMoney()) blocks.push(blkTotals(items, h, sup));
  if (isInternal() && h['หมายเหตุจาก Supplier']) blocks.push(blkReply(h));
  if (!isInternal()) blocks.push(blkReplyBox());
  blocks.push(blkSign(h));
  /* รูปอยู่ในทุกฉบับ — Supplier ต้องเห็นหลักฐานถึงจะยอมรับเคลม */
  blocks = blocks.concat(blkPhotos(items));

  return '<div class="docset" data-sup="' + esc(sup || '') + '">' + blocks.join('') + '</div>';
}

function blkJob(h, sup){
  var t = '<div class="blk"><div class="sec"><div class="sech">ข้อมูลงาน<span>JOB INFORMATION</span></div>' +
          '<div class="box"><table class="f">';

  if (isInternal()){
    t += row2('เลขที่ JOB', '<b>' + esc(h['เลขที่ JOB']) + '</b>', 'ชื่อลูกค้า', esc(h['ชื่อลูกค้า']));
  } else {
    t += row2('เลขที่ JOB (อ้างอิง)', '<b>' + esc(h['เลขที่ JOB']) + '</b>', 'ถึง (To)', '<b>' + esc(sup || '') + '</b>');
  }
  t += row2('MODEL', esc(h['MODEL']), 'CHASSIS NO.', esc(h['CHASSIS NO. (ผู้ผลิต)'] || h['CHASSIS NO. (STT)']));
  t += row2('SERIAL NO.', esc(h['SERIAL NO.']), 'เลขใบส่งมอบ', esc(h['เลขใบส่งมอบ']));
  if (isInternal()){
    t += row2('ผู้ขอเคลม', esc(h['ผู้ขอเคลม']) + ' (' + esc(h['แผนก']) + ')',
              'JMC ที่ผูก', h['JMC ที่ผูก'] ? esc(h['JMC ที่ผูก']) : '<span style="color:#aa8800">— ยังไม่เปิด JMC —</span>');
    t += row2('วันที่ยื่นขอเคลม', esc(h['วันที่']), 'วันที่ต้องการของ', esc(h['วันที่ต้องการของ']));
    t += row2('สถานที่ผลิต', h['สถานที่ผลิต'] === 'for' ? 'ต่างประเทศ' : 'ในประเทศ',
              'ประเภทการเคลม', h['ประเภทการเคลม'] === 'pre' ? 'ก่อนส่งมอบ' : 'หลังส่งมอบ');
  } else {
    t += row2('วันที่แจ้งเคลม', esc(h['วันที่']), 'วันที่ต้องการของ', esc(h['วันที่ต้องการของ']));
  }
  return t + '</table></div></div></div>';
}
function row2(l1, v1, l2, v2){
  return '<tr><td class="lb">' + l1 + ' :</td><td class="in">' + v1 + '</td>' +
         '<td class="lb" style="padding-left:12px">' + l2 + ' :</td><td class="in">' + v2 + '</td></tr>';
}

function blkItems(items, h){
  /* ⚠️ ห้ามตั้งชื่อตัวแปรว่า money — มันจะบังฟังก์ชัน money() ที่ใช้ใส่ลูกน้ำให้ตัวเลข
        แล้วบรรทัด money(it.cost) จะกลายเป็นเรียก true(...) = พังทั้งหน้า */
  var hasMoney = showMoney(), hasCost = showCost();
  var fx = hasMoney && h['สกุลเงิน'] && num2(h['อัตราแลกเปลี่ยน']) > 0;
  var bi = !isInternal() || h['สถานที่ผลิต'] === 'for';     // ฉบับส่งออก = 2 ภาษาเสมอ

  var t = '<div class="blk"><div class="sec"><div class="sech">รายการที่เคลม<span>CLAIM ITEMS</span></div></div>' +
          '<table class="g"><thead><tr>' +
    '<th style="width:26px">ที่<span class="en">No.</span></th>' +
    '<th style="width:88px">รหัสสินค้า<span class="en">Code</span></th>' +
    '<th>รายการ / รายละเอียด<span class="en">Item / Description</span></th>' +
    '<th style="width:38px">จำนวน<span class="en">Qty</span></th>' +
    '<th style="width:38px">หน่วย<span class="en">Unit</span></th>' +
    '<th style="width:96px">PO<span class="en">PO No.</span></th>' +
    '<th style="width:70px">วันรับ<span class="en">Recv.</span></th>';
  if (hasCost)  t += '<th style="width:62px">ต้นทุน<span class="en">Cost</span></th><th style="width:38px">กำไร<span class="en">Margin</span></th>';
  if (hasMoney) t += '<th style="width:70px">ราคา/หน่วย<span class="en">Unit price</span></th>' +
                  '<th style="width:76px">รวม (บาท)<span class="en">Total THB</span></th>';
  if (fx)    t += '<th style="width:70px">รวม (' + esc(h['สกุลเงิน']) + ')</th>';
  t += '</tr></thead><tbody>';

  for (var i = 0; i < items.length; i++){
    var it = items[i];
    var qty = num2(it.qty), price = num2(it.price), tot = Math.round(qty * price * 100) / 100;
    var span = 7 + (hasCost ? 2 : 0) + (hasMoney ? 2 : 0) + (fx ? 1 : 0);
    t += '<tr>' +
      '<td class="c">' + esc(it.seq) + '</td>' +
      '<td>' + esc(it.code) + '</td>' +
      '<td><b>' + esc(it.name) + '</b></td>' +
      '<td class="r">' + esc(it.qty) + '</td>' +
      '<td class="c">' + esc(it.unit) + '</td>' +
      '<td>' + esc(it.po) + '</td>' +
      '<td class="c">' + esc(it.recv) + '</td>';
    if (hasCost)  t += '<td class="r">' + (it.cost ? money(it.cost) : '—') + '</td><td class="c">' + esc(it.margin) + '</td>';
    if (hasMoney) t += '<td class="r">' + (price ? money(price) : '—') + '</td><td class="r"><b>' + (tot ? money(tot) : '—') + '</b></td>';
    if (fx)    t += '<td class="r">' + (tot ? money(tot / num2(h['อัตราแลกเปลี่ยน'])) : '—') + '</td>';
    t += '</tr>';
    /* รายละเอียดยาว ๆ วางเต็มความกว้างใต้แถวข้อมูล — ถ้ายัดในช่องแคบ ๆ ตัวหนังสือจะล้นออกนอกหน้า */
    t += '<tr class="dsc"><td></td><td colspan="' + (span - 1) + '"><div class="dth">' + esc(it.th) + '</div>' +
         (bi && it.en ? '<span class="den">' + esc(it.en) + '</span>' : '') + '</td></tr>';
  }
  return t + '</tbody></table></div>';
}

function blkTotals(items, h, sup){
  var thb = 0;
  for (var i = 0; i < items.length; i++) thb += num2(items[i].qty) * num2(items[i].price);
  var lab = 0, L = CLAIM.labour || [];
  for (var k = 0; k < L.length; k++){
    var ls = norm2(L[k].supplier) || '(ไม่ระบุ Supplier)';
    if (sup == null || ls === sup) lab += num2(L[k].amount);
  }
  var grand = Math.round((thb + lab) * 100) / 100;
  var rate = num2(h['อัตราแลกเปลี่ยน']);

  var t = '<div class="blk">';
  if (lab){
    t += '<div class="sec"><div class="sech">ค่าแรง<span>LABOUR</span></div></div><table class="g"><tbody>';
    for (var m = 0; m < L.length; m++){
      var ms = norm2(L[m].supplier) || '(ไม่ระบุ Supplier)';
      if (sup != null && ms !== sup) continue;
      t += '<tr><td style="width:26px" class="c">' + esc(L[m].seq) + '</td><td>' + esc(L[m].th) +
           (L[m].en ? '<span class="den">' + esc(L[m].en) + '</span>' : '') +
           '<div class="phcap">ครอบคลุมรายการที่ ' + esc(L[m].covers) + '</div></td>' +
           '<td class="r" style="width:100px"><b>' + money(L[m].amount) + '</b></td></tr>';
    }
    t += '</tbody></table>';
  }
  t += '<div class="sum"><table>' +
    '<tr><td>ค่าของ / Parts</td><td class="r">' + money(thb) + '</td></tr>' +
    (lab ? '<tr><td>ค่าแรง / Labour</td><td class="r">' + money(lab) + '</td></tr>' : '') +
    '<tr class="tot"><td>รวมทั้งสิ้น (บาท) / Total THB</td><td class="r">' + money(grand) + '</td></tr>';
  if (rate > 0 && h['สกุลเงิน']){
    t += '<tr class="fx"><td>รวม (' + esc(h['สกุลเงิน']) + ')</td><td class="r">' + money(grand / rate) + '</td></tr>';
  }
  t += '</table></div>';
  /* เรทเป็นข้อมูลภายใน — Supplier ไม่ควรเห็นว่าเราคิดเรทเท่าไหร่ */
  if (showCost() && rate > 0){
    t += '<div class="rateline">อัตราแลกเปลี่ยนที่ใช้ : <b>' + esc(h['อัตราแลกเปลี่ยน']) + '</b> บาท ต่อ 1 ' +
         esc(h['สกุลเงิน']) + ' · ล็อกไว้ ณ วันที่ ' + esc(h['เรท ณ วันที่']) + ' (ข้อมูลภายใน ไม่ปรากฏในฉบับส่ง Supplier)</div>';
  }
  t += '<div class="phcap" style="margin-top:4px">ไม่มีภาษีมูลค่าเพิ่ม / VAT not applicable</div>';
  return t + '</div>';
}

function blkSign(h){
  var f = CLAIM.flow;
  /* เบียร์: "ลายเซ็นตั้งแต่ผู้เปิดใบ ผู้อนุมัติ ก็จะขึ้นมาเลย พอถึงสโตร์กด ก็จะมีลายเซ็นสโตร์คนนั้น"
     → ใครกดรับ/อนุมัติ/ส่งต่อไปแล้ว ชื่อ-แผนก-วันเวลาขึ้นบนเอกสารเอง
       คนที่ยังไม่ถึงคิว เว้นเส้นให้เซ็นมือไว้เหมือนเดิม */
  var signs = (f && f.signs) ? f.signs : [];
  var cells = [];
  for (var k = 0; k < signs.length; k++){
    var parts = String(signs[k].text || '').split(' · ');
    cells.push([signs[k].role, parts[0] || '', parts.length > 2 ? parts[1] : '', parts[parts.length - 1] || '']);
  }
  if (!cells.length){
    cells = [['ผู้ขอเคลม', h['ผู้ขอเคลม'], h['แผนก'], ''], ['ผู้อนุมัติ','','',''],
             ['สโตร์','','',''], ['จัดซื้อ','','',''], ['ผู้ปิดงาน','','','']];
  }
  var t = '<div class="blk"><div class="sg manual">';
  for (var i = 0; i < cells.length; i++){
    t += '<div><div class="role">' + esc(cells[i][0]) + '</div>' +
         (cells[i][1] ? '<div class="nm">' + esc(cells[i][1]) + '</div><div class="ps">' + esc(cells[i][2]) + '</div>'
                      : '<div class="ln">ลงชื่อ</div>') +
         '<div class="dt">' + (cells[i][3] ? esc(cells[i][3]) : 'วันที่ ______________') + '</div></div>';
  }
  t += '</div></div>';
  if (f && f.history && isInternal()){
    t += '<div class="blk"><div class="phcap" style="margin-top:4px">ประวัติการส่งต่อ: ' +
         esc(String(f.history).split('\n').join(' · ')) + '</div></div>';
  }
  return t;
}

/** รูปหลักฐาน — อยู่ในทุกฉบับ รวมฉบับส่ง Supplier ด้วย
 *  เบียร์: "รูปภาพ มันดูเล็กเกินไปส่งหา Sup ไม่ได้หรอกนะ เค้าจะมองเห็นที่ไหนหล่ะ"
 *  รูปคือหลักฐานที่ใช้เถียงกับ Supplier — เล็กแล้วมองไม่ออกก็ไม่มีประโยชน์
 *  เบียร์: "ไซส์รูป 3 รูป / บรรทัด ถ้ามี 4 รูป อีกรูปนึงไซส์รูปก็ต้องเท่ากันนะ"
 *  → **3 รูปต่อแถว · ทุกรูปขนาดเท่ากันหมด** ไม่ว่าแถวสุดท้ายจะเหลือกี่รูป
 *    เนื้อที่กว้าง 742px → ช่องละ ~239 × 230 px
 *    ใช้ grid 3 คอลัมน์ตายตัว รูปที่เหลือรูปเดียวจึงอยู่คอลัมน์แรกด้วยขนาดเท่าเดิม
 *    ไม่ยืดเต็มแถว (ถ้ายืด รูปจะใหญ่ไม่เท่ากันแล้วดูเทียบกันไม่ได้)
 *  ก้อนละ 1 แถว (3 รูป) สูงราว 260px → 3 ก้อนอยู่ในหน้าเดียวได้ */
function blkPhotos(items){
  var out = [];
  for (var i = 0; i < items.length; i++){
    var seq = String(items[i].seq), ph = PHOTOS[seq] || [];
    if (!ph.length) continue;

    var perChunk = 3;                                 // 3 รูปต่อแถว = 1 ก้อน
    for (var c = 0; c < ph.length; c += perChunk){
      var part = ph.slice(c, c + perChunk);
      var t = '<div class="blk"><div class="capt">รูปหลักฐาน · รายการที่ ' + esc(seq) + ' · ' + esc(items[i].name) +
              (ph.length > perChunk ? ' <span style="font-weight:400;color:#666">(รูปที่ ' + (c+1) + '–' +
                Math.min(c + perChunk, ph.length) + ' จาก ' + ph.length + ')</span>' : '') + '</div>';
      t += '<div class="picbig">';
      for (var k = 0; k < part.length; k++){
        t += '<div><img src="' + bigPhoto(part[k].thumb) + '" alt="รูปที่ ' + (c+k+1) + '"></div>';
      }
      t += '</div></div>';
      out.push(t);
    }
  }
  return out;
}
/** ขอรูปความละเอียดสูงจาก Drive — ตัวย่อ w1000 ชัดพอสำหรับปริ้น A4 */
function bigPhoto(url){
  return String(url || '').replace(/sz=w\d+/, 'sz=w1600');
}
function num2(v){ var n = Number(String(v == null ? '' : v).replace(/,/g,'')); return isNaN(n) ? 0 : n; }

/* ─────────── จัดหน้า A4 ───────────
   วัดความสูงจริงของแต่ละก้อนก่อน แล้วค่อยจัดลงหน้า
   ทำแบบนี้เพราะข้อความไทยยาวไม่เท่ากันทุกใบ กะด้วยตาไม่ได้ */
function paginate(){
  var host = $('prPages');
  var sets = host.querySelectorAll('.docset');
  var out = '';
  for (var s = 0; s < sets.length; s++){
    var sup = sets[s].getAttribute('data-sup');
    var blks = sets[s].querySelectorAll('.blk');
    var pages = [[]], used = 0;
    for (var b = 0; b < blks.length; b++){
      var hgt = blks[b].offsetHeight + 6;
      if (used + hgt > PAGE_H - (pages.length === 1 ? headHeight() : contHeight()) && pages[pages.length-1].length){
        pages.push([]); used = 0;
      }
      pages[pages.length-1].push(blks[b].outerHTML);
      used += hgt;
    }
    for (var p = 0; p < pages.length; p++){
      out += '<div class="page">' +
        (p === 0 ? pageHead(sup) : pageHeadCont(sup, p + 1)) +
        pages[p].join('') +
        pageFoot(p + 1, pages.length) + '</div>';
    }
  }
  host.innerHTML = out;
}
function headHeight(){ return 210; }     // หัวกระดาษเต็ม + ชื่อเอกสาร
function contHeight(){ return 62; }      // หัวกระดาษย่อของหน้า 2 เป็นต้นไป

function pageHead(sup){
  var h = CLAIM.head, ti = docTitle();
  /* หัวกระดาษจริงของบริษัท ฝัง base64 ไว้ในหน้า — ปริ้นแล้วติดแน่นอน
     ไม่ต้องรอโหลดไฟล์จากที่อื่นซึ่งอาจมาไม่ทันตอนสั่งปริ้น */
  var t = '<div class="hdr"><img src="' + STT_LOGO + '" alt="SUTEE"></div><div class="hdrline"></div>' +
    '<div class="ptop"><div class="sp"></div><table>' +
    '<tr><td class="l">เลขที่เอกสาร</td><td class="v">' + esc(h['เลขที่เอกสาร']) + '</td></tr>' +
    '<tr><td class="l">วันที่</td><td class="v">' + esc(h['วันที่']) + '</td></tr>' +
    '</table></div>';
  t += '<h1 class="tt">' + ti[0] + '<small>' + ti[1] + '</small></h1>';
  t += '<div class="c"><span class="ribbon' + (isInternal() ? '' : ' ext') + '">' +
       (isInternal() ? 'ฉบับภายในบริษัท — ห้ามส่งออก' : 'ฉบับส่ง Supplier' + (sup ? ' · ' + esc(sup) : '')) +
       '</span></div>';
  return t;
}
function pageHeadCont(sup, n){
  var h = CLAIM.head, ti = docTitle();
  return '<div class="hcnote">' + ti[0] + ' · เลขที่ ' + esc(h['เลขที่เอกสาร']) +
         ' · JOB ' + esc(h['เลขที่ JOB']) + (sup ? ' · ' + esc(sup) : '') + ' — หน้า ' + n + '</div>';
}
function pageFoot(n, total){
  /* FM-WH-03 Rev.00 = รหัสฟอร์มของใบเคลม (เบียร์กำหนด) · ใบตรวจรับยังไม่มีรหัส จึงไม่ใส่ */
  return '<div class="pf"><span>FM-WH-03 Rev.00</span><span class="sp"></span>' +
         '<span>หน้า ' + n + '/' + total + '</span></div>';
}
</script>
