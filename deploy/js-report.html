<script>
/* ═══ ③ All Data and Report ═══
   3.1 รูปและวิดีโอ · 3.2 สรุปงานเคลมตามจ๊อบ · 3.3 ทะเบียนเอกสาร · 3.4 สรุปต้นทุน */

/** ตัวเลขเงิน — คั่นหลักพัน ทศนิยม 2 ตำแหน่ง ให้อ่านง่ายในตาราง */
function fmt(n){
  var v = Number(String(n == null ? 0 : n).replace(/,/g, '')) || 0;
  return v.toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 });
}

function loadReportHome(){
  var t = '<div class="card"><div class="cardhd"><h3>All Data and Report</h3>' +
    '<button class="btn" onclick="go(\'home\')">← หน้าแรก</button></div>';
  t += '<div class="repgrid">';
  t += rep('repmedia','📷','3.1 รูปและวิดีโอ','รูปทั้งหมดในระบบ จัดตามจ๊อบ → เอกสาร กดดูใหญ่ได้ทันที');
  t += rep('repjob','🚛','3.2 สรุปงานเคลมตามจ๊อบงาน','จ๊อบไหนมีใบตรวจ/ใบเคลมกี่ใบ ค้างกี่ใบ — เลขจ๊อบคือแกนหลักของทั้งระบบ');
  t += rep('repdocs','🗂️','3.3 ทะเบียนเอกสาร','ใบตรวจรับ + ใบเคลม อยู่ในตารางเดียว เรียงตามเลขที่');
  t += rep('repcost','💰','3.4 สรุปต้นทุนการเคลม','ยอดเงินรวมทุกใบ แยกบาท / สกุลต่างประเทศ — เห็นเฉพาะผู้บริหารและจัดซื้อ');
  t += rep('repbill','🧾','3.5 รวมยอดเรียกเก็บ → ออกใบเดียว','รวมหลายใบเคลมของ Supplier เจ้าเดียวกัน ออกใบเรียกเก็บใบเดียว เลขชุด CDN ของตัวเอง');
  t += rep('rephr','👥','3.6 รายงานส่ง HR','ใบที่ระบุว่าพนักงานทำเสียหาย — ส่งให้ HR ไปหักเงินตามระเบียบ');
  t += rep('repacc','📒','3.7 ข้อมูลส่งบัญชี','ใบที่จบขั้นตอนแล้ว บัญชีรับข้อมูลอย่างเดียว ไม่ต้องกดติ๊กอะไร');
  t += rep('replog','🕘','3.8 LOG ประวัติการใช้งาน','ใครทำอะไรกับใบไหน เมื่อไหร่ — เก็บคนละที่กับตัวเอกสาร');
  t += '</div></div>';
  $('view').innerHTML = t;
}
function rep(v, ic, title, sub){
  return '<div class="repcard" onclick="go(\'' + v + '\')"><div class="ic">' + ic + '</div>' +
         '<h4>' + esc(title) + '</h4><p>' + esc(sub) + '</p></div>';
}
function repHead(title, sub){
  return '<div class="cardhd"><h3>' + esc(title) + '</h3><span class="sub">' + esc(sub) + '</span>' +
         '<button class="btn" onclick="go(\'reports\')">← รายงานทั้งหมด</button></div>';
}


/* ─── 3.5 รวมยอดเรียกเก็บ → ออกใบเดียว ───
   เบียร์: "ตอนเรียกเก็บเงิน สามารถรวมยอดจากใบเคลมสินค้าหลายใบ และออกใบรับเงินใบเดียวได้" */
function loadRepBill(){
  srv('reportBilling', [AUTH], function(d){
    var t = '<div class="card">' + repHead('3.5 รวมยอดเรียกเก็บ → ออกใบเดียว',
      'รวมได้เฉพาะใบของ Supplier เจ้าเดียวกัน และเฉพาะใบที่ผลการเคลมบอกว่าต้องเรียกเงิน');
    t += '<div class="hint" style="margin-bottom:12px">📌 <b>ใบรวมมีเลขที่ของตัวเอง CDN-YY/NNNN</b> ' +
         '(คนละชุดกับเลขใบส่งมอบ DN- ที่ใช้อยู่แล้ว) แต่ยังอ้างอิงเลขใบเคลมทุกใบที่รวมเข้ามา ตรวจย้อนได้</div>';
    if (!d.groups.length){
      t += '<div class="empty">ยังไม่มีใบเคลมที่ถึงขั้นเรียกเก็บเงิน</div></div>';
      $('view').innerHTML = t; return;
    }
    for (var i = 0; i < d.groups.length; i++){
      var g = d.groups[i];
      t += '<div class="billgrp"><div class="cardhd"><h3>' + esc(g.supplier) + '</h3>' +
        '<span class="sub">' + g.rows.length + ' ใบเคลม · รวม ' + fmt(g.sum) + ' บาท</span></div>';
      t += '<div class="tblwrap"><table class="grid"><thead><tr>' +
        '<th style="width:44px">รวม</th><th style="width:132px">เลขที่ใบเคลม</th>' +
        '<th style="width:92px">วันที่</th><th style="width:128px">เลขที่ JOB</th>' +
        '<th>ผลการเคลม</th><th style="width:118px">ยอดเรียกเก็บ</th>' +
        '<th style="width:150px">สถานะ</th></tr></thead><tbody>';
      for (var k = 0; k < g.rows.length; k++){
        var r = g.rows[k], done = !!r.billNo;
        t += '<tr><td class="c"><input type="checkbox" class="bchk" data-grp="' + i + '" ' +
             'value="' + esc(r.docNo) + '"' + (done ? ' disabled' : ' checked') + '></td>' +
          '<td><a class="lk" onclick="go(\'claim\',\'' + esc(r.docNo) + '\')">' + esc(r.docNo) + '</a></td>' +
          '<td class="c">' + esc(r.date) + '</td><td>' + esc(r.jobNo) + '</td>' +
          '<td>' + esc(r.result) + '</td><td class="r">' + fmt(r.amount) + '</td>' +
          '<td class="c">' + (done ? '<span class="pill ok">ออกใบรวมแล้ว ' + esc(r.billNo) + '</span>'
                                   : '<span class="pill warn">ยังไม่เรียกเก็บ</span>') + '</td></tr>';
      }
      t += '<tr class="sumrow"><td colspan="5" class="r">ยอดรวมของเจ้านี้ (ไม่มี VAT)</td>' +
           '<td class="r b">' + fmt(g.sum) + '</td><td></td></tr>';
      t += '</tbody></table></div>' +
        '<div style="margin-top:8px"><button class="btn primary" onclick="makeBill(' + i + ')">' +
        '🧾 ออกใบเรียกเก็บรวมของ ' + esc(g.supplier) + '</button> ' +
        '<span class="hint">ระบบออกเลข CDN ใหม่ 1 เลข แล้วผูกกับใบเคลมทุกใบที่ติ๊กไว้</span></div></div>';
    }
    t += '</div>';
    $('view').innerHTML = t;
  });
}
function makeBill(gi){
  var picked = [];
  var els = document.querySelectorAll('.bchk[data-grp="' + gi + '"]');
  for (var i = 0; i < els.length; i++) if (els[i].checked && !els[i].disabled) picked.push(els[i].value);
  if (!picked.length){ alert('ยังไม่ได้ติ๊กใบที่จะรวม'); return; }
  if (!confirm('ออกใบเรียกเก็บรวม ' + picked.length + ' ใบเคลม เป็นใบเดียว?')) return;
  srv('makeConsolidatedBill', [picked, AUTH], function(r){
    alert('🧾 ออกใบเรียกเก็บรวมแล้ว ' + r.billNo + '\n\n' +
          'Supplier: ' + r.supplier + '\nรวม ' + r.rows.length + ' ใบเคลม · ' + r.total + ' บาท\n\n' +
          'ใบเคลมที่รวมไปแล้วจะไม่ถูกดึงมารวมซ้ำอีก');
    loadRepBill();
  }, function(m){ alert(m); });
}

/* ─── 3.1 รูปและวิดีโอ ─── */
function loadRepMedia(){
  busy(true, 'กำลังรวบรวมรูปทั้งระบบ…');
  srv('reportMedia', [AUTH], function(jobs){
    var t = '<div class="card">' + repHead('3.1 รูปและวิดีโอ', 'จัดตามจ๊อบ → เอกสาร · กดที่รูปเพื่อดูใหญ่');
    if (!jobs || !jobs.length){
      t += '<div class="empty">ยังไม่มีรูปในระบบ<br><span>รูปจะขึ้นที่นี่อัตโนมัติเมื่อแนบรูปในใบตรวจรับหรือใบเคลม</span></div></div>';
      $('view').innerHTML = t; return;
    }
    t += '</div>';
    for (var i = 0; i < jobs.length; i++){
      var j = jobs[i];
      t += '<div class="card"><div class="cardhd"><h3>' + esc(j.jobNo) + '</h3>' +
           '<span class="sub">' + esc(j.jobName) + ' · ' + j.n + ' รูป</span></div>';
      for (var k = 0; k < j.docs.length; k++){
        var d = j.docs[k];
        t += '<div class="mediadoc"><div class="mdhd">' +
             '<span class="pill ' + (d.kind === 'ใบตรวจรับ' ? '' : 'red') + '">' + esc(d.kind) + '</span> ' +
             '<a onclick="go(\'' + (d.kind === 'ใบตรวจรับ' ? 'ins' : 'claim') + '\',\'' + esc(d.docNo) + '\')">' +
             esc(d.docNo) + ' ↗</a></div><div class="phwrap">';
        for (var p = 0; p < d.photos.length; p++){
          var ph = d.photos[p];
          /* เบียร์: "ใน Report ก็ต้องชัดเจนด้วยนะ" — รูปใหญ่ขึ้น กดแล้วขยายเต็มจอได้ */
          t += '<div class="phcell rep"><img src="' + ph.thumb + '" title="รายการที่ ' + esc(ph.seq) + ' — กดเพื่อดูเต็มจอ" ' +
               'onclick="zoomPhoto(\'' + ph.view + '\',\'' + ph.thumb + '\')"' +
               ' onerror="this.parentNode.classList.add(\'bad\')"><span class="phseq">ข้อ ' + esc(ph.seq) + '</span></div>';
        }
        t += '</div></div>';
      }
      t += '</div>';
    }
    $('view').innerHTML = t;
  });
}

/* ─── 3.3 ทะเบียนเอกสาร ─── */
/* ═══ ทะเบียนเอกสารที่ส่ง Supplier ═══════════════════════════
 * เบียร์: "จ๊อบนี้เคยออกเอกสารอะไรไปให้ใครบ้าง ออกเมื่อไหร่ ใครออก"

 *    กดแล้วขึ้น "ไม่รู้จักหน้า supdoc" ตัวแดง — ตอนนี้มีของจริงแล้ว */
function loadSupDocs(){
  busy(true, 'กำลังโหลดทะเบียนเอกสารที่ส่ง Supplier…');
  srv('reportSupplierDocs', [AUTH], function(r){
    var rows = (r && r.rows) || [];
    var t = '<div class="card">' + repHead('ทะเบียนเอกสารที่ส่ง Supplier',
        rows.length + ' ฉบับ · ' + ((r && r.nJob) || 0) + ' จ๊อบ — นับเฉพาะฉบับที่ส่งออกจริง (ฉบับภายในไม่นับ)');
    if (!rows.length){
      t += '<div class="empty">ยังไม่เคยส่งเอกสารให้ Supplier<br>' +
           '<span>พอกดปริ้นฉบับ ① แจ้งเคลม หรือ ② เรียกเก็บ ระบบจะบันทึกไว้ที่นี่เอง</span></div></div>';
      $('view').innerHTML = t; busy(false); return;
    }
    t += '<div class="tblwrap"><table class="grid"><thead><tr>' +
      '<th>เลขที่ใบเคลม</th><th>เลขที่ JOB</th><th>ส่งให้ Supplier</th>' +
      '<th>ส่งออกเมื่อ</th><th>ใครออก</th><th>ใบเรียกเก็บรวม</th>' +
      '<th>คำตอบจาก Supplier</th><th>ขั้นตอนตอนนี้</th></tr></thead><tbody>';
    for (var i = 0; i < rows.length; i++){
      var x = rows[i];
      t += '<tr>' +
        '<td><a href="#" onclick="go(\'claim\',\'' + esc(x.docNo) + '\');return false"><b>' + esc(x.docNo) + '</b></a></td>' +
        '<td>' + esc(x.jobNo) + '<div class="sub2">' + esc(x.jobName) + '</div></td>' +
        '<td>' + esc(x.supplier) + '</td>' +
        '<td>' + (x.sentAt ? esc(x.sentAt) : '<span class="dim">— ยังไม่ได้ปริ้นส่ง —</span>') + '</td>' +
        '<td>' + esc(x.sentBy || '—') + '</td>' +
        '<td>' + (x.cdn ? '<b>' + esc(x.cdn) + '</b><div class="sub2">' + esc(x.cdnDate) + '</div>' : '<span class="dim">—</span>') + '</td>' +
        '<td>' + (x.reply ? esc(x.reply) : '<span class="dim">— ยังไม่ตอบ —</span>') + '</td>' +
        '<td>' + esc(x.stageName || x.stage) + '</td></tr>';
    }
    t += '</tbody></table></div>';
    t += '<div class="modtag">ระบบบันทึกให้เองทุกครั้งที่กดปริ้นฉบับส่ง Supplier · ' +
         'ฉบับภายในไม่ถูกบันทึก เพราะไม่ได้ส่งออกไปหาใคร</div></div>';
    $('view').innerHTML = t; busy(false);
  }, function(m){ $('view').innerHTML = '<div class="msg bad">' + esc(m) + '</div>'; busy(false); });
}

function loadRepDocs(){
  busy(true, 'กำลังโหลดทะเบียนเอกสาร…');
  srv('reportDocs', [AUTH], function(rows){
    var t = '<div class="card">' + repHead('3.3 ทะเบียนเอกสาร', 'ใบตรวจรับ + ใบเคลม รวมกัน · ' + ((rows && rows.length) || 0) + ' ฉบับ');

      t += '<div class="empty">ยังไม่มีเอกสารในระบบ</div></div>'; $('view').innerHTML = t; return;
    }
    t += '<table class="t"><thead><tr><th style="width:88px">ชนิด</th><th style="width:116px">เลขที่</th>' +
      '<th style="width:88px">วันที่</th><th style="width:110px">เลขที่ JOB</th><th>ชื่อลูกค้า</th>' +
      '<th style="width:210px">รายละเอียด</th><th style="width:60px">รายการ</th>' +
      '<th style="width:60px">รูป</th><th style="width:110px">สถานะ</th></tr></thead><tbody>';
    for (var i = 0; i < rows.length; i++){
      var r = rows[i], isIns = (r.kind === 'ใบตรวจรับ');
      t += '<tr style="cursor:pointer" onclick="go(\'' + (isIns ? 'ins' : 'claim') + '\',\'' + esc(r.docNo) + '\')">' +
        '<td><span class="pill' + (isIns ? '' : ' red') + '">' + esc(r.kind) + '</span></td>' +
        '<td><b>' + esc(r.docNo) + '</b></td><td class="c">' + esc(r.date) + '</td>' +
        '<td>' + esc(r.jobNo) + '</td><td>' + esc(r.jobName) + '</td>' +
        '<td class="hint">' + esc(r.detail) + '</td>' +
        '<td class="c">' + (r.n || '—') + '</td><td class="c">' + (r.photos || '—') + '</td>' +
        '<td class="c">' + esc(r.status) + '</td></tr>';
    }
    t += '</tbody></table></div>';
    $('view').innerHTML = t;
  });
}

        '<td>' + esc(x.jobNo) + '</td><td>' + esc(x.jobName) + '</td>' +
        '<td>' + esc(x.jmc || '—') + '</td>' +

    }

      '<th class="r">' + money(r.grand) + '</th><th></th></tr></tfoot></table>';

    t += '</div>';
    $('view').innerHTML = t;
  }, function(m){
    $('view').innerHTML = '<div class="card">' + repHead('3.4 สรุปต้นทุนการเคลม', '') +
      '<div class="empty">🔒 ' + esc(m) + '<br><span>หน้านี้เห็นเฉพาะผู้บริหารและจัดซื้อ เพราะมีตัวเลขเงิน</span></div></div>';
  });
}
