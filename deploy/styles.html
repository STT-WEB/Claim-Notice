<style>
/* ═══════════ ยกระบบสีและโครงหน้าตาจาก STT NOVA มาทั้งหมด ═══════════ */
:root{--red:#E2231A; --red-d:#b91c15; --black:#141414; --ink:#1c1c1e;
  --bg:#f5f5f6; --card:#ffffff; --line:#e5e5e7; --muted:#6b7280;
  --ok:#16a34a; --wip:#d97706;}
*{box-sizing:border-box}
body{font-family:"Sarabun","Segoe UI",Tahoma,sans-serif;margin:0;
  background:linear-gradient(180deg,#fbf7f7,#f3f3f5 320px) fixed,var(--bg);color:var(--ink);font-size:14.5px}
a{color:#1a56b8}

/* ─────── หน้า LOGIN (เหมือน NOVA เป๊ะ) ─────── */
#loginScreen{position:fixed;inset:0;background:radial-gradient(1300px 560px at 68% -12%,#43120f 0%,#161418 46%,#08080a 100%);
  z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px}
.loginbox{position:relative;border-radius:24px;overflow:hidden;max-width:940px;width:100%;
  border:1px solid #26262b;box-shadow:0 34px 90px -34px rgba(226,35,26,.4);
  display:grid;grid-template-columns:1.15fr .85fr;background:#0e0e11}
.lg-left{padding:46px 44px;display:flex;flex-direction:column;justify-content:center}
.lg-brandline{font-size:12px;letter-spacing:5px;color:#9a9aa2;font-weight:700;margin-bottom:12px}
.lg-big{font-size:52px;line-height:1.02;font-weight:900;letter-spacing:1px;
  background:linear-gradient(92deg,#fff 28%,#ff5a4d 108%);-webkit-background-clip:text;background-clip:text;color:transparent}
.lg-big span{display:block}
.lg-sub{margin-top:14px;color:#c7c7cf;font-size:14.5px;max-width:400px;line-height:1.55}
.lg-truck{margin-top:20px}
.lg-right{background:rgba(255,255,255,.045);border-left:1px solid #26262b;padding:44px 38px;
  display:flex;flex-direction:column;justify-content:center}
.lg-right h2{font-size:22px;margin:0 0 3px;color:#fff}
.loginbox .sub{font-size:13px;color:#9a9aa2;margin-bottom:18px}
.lgtabs{display:flex;gap:6px;margin:2px 0 16px}
.lrole{flex:1;padding:11px;border:1.5px solid #33333a;border-radius:11px;background:rgba(255,255,255,.03);
  color:#c7c7cf;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;transition:.15s}
.lrole:hover{border-color:var(--red)}
.lrole.on{border-color:var(--red);background:linear-gradient(100deg,#141414,#E2231A);color:#fff}
.lglabel{display:block;font-size:12.5px;color:#c7c7cf;margin:0 0 6px 2px;font-weight:600}
.pininput{width:100%;padding:13px 14px;border:1.5px solid #33333a;border-radius:11px;font-size:16px;
  background:#151519;color:#fff;font-family:inherit;margin:0 0 14px}
.pininput:focus{outline:none;border-color:#ff5a4d}
.pininput.pin{letter-spacing:5px}
.lbtn{width:100%;padding:14px;border:none;border-radius:11px;background:linear-gradient(100deg,#141414,#E2231A);
  color:#fff;font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;letter-spacing:.4px}
.lbtn:hover{filter:brightness(1.08)}
.lerr{color:#ff8880;font-size:13px;font-weight:600;margin-top:8px;min-height:18px}
.loginbox .muted{color:#8a8a92}
@media (max-width:820px){ .loginbox{grid-template-columns:1fr} .lg-left{display:none} }

/* ─────── แถบหัว (หัวขาว ตามที่เบียร์ปรับใน NOVA) ─────── */
.top{background:#fff;border-bottom:3px solid var(--red);padding:0 22px;display:flex;align-items:center;
  height:74px;gap:14px;box-shadow:0 2px 10px rgba(0,0,0,.05);position:sticky;top:0;z-index:60}
.brand{display:flex;align-items:center;gap:14px}
.brand .logo{height:50px;width:auto;display:block}
.brand .div{width:1px;height:36px;background:var(--line)}
.brand .app b{color:var(--red);font-weight:800;font-style:italic;font-size:18px;letter-spacing:.5px;line-height:1}
.brand .app span{color:#6b7280;font-size:11.5px;display:block;margin-top:2px}
.top .right{margin-left:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ver{color:#6b7280;font-size:11px;border:1px solid var(--line);border-radius:20px;padding:2px 9px}
.who{color:#6b7280;font-size:12.5px}
.tblink{color:#444;text-decoration:none;font-size:13.5px;font-weight:600;padding:6px 10px;border-radius:8px}
.tblink:hover{background:#faf0f0;color:var(--red)}

/* ─────── โครงหน้า ─────── */
.wrap{max-width:1720px;margin:0 auto;padding:24px 30px 40px}
.hero{margin-bottom:18px}
.hero h1{margin:0;font-size:23px;font-weight:800;letter-spacing:.3px}
.hero p{margin:5px 0 0;color:var(--muted);font-size:13.5px}

/* ─────── ปุ่ม / ชิป ─────── */
.btn{background:linear-gradient(135deg,var(--red),#ff5b52);color:#fff;border:none;border-radius:9px;padding:9px 16px;
  font-family:inherit;font-weight:700;cursor:pointer;font-size:13px;box-shadow:0 4px 12px rgba(226,35,26,.26);transition:.14s}
.btn:hover{filter:brightness(1.07);transform:translateY(-1px);box-shadow:0 7px 17px rgba(226,35,26,.34)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--red);color:var(--red);filter:none;transform:none}
.btn.dark{background:var(--black);box-shadow:none}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none;transform:none}
.chipx{border:1px solid var(--line);border-radius:14px;padding:4px 11px;cursor:pointer;background:#fff;font-size:12px;white-space:nowrap}
.chipx:hover{border-color:var(--red)}
.chipx.on{background:var(--red);color:#fff;border-color:var(--red);font-weight:600}

/* ─────── การ์ด / ไทล์ ─────── */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:18px;
  box-shadow:0 6px 18px -12px rgba(0,0,0,.25)}
.card h3{margin:0 0 14px;font-size:16px;font-weight:800;border-bottom:2px solid var(--black);padding-bottom:7px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-bottom:18px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 18px;cursor:pointer;
  transition:.18s cubic-bezier(.2,.7,.3,1);position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--red),#ff6a60);opacity:0;transition:.18s}
.tile:hover{transform:translateY(-5px);box-shadow:0 16px 34px rgba(226,35,26,.15);border-color:#f3b7b3}
.tile:hover::before{opacity:1}
.tile .ic{width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:25px;
  background:linear-gradient(135deg,#E2231A,#ff6a60);color:#fff;margin-bottom:14px;box-shadow:0 7px 16px rgba(226,35,26,.3)}
.tile:hover .ic{transform:scale(1.06) rotate(-3deg);transition:.18s}
.tile h3{margin:0 0 5px;font-size:15.5px;font-weight:800;color:var(--ink);border:none;padding:0}
.tile p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.55}
.tile.soon{opacity:.6;cursor:default}
.tile.soon:hover{transform:none;box-shadow:none;border-color:var(--line)}

/* ─────── ฟอร์มแบบกระชับ (ป้ายซ้าย ช่องขวา บรรทัดเดียวจบ) ─────── */
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 22px}
@media (max-width:1250px){ .fgrid{grid-template-columns:repeat(2,1fr)} }
@media (max-width:800px){ .fgrid{grid-template-columns:1fr} }
.frow{display:flex;align-items:center;gap:8px;padding:3px 0;border-bottom:1px dotted #e8e8ea}
.frow>label{width:120px;min-width:120px;font-size:12.5px;color:#555;font-weight:600;text-align:right}
.frow>label i{font-style:normal;color:#b9b9bd;font-weight:400;font-size:11px}
.frow>input,.frow>select{flex:1;min-width:0;padding:5px 8px;border:1px solid var(--line);border-radius:7px;
  font-family:inherit;font-size:13.5px;background:#fff;height:30px}
.frow>input:focus,.frow>select:focus{outline:none;border-color:var(--red);background:#fffdfd}
.frow.wide>label{width:120px}
.cardhd{display:flex;align-items:center;gap:12px;margin:0 0 10px;border-bottom:2px solid var(--black);padding-bottom:7px}
.cardhd h3{margin:0;font-size:16px;font-weight:800;border:none;padding:0;flex:1}
.cardhd .sub{font-size:12px;color:var(--muted);font-weight:400}
.card.tight{padding:14px 18px 12px;margin-bottom:14px}

/* ─────── ฟอร์ม (แบบเดิม ใช้ในหน้าอื่น) ─────── */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 26px}
@media (max-width:900px){ .grid2{grid-template-columns:1fr} }
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.fld label{font-size:12.5px;color:var(--muted);font-weight:600}
.fld input,.fld select,.fld textarea{padding:8px 11px;border:1px solid var(--line);border-radius:9px;
  font-family:inherit;font-size:14px;background:#fff}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--red)}
.fld textarea{min-height:56px;resize:vertical}
.hint{font-size:12px;color:var(--muted)}

/* ─────── ตาราง ─────── */
table.t{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff}
table.t th{background:#f7f7f8;border:1px solid #e2e5ea;padding:7px 6px;font-size:12.5px;font-weight:700;color:#333}
table.t td{border:1px solid #edf0f5;padding:5px 7px}
table.t tbody tr:hover td{background:#fafafb}
table.t input,table.t select,table.t textarea{width:100%;border:1px solid #e2e5ea;border-radius:6px;
  padding:5px 6px;font-family:inherit;font-size:13px;background:#fff}
table.t input:focus,table.t textarea:focus{outline:none;border-color:var(--red)}
table.t textarea{min-height:34px;resize:vertical}
.r{text-align:right}.c{text-align:center}
.rowbtn{background:none;border:none;color:#bbb;cursor:pointer;font-size:15px}
.rowbtn:hover{color:var(--red)}

/* ─────── ข้อความแจ้ง ─────── */
.msg{padding:10px 14px;border-radius:10px;font-size:13.5px;margin-bottom:14px}
.msg.good{background:#eafaf1;border:1px solid #a9e1c4;color:#0f6e40}
.msg.bad{background:#fdeeed;border:1px solid #e6a9a4;color:#8f130c}
.ok{color:var(--ok);font-weight:700}
.warn{color:var(--wip)}
.err{color:var(--red);font-weight:700}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #eee;border-top-color:var(--red);
  border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

@media print{
  .noprint,.top{display:none!important}
  body{background:#fff}
  .wrap{padding:0;max-width:none}
  @page{margin:0}
}
</style>
<style>
/* ═══ รูปหลักฐาน — ต้องเห็นชัดทุกหน้า ═══ */
.phwrap{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
.phcell{position:relative;width:150px;height:112px;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fafafb}
.phcell img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in;transition:.15s}
.phcell img:hover{transform:scale(1.05)}
.phcell.bad::after{content:'โหลดรูปไม่ขึ้น';position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;background:#fdeeed;color:#8f130c;font-size:11.5px}
.phdel{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:none;
  background:rgba(0,0,0,.55);color:#fff;cursor:pointer;font-size:12px;line-height:1;opacity:0;transition:.15s}
.phcell:hover .phdel{opacity:1}
.phdel:hover{background:var(--red)}
.phadd{width:150px;height:112px;border:2px dashed #cfcfd4;border-radius:9px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;color:#aaa;cursor:pointer;transition:.15s;background:#fff}
.phadd:hover{border-color:var(--red);color:var(--red);background:#fffafa}
.phadd b{font-size:26px;line-height:1}
.phadd span{font-size:12px;margin-top:3px}
.phwarn{margin-top:6px;font-size:12px;color:#8f130c;background:#fdeeed;border:1px solid #e6a9a4;
  border-radius:8px;padding:4px 10px;display:inline-block}
.phmsg{font-size:12px;margin-top:5px;min-height:16px;color:var(--muted)}
.phmsg.good{color:var(--ok)}
.phmsg.bad{color:var(--red);font-weight:700}
.phmsg.wait{color:var(--wip)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:9998;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.lightbox img{max-width:96%;max-height:88%;object-fit:contain;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.lbbar{position:absolute;top:14px;right:18px;display:flex;gap:10px;align-items:center}
.lbbar a{color:#ffd9d6;font-size:13px;text-decoration:none;background:rgba(255,255,255,.1);padding:7px 13px;border-radius:8px}
.lbbar a:hover{background:rgba(255,255,255,.2)}
.lbbar button{background:var(--red);color:#fff;border:none;border-radius:8px;padding:7px 15px;
  font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
.itemcard{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;background:#fff}
.itemcard .ihd{display:flex;gap:10px;align-items:baseline;margin-bottom:6px}
.itemcard .ino{width:26px;height:26px;border-radius:8px;background:var(--red);color:#fff;font-weight:800;
  display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.itemcard .inm{font-size:15px;font-weight:800}
.itemcard .icode{font-size:12px;color:var(--muted)}
.itemcard .idesc{font-size:13.5px;line-height:1.5;margin:4px 0 10px}
.itemcard .ien{font-size:12px;color:#888;font-style:italic;border-top:1px dotted #eee;padding-top:4px;margin-top:4px}
.itemcard .imeta{font-size:12px;color:var(--muted);margin-bottom:9px}
/* ── v0.2.0 · แถบสรุปความครบของรูป ── */
.phbar{margin-top:10px;padding:8px 12px;border-radius:9px;font-size:13px;font-weight:600;border:1px solid}
.phbar.good{background:#eefaf1;border-color:#a9dcb8;color:#14612e}
.phbar.bad{background:#fdeeed;border-color:#e6a9a4;color:#8f130c}
.phnote{font-size:12.5px;color:#8f130c;background:#fdeeed;border:1px solid #e6a9a4;border-radius:8px;
        padding:7px 11px;margin-top:8px;line-height:1.5}
/* ป้ายสถานะรูปในทะเบียน */
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;
      border:1px solid var(--line);color:var(--muted);background:#fafafb;white-space:nowrap}
.pill.red{background:#fdeeed;border-color:#e6a9a4;color:#8f130c}
.pill.green{background:#eefaf1;border-color:#a9dcb8;color:#14612e}

/* ═══════════ v0.3.0 · ทั้งระบบ ═══════════ */

/* ── แถบ KPI เล็ก ๆ บนหน้าแรก (เบียร์: "กล่องเล็กๆ พอ · ต้นทุนเอาออก") ── */
.kpirow{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.kpi{display:inline-flex;align-items:baseline;gap:6px;font-size:12px;color:var(--muted);
     background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 11px;white-space:nowrap}
.kpi b{font-size:15px;font-weight:800;color:var(--ink)}
.kpi.warn{border-color:#e8c89a;background:#fff9ef}
.kpi.warn b{color:#8a5a00}
.kpi.bad{border-color:#e6a9a4;background:#fdeeed}
.kpi.bad b{color:#8f130c}
.kpiwho{margin-left:auto;font-size:12px;color:var(--muted)}

/* ── 3 กล่องหลักหน้าแรก ── */
.boxes{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
@media(max-width:1100px){.boxes{grid-template-columns:1fr}}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px 16px;
     display:flex;flex-direction:column;box-shadow:0 1px 3px rgba(0,0,0,.04);transition:.15s}
.box:hover{box-shadow:0 6px 20px rgba(0,0,0,.08);transform:translateY(-2px)}
.boxhd{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.boxno{width:24px;height:24px;border-radius:7px;background:var(--red);color:#fff;
       font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.boxic{font-size:26px;line-height:1}
.boxhd h3{margin:0;font-size:17px;font-weight:800}
.boxhd p{margin:1px 0 0;font-size:12px;color:var(--muted)}
.boxul{margin:0 0 14px;padding-left:17px;flex:1}
.boxul li{font-size:12.5px;line-height:1.65;color:#555;margin-bottom:4px}
.boxbtn{display:flex;gap:7px;flex-wrap:wrap}
.boxfoot{margin-top:11px;padding-top:9px;border-top:1px dotted var(--line);
         font-size:12px;color:var(--red);font-weight:700}

/* ── ขั้นตอนเริ่มต้นตอนระบบยังว่าง ── */
.steps{margin:6px 0 0;padding-left:20px}
.steps li{font-size:13px;line-height:1.75;margin-bottom:7px;color:#444}
.empty{text-align:center;padding:34px 20px;color:var(--muted);font-size:14px;font-weight:600}
.empty span{display:inline-block;margin-top:7px;font-size:12.5px;font-weight:400;color:#999}

/* ── แท็บในใบเคลม ── */
.tabs{display:flex;gap:6px;margin-top:12px;border-bottom:2px solid var(--line);padding-bottom:0}
.tabbtn{border:1px solid var(--line);border-bottom:none;background:#fafafb;cursor:pointer;
        padding:9px 15px 8px;border-radius:9px 9px 0 0;text-align:left;margin-bottom:-2px;
        font-family:inherit;transition:.12s}
.tabbtn b{display:block;font-size:13px;font-weight:800;color:#666}
.tabbtn span{display:block;font-size:11px;color:#a0a0a6;margin-top:1px}
.tabbtn:hover{background:#fff}
.tabbtn.on{background:#fff;border-color:var(--line);border-bottom:2px solid #fff}
.tabbtn.on b{color:var(--red)}
.tabbtn.on span{color:#888}
.pane{margin-top:14px}

/* ── แถบบอกสถานะการบันทึกอัตโนมัติ ── */
.savebar{margin-left:auto;font-size:12px;font-weight:700;padding:4px 11px;border-radius:99px;
         border:1px solid var(--line);color:var(--muted);background:#fafafb;white-space:nowrap}
.savebar.ok{background:#eefaf1;border-color:#a9dcb8;color:#14612e}
.savebar.wait{background:#fff7e8;border-color:#e8c89a;color:#8a5a00}
.savebar.bad{background:#fdeeed;border-color:#e6a9a4;color:#8f130c}

/* ── ติ๊กบอกว่าช่องไหนบันทึกแล้ว (ไม่วาดหน้าใหม่ จอไม่เด้ง) ── */
.sv-wait{background:#fff9ef!important;border-color:#e8c89a!important}
.sv-ok{background:#f2fbf5!important;border-color:#a9dcb8!important}
.sv-bad{background:#fdeeed!important;border-color:#e6a9a4!important;box-shadow:0 0 0 2px rgba(226,35,26,.12)}

/* ── ปุ่ม Acc / Un-Acc ── */
.accrow{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:8px 0}
.accbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 13px;
        font-size:12.5px;font-weight:700;color:#666;cursor:pointer;font-family:inherit;transition:.12s}
.accbtn:hover{background:#f6f6f8}
.accbtn.ok.on{background:#1e9e4a;border-color:#1e9e4a;color:#fff}
.accbtn.bad.on{background:var(--red);border-color:var(--red);color:#fff}
.accnote{font-size:12px;color:var(--muted)}
.accnote.ok{color:#14612e;font-weight:700}
.accnote.bad{color:var(--red);font-weight:700}
.accnote.wait{color:#8a5a00}

/* ── การ์ดหัวข้อตรวจ ── */
.itemcard.ins{border-left:4px solid var(--line)}
