<style>
/* ─────────── พื้นฐาน ─────────── */
*{box-sizing:border-box}
:root{--red:#A32D2D;--ink:#141414;--line:#d9d9d9;--pw:794px;--ph:1122px}
body{margin:0;background:#eceff1;color:var(--ink);
     font-family:"TH Sarabun New","Sarabun","Segoe UI",Tahoma,sans-serif;font-size:15px}
a{color:#1a56b8}
.sp{flex:1}
.btn{font-family:inherit;font-size:14px;padding:7px 15px;border-radius:8px;border:1px solid #bbb;
     background:#fff;color:#222;cursor:pointer}
.btn:hover{border-color:#888}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.ghost{background:transparent;border-color:#555;color:#ddd}
.btn.ghost:hover{background:#2a2a2a}
.btn.sm{padding:5px 11px;font-size:13px}
.btn.block{display:block;width:100%;margin-top:14px;padding:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ─────────── หน้าเข้าสู่ระบบ ─────────── */
.loginwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;
           background:linear-gradient(135deg,#141414 0%,#2a2a2a 55%,#4a1414 100%);padding:20px}
.loginbox{display:flex;width:100%;max-width:780px;background:#fff;border-radius:14px;overflow:hidden;
          box-shadow:0 18px 50px rgba(0,0,0,.45)}
.lgleft{flex:1;background:linear-gradient(160deg,#1b1b1b,#3a1010);color:#fff;padding:34px 28px;
        display:flex;flex-direction:column;justify-content:space-between;min-height:330px}
.lgname{font-size:38px;font-weight:800;letter-spacing:2px;line-height:1.05}
.lgsub{color:#e2b4b4;margin-top:6px;font-size:16px}
.lgfoot{font-size:11px;color:#9a9a9a;letter-spacing:1.4px}
.lgright{width:320px;padding:30px 26px}
.lgright h2{margin:0 0 3px;font-size:22px}
.lghint{margin:0 0 16px;color:#777;font-size:13px}
.lgright label{display:block;font-size:13px;color:#555;margin:11px 0 3px}
.lgright input{width:100%;padding:9px 11px;border:1px solid #c8c8c8;border-radius:8px;
               font-family:inherit;font-size:16px;letter-spacing:2px}
.lgright input:focus{outline:none;border-color:var(--red)}
.lgmsg{margin-top:11px;font-size:13.5px;color:var(--red);min-height:19px}

/* ─────────── แถบบน ─────────── */
.topbar{display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;padding:9px 16px;
        position:sticky;top:0;z-index:60}
.tbname{font-weight:800;letter-spacing:1.5px}
.ver{background:#333;color:#bbb;font-size:11px;padding:2px 8px;border-radius:9px}
.tblink{color:#ddd;text-decoration:none;font-size:14px;padding:4px 8px;border-radius:6px}
.tblink:hover{background:#2a2a2a;color:#fff}
.tbwho{color:#bbb;font-size:13px}
.view{padding:18px;max-width:1180px;margin:0 auto}

/* ─────────── การ์ด / ฟอร์ม / ตาราง (ล้อสไตล์ NOVA) ─────────── */
.card{background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.09);padding:16px 18px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:18px;border-bottom:2px solid var(--ink);padding-bottom:5px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.tile{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.09);
      cursor:pointer;border-left:5px solid var(--red)}
.tile:hover{box-shadow:0 5px 18px rgba(0,0,0,.16);transform:translateY(-1px)}
.tile b{display:block;font-size:17px;margin-bottom:3px}
.tile span{color:#777;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
.fld{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
.fld label{font-size:13px;color:#555}
.fld input,.fld select,.fld textarea{padding:7px 9px;border:1px solid #c8c8c8;border-radius:7px;
      font-family:inherit;font-size:14.5px;background:#fff}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--red)}
.fld textarea{min-height:56px;resize:vertical}
.hint{font-size:12px;color:#888}
.ok{color:#1a7a3c;font-weight:700}
.warn{color:#aa8800}
.err{color:var(--red);font-weight:700}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{background:#f2f2f2;border:1px solid #ccc;padding:6px;font-size:13px}
table.t td{border:1px solid #ddd;padding:5px 6px}
table.t tr:hover td{background:#fbf7f7}
table.t input,table.t select,table.t textarea{width:100%;border:1px solid #dcdcdc;border-radius:5px;
      padding:4px 5px;font-family:inherit;font-size:13.5px}
table.t textarea{min-height:34px;resize:vertical}
.r{text-align:right}.c{text-align:center}
.rowbtn{background:none;border:none;color:#999;cursor:pointer;font-size:15px}
.rowbtn:hover{color:var(--red)}
.chipbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid #bbb;background:#fff;border-radius:16px;padding:4px 13px;font-size:13.5px;cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.msg{padding:9px 12px;border-radius:8px;font-size:14px;margin-bottom:12px}
.msg.good{background:#eaf6ee;border-left:4px solid #1a7a3c}
.msg.bad{background:#fdecec;border-left:4px solid var(--red)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #ddd;border-top-color:var(--red);
      border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

@media print{
  .noprint,.topbar{display:none!important}
  body{background:#fff}
  .view{padding:0;max-width:none}
  @page{margin:0}
}
</style>
